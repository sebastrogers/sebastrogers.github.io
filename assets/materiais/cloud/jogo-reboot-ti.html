<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reboot TI · Cloud Computing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg1:#1C3F63; --bg2:#0C1D31; --panel:#FFFFFF; --panel-2:#F1F4F9; --ink:#1B2233; --ink-2:#4A5568; --line:#D6DEEA;
  --acc:#FFC940; --acc-ink:#3A2A00; --blue:#2F80ED; --good:#219653; --bad:#D64036; --r:14px;
  --light:#F2F5FB; --light-2:#B9C6DA;
}
*{box-sizing:border-box;font-variant-ligatures:none}
html,body{margin:0;padding:0}
body{background:radial-gradient(1100px 620px at 50% -12%,#2E6394,var(--bg1) 45%,var(--bg2));background-attachment:fixed;color:var(--light);font-family:"Nunito",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.15}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.px{font-family:"Pixelify Sans","Nunito",sans-serif}

/* topo */
#top{position:sticky;top:0;z-index:40;background:rgba(9,22,40,.88);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:"Pixelify Sans",sans-serif;font-size:1.2rem;letter-spacing:.02em;color:#fff}
.brand small{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--light-2);font-weight:700}
#hud{flex:1;display:flex;justify-content:flex-end;gap:12px;align-items:center;font-size:.86rem;color:var(--light-2)}
#hud b{color:#fff}
.som{font-size:1.05rem;padding:5px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08)}
.som:hover{background:rgba(255,255,255,.18)}

#app{max-width:1220px;margin:0 auto;padding:26px 18px 60px}

/* texto sobre o fundo escuro (fora de cartões) */
.kicker{font-family:"Pixelify Sans",sans-serif;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:#8FD0FF;margin-bottom:8px}
.titulo{font-family:"Pixelify Sans",sans-serif;font-size:clamp(1.6rem,4vw,2.4rem);color:#fff;font-weight:700}
.lead{color:var(--light-2);max-width:66ch;margin-top:10px;font-size:1.02rem}

/* cartões claros: sempre tinta escura */
.card{background:var(--panel);color:var(--ink);border-radius:var(--r);padding:22px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 18px 40px -20px rgba(0,0,0,.6);margin-top:20px}
.card .muted{color:var(--ink-2)}
.lbl{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:800;margin-top:14px}
.lbl:first-child{margin-top:0}
input[type=text]{font-family:inherit;font-size:1rem;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:11px 14px;width:100%;margin-top:6px}
input[type=text]:focus{outline:none;border-color:var(--blue)}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:var(--acc-ink);font-weight:800;padding:12px 22px;border-radius:10px;box-shadow:0 4px 0 #C99A1A;transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #C99A1A}
.btn:disabled{background:#E2E6EE;color:#98A2B3;box-shadow:none;transform:none;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 4px 0 #B8C2D3;border:2px solid var(--line)}
.btn.dark{background:#223C5E;color:#fff;box-shadow:0 4px 0 #0E2036}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}

/* criação de avatar */
.av-grid{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.av-preview{background:linear-gradient(180deg,#DDEBFA,#F4F8FD);border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:12px;border:2px solid var(--line)}
.sw-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sw{width:32px;height:32px;border-radius:8px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.sel{box-shadow:0 0 0 3px var(--blue)}
.sw-t{padding:7px 12px;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:.85rem;color:var(--ink-2)}
.sw-t.sel{border-color:var(--blue);color:var(--blue);background:#EEF5FF}

/* prólogo */
.pips{display:flex;gap:6px;margin-top:18px}
.pip{width:10px;height:10px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--acc)}
.historia{font-size:1.06rem;line-height:1.7}
.historia b{color:#0D4F8B}
.card h3{font-family:"Pixelify Sans",sans-serif;font-size:1.5rem;color:var(--ink);margin-bottom:10px}

/* jogo */
#jogo{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
#stageWrap{position:relative;border-radius:16px;overflow:hidden;background:#07111E;box-shadow:0 0 0 3px #0B1A2C,0 0 0 5px #28496F,0 20px 40px -18px rgba(0,0,0,.8)}
#stage{display:block;width:100%;height:clamp(380px,64vh,620px);touch-action:manipulation}
#roomTag{position:absolute;left:12px;top:12px;background:rgba(9,22,40,.8);color:#fff;border-radius:9px;padding:6px 12px;font-family:"Pixelify Sans",sans-serif;font-size:.95rem;pointer-events:none}
#roomTag small{display:block;font-family:"Nunito",sans-serif;font-size:.7rem;color:var(--light-2);letter-spacing:.08em;text-transform:uppercase}
#chatbar{display:flex;gap:8px;padding:10px;background:#0E2036;border-top:1px solid rgba(255,255,255,.06)}
#chatbar input{margin:0;background:#fff;border-color:#fff}
#chatbar .btn{padding:10px 16px}
#side{display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);color:var(--ink);border-radius:var(--r);padding:16px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.box h4{margin:0 0 10px;font-family:"Pixelify Sans",sans-serif;font-size:1.05rem}
.prog{height:12px;border-radius:6px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.prog span{display:block;height:100%;background:linear-gradient(90deg,#4FC3F7,#2F80ED);border-radius:6px;transition:width .4s}
.npc-list{display:flex;flex-direction:column;gap:8px}
.npc-item{display:flex;gap:10px;align-items:center;text-align:left;padding:8px;border-radius:10px;border:2px solid var(--line);background:#fff;width:100%}
.npc-item:hover{border-color:var(--blue)}
.npc-item canvas{flex:0 0 auto;border-radius:8px;background:#E8F0FA}
.npc-item .n{font-weight:800;font-size:.92rem;line-height:1.2}
.npc-item .c{font-size:.74rem;color:var(--ink-2);line-height:1.2}
.npc-item .st{margin-left:auto;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
.st.pend{background:#FFF3C4;color:#7A5B00}
.st.ok{background:#DDF3E6;color:#16693A}
.st.wait{background:var(--panel-2);color:var(--ink-2)}
.side-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-btns .btn{justify-content:center;padding:10px 8px;font-size:.88rem}
.dica{font-size:.8rem;color:var(--ink-2);margin-top:8px;line-height:1.45}

/* modal */
#modal{position:fixed;inset:0;background:rgba(4,10,20,.66);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:24px 14px;overflow-y:auto}
#modal.on{display:flex}
#mbox{background:var(--panel);color:var(--ink);border-radius:16px;max-width:720px;width:100%;padding:24px;box-shadow:0 8px 0 rgba(0,0,0,.3);margin:auto 0;position:relative}
.m-head{display:flex;gap:14px;align-items:center}
.m-head canvas{border-radius:12px;background:linear-gradient(180deg,#DDEBFA,#F4F8FD);border:2px solid var(--line);flex:0 0 auto}
.m-head .n{font-family:"Pixelify Sans",sans-serif;font-size:1.3rem;line-height:1.1}
.m-head .c{font-size:.82rem;color:var(--ink-2)}
.m-tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0D4F8B;background:#E6F1FC;border-radius:6px;padding:4px 8px;margin-bottom:6px}
.fala{position:relative;background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:16px;font-size:1rem}
.fala::before{content:'';position:absolute;left:26px;top:-10px;border:8px solid transparent;border-bottom-color:var(--line);border-top:0}
.pergunta{font-weight:800;font-size:1.06rem;margin-top:18px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:11px;padding:12px 14px;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:.96rem;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue);background:#F6FAFF}
.opt .l{font-family:"Pixelify Sans",sans-serif;font-weight:700;color:var(--ink-2);font-size:1rem}
.opt.right{border-color:var(--good);background:#EAF7EF}
.opt.right .l{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:#FDEEEC}
.opt.wrong .l{color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:11px;padding:12px 14px;font-size:.94rem;border:2px solid}
.fb.ok{background:#EAF7EF;border-color:var(--good);color:#11552D}
.fb.err{background:#FDEEEC;border-color:var(--bad);color:#7C1F18}
.fb b{display:block;margin-bottom:3px}
.conceito{margin-top:14px;border-radius:11px;padding:14px 16px;background:#EEF5FF;border:2px solid #C7DDF7;font-size:.94rem;color:#18365A}
.conceito b{display:block;font-family:"Pixelify Sans",sans-serif;font-size:1.02rem;margin-bottom:4px;color:#0D4F8B}
.cls{display:grid;gap:10px;margin-top:12px}
.cls-item{border:2px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff}
.cls-item.right{border-color:var(--good);background:#F2FAF5}
.cls-item.wrong{border-color:var(--bad);background:#FEF4F3}
.cls-item p{font-size:.95rem}
.cls-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cls-btns button{border:2px solid var(--line);border-radius:8px;padding:6px 11px;font-size:.82rem;font-weight:800;color:var(--ink-2);background:#fff}
.cls-btns button.sel{border-color:var(--blue);color:#fff;background:var(--blue)}
.cls-btns button:disabled{opacity:.8;cursor:default}
.cls-why{font-size:.86rem;margin-top:8px}
.cls-item.right .cls-why{color:#11552D}
.cls-item.wrong .cls-why{color:#7C1F18}
.nav-list{display:grid;gap:10px;margin-top:14px}
.nav-item{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;width:100%;color:var(--ink)}
.nav-item:hover:not(:disabled){border-color:var(--blue);background:#F6FAFF}
.nav-item:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.6)}
.nav-item.here{border-color:var(--acc);background:#FFFBEA}
.nav-item .e{font-size:1.8rem}
.nav-item .n{font-weight:800}
.nav-item .u{font-size:.8rem;color:var(--ink-2)}
.nav-item .p{margin-left:auto;font-size:.8rem;font-weight:800;color:var(--ink-2);white-space:nowrap}
.lista-intro{margin:12px 0 0;padding-left:20px}
.lista-intro li{margin-top:6px}
.x-btn{position:absolute;right:12px;top:10px;font-size:1.3rem;color:var(--ink-2);padding:4px 10px;border-radius:8px}
.x-btn:hover{background:var(--panel-2)}

/* resultado */
.big-num{font-family:"Pixelify Sans",sans-serif;font-size:clamp(2.6rem,8vw,3.8rem);color:#fff;line-height:1}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.res-item{background:var(--panel-2);border-radius:10px;padding:12px;border:1px solid var(--line)}
.res-item b{display:block}
.res-item small{color:var(--ink-2)}
.seal{display:inline-flex;gap:8px;align-items:center;background:#EAF7EF;color:#11552D;border:2px solid var(--good);border-radius:10px;padding:8px 14px;font-weight:800}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#0E2036;color:#fff;border:2px solid #2E5A88;border-radius:12px;padding:12px 18px;z-index:90;transition:transform .3s;font-weight:700;max-width:92vw}
#toast.on{transform:translateX(-50%) translateY(0)}

@media (max-width:980px){
  #jogo{grid-template-columns:1fr}
  .av-grid{grid-template-columns:1fr}
}

#evid{position:fixed;left:16px;bottom:150px;z-index:60;max-width:380px;background:#0E2238;color:#fff;border:2px solid #FFC940;border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:.92rem}
#evid.min .ev-b,#evid.min .ev-d{display:none}
#evid .ev-h{font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;color:#FFC940}
#evid .ev-min{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;width:26px;height:24px;cursor:pointer}
#evid .ev-b{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;margin:6px 0;line-height:1.45;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.84rem;word-break:break-word}
#evid .ev-t,.pista-box .ev-t{display:block;font-family:Nunito,sans-serif;font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
#evid .ev-d{margin:4px 0 0;font-size:.8rem;opacity:.8}
.pista-aviso{margin:10px 0;padding:10px 12px;border-radius:10px;background:#FFF4D6;border:1px solid #F2C14E;color:#4A3500;font-weight:700}
.pista-box{margin:10px 0;padding:10px 12px;border-radius:10px;background:#0E2238;color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;line-height:1.5;word-break:break-word}
#stage{height:clamp(400px,70vh,680px)}
#emotes{display:flex;gap:4px;flex-shrink:0}
#emotes button{width:38px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#16314F;font-size:1.1rem;line-height:1;cursor:pointer;transition:transform .12s,background .12s}
#emotes button:hover{background:#21456C;transform:translateY(-2px)}
.ord .opt .l{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#EEF1F5}
.ord .opt.right .l{background:var(--good);color:#fff}
.ord .opt.sel{border-color:#2F80ED;background:#EAF2FE}
.ord .opt.sel .l{background:#2F80ED;color:#fff}
.ord-why{display:block;margin-top:4px;font-size:.84rem;font-weight:600;opacity:.8}
@media (max-width:820px){#chatbar{flex-wrap:wrap}#emotes{width:100%;justify-content:center}}
#cine{position:fixed;inset:0;z-index:300;background:#050B14;transition:opacity .45s}
#cine.saindo{opacity:0}
#cine canvas{display:block}
.cine-gate{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:24px;background:radial-gradient(circle at 50% 42%,#1F6F6B 0,#0E2E3A 45%,#050B14 100%)}
.cine-gate h1{font-family:"Pixelify Sans",Nunito,sans-serif;font-size:clamp(2.4rem,7vw,4.4rem);margin:6px 0 0;letter-spacing:.02em}
.cine-gate p{margin:0 0 14px;color:#F2A65A;font-weight:800;font-size:1.25rem}
.cine-gate .btn{font-size:1.15rem;padding:14px 30px}
.cine-gate small{opacity:.6}
.cine-link{background:none;border:none;color:#B8D4D2;text-decoration:underline;cursor:pointer;font:inherit;font-weight:700}
#cineSkip{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer}
#cineSkip:hover{background:rgba(255,255,255,.22)}
#cineFim{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);font-size:1.2rem;padding:14px 32px;animation:cinePulso 1.6s ease-in-out infinite}
@keyframes cinePulso{50%{transform:translateX(-50%) scale(1.05)}}
@media (max-width:640px){#evid{left:8px;right:8px;max-width:none;bottom:8px}}
</style>
</head>
<body>
<header id="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <polygon points="17,3 31,10 17,17 3,10" fill="#F2A65A"/>
      <polygon points="3,10 17,17 17,31 3,24" fill="#1F6F6B"/>
      <polygon points="31,10 17,17 17,31 31,24" fill="#15524F"/>
      <polygon points="17,9 23,12 17,15 11,12" fill="#fff" opacity=".85"/>
    </svg>
    <div><b>Reboot TI</b><small>Cloud Computing</small></div>
  </div>
  <div id="hud"></div>
</header>
<main id="app"></main>
<div id="modal" role="dialog" aria-modal="true"><div id="mbox"></div></div>
<div id="toast"></div>

const MISSOES = {
  /* ---------------- Recepção · Fundamentos e economia (Aulas 1 a 3) */
  m1: { npc: 'breno', tema: 'Camadas de serviço', tipo: 'classificar',
    contexto: 'Bem-vindo(a) à Reboot TI! Eu sou o Breno, estou aqui desde que a empresa era uma sala. Primeira tarefa de todo mundo: separar o que os clientes contratam. Cada camada muda quem cuida do quê.',
    pergunta: 'Classifique cada serviço pela camada.',
    categorias: ['IaaS', 'PaaS', 'SaaS'],
    itens: [
      { t: 'Uma máquina virtual EC2 em que a equipe instala o sistema operacional e tudo o mais.', cat: 0, why: 'Você recebe a infraestrutura e cuida do resto: sistema, atualizações, aplicação.' },
      { t: 'Uma plataforma em que a equipe só envia o código e o provedor cuida dos servidores.', cat: 1, why: 'A plataforma esconde a máquina: você cuida do código, ela cuida de onde roda.' },

  m2: { npc: 'lucia', tema: 'As características da nuvem', tipo: 'escolha',
    contexto: 'Meu filho, deixa eu contar. Na Black Friday o site da loja recebeu dez vezes mais gente e não caiu. Na segunda-feira voltou ao normal, e a conta do mês veio proporcional ao que usei. Isso é a tal da nuvem?',
    pergunta: 'Quais características da nuvem a Dona Lúcia descreveu?',
    opcoes: [
      { t: 'Elasticidade rápida e serviço medido.', ok: true, why: 'Os recursos cresceram e encolheram com a demanda (elasticidade) e a cobrança acompanhou o uso (serviço medido).' },
      { t: 'Amplo acesso à rede e autoatendimento.', why: 'As duas existem, mas ela não falou de acessar de qualquer lugar nem de contratar sozinha. Falou de crescer, encolher e pagar pelo uso.' },
      { t: 'Pool de recursos e amplo acesso à rede.', why: 'Compartilhar recursos entre clientes e acessar pela rede são reais, mas não explicam a conta proporcional.' },

  m3: { npc: 'livia', tema: 'CapEx e OpEx', tipo: 'escolha',
    contexto: 'Oi, eu sou a Lívia, gerente de operações. A Dona Lúcia está em dúvida: comprar um servidor de R$ 25 mil para a loja ou ficar na nuvem pagando por mês. Ela pediu para alguém explicar a diferença de um jeito simples.',
    pergunta: 'O que muda na conta da loja ao trocar o servidor próprio pela nuvem?',
    opcoes: [
      { t: 'Sai a compra antecipada de equipamento e entra uma despesa mensal pelo uso.', ok: true, why: 'É a troca de CapEx, investimento antecipado em ativo, por OpEx, despesa operacional que acompanha o uso.' },
      { t: 'O custo desaparece, porque o provedor paga o servidor, a energia e a equipe.', why: 'O custo não desaparece: ele vira mensalidade. O provedor cobra por tudo isso dentro do preço.' },

    conceito: { titulo: 'CapEx e OpEx', texto: 'CapEx é investimento de capital: comprar o equipamento antes de usar, e pagar por ele mesmo que fique ocioso. OpEx é despesa operacional: pagar mês a mês pelo que foi usado. A nuvem transforma boa parte do CapEx de infraestrutura em OpEx.' } },

  /* ---------------- Infra · Regiões, EC2 e S3 (Aulas 4 a 6) */

    opcoes: [

      { t: 'Colocar duas instâncias lado a lado na mesma zona de disponibilidade.', why: 'Se a zona inteira cair, as duas caem juntas. Redundância precisa estar em lugares diferentes.' },

    conceito: { titulo: 'Região e zona de disponibilidade', texto: 'Uma região é uma área geográfica com vários datacenters. Cada zona de disponibilidade é um ou mais datacenters isolados dentro dela, com energia e rede próprias. Distribuir a aplicação por zonas é o que protege contra a queda de uma delas.' } },

  m5: { npc: 'ana', tema: 'A instância que ninguém sabe de quem é', tipo: 'escolha',

    pista: '<b>Relatório de custos · EC2</b><br>t3.large · us-east-1a · <b>ligada há 31 dias</b><br>sem nenhuma tag · última conexão SSH há 29 dias<br>uso médio de CPU: 0,4%',
    pergunta: 'Qual é a atitude certa com essa instância?',
    opcoes: [

    conceito: { titulo: 'Instância esquecida', texto: 'Instância ligada cobra por hora, usada ou não. Tags com dono e projeto, alertas de orçamento e uma revisão periódica evitam a instância fantasma. Parar suspende a cobrança de computação; o disco continua cobrando até a instância ser encerrada.' } },

  m6: { npc: 'breno', tema: 'EC2 ou S3', tipo: 'classificar',
    contexto: 'O Caio, da Loja de Roupas, colocou tudo numa EC2 só, até as fotos. Me ajuda a separar o que roda como programa do que é só arquivo guardado?',
    pergunta: 'Onde cada coisa deveria ficar?',
    categorias: ['EC2', 'S3'],
    itens: [
      { t: 'As fotos dos produtos da vitrine.', cat: 1, why: 'São objetos: arquivos guardados e entregues sob pedido.' },
      { t: 'Um programa que precisa ficar rodando o tempo todo.', cat: 0, why: 'Programa em execução contínua precisa de uma máquina: computação.' },
      { t: 'O site estático da vitrine, com HTML e CSS.', cat: 1, why: 'O S3 serve site estático sem servidor nenhum ligado.' },
      { t: 'Um banco de dados instalado à mão pela equipe.', cat: 0, why: 'Software instalado e rodando é trabalho de uma instância.' },
      { t: 'Os backups diários em arquivo compactado.', cat: 1, why: 'Arquivo guardado por muito tempo é objeto. O S3 foi feito para isso.' },
    ],
    conceito: { titulo: 'Computar e guardar', texto: 'A EC2 é computação: uma máquina virtual que roda programas. O S3 é armazenamento de objetos: guarda arquivos de qualquer tamanho e os entrega por URL, sem servidor ligado. Cada um no seu papel custa menos e dá menos trabalho.' } },

  /* ---------------- Serverless · Lambda e API Gateway (Aulas 7 a 9) */
  m7: { npc: 'caio', tema: 'Como a Lambda cobra', tipo: 'escolha',
    contexto: 'E aí, sou o Caio, dev da Loja de Roupas. A Dona Lúcia viu que a gente trocou o servidor por uma função Lambda e me perguntou na lata: "isso cobra quanto, por hora?". Eu travei.',
    pergunta: 'Como a função Lambda da loja é cobrada?',
    opcoes: [
      { t: 'Pelo número de execuções e pelo tempo de cada uma.', ok: true, why: 'Serverless cobra por uso: quantas vezes rodou e quanto durou, com a memória escolhida. Parada, não cobra.' },
      { t: 'Por hora, enquanto a função estiver publicada na conta.', why: 'Esse é o modelo da instância EC2. A função publicada e sem chamadas não gera cobrança de execução.' },
      { t: 'Por mês, um valor fixo para cada função criada na conta.', why: 'Não existe mensalidade por função. O custo acompanha as execuções.' },
      { t: 'Pelo tamanho do pacote de código enviado no Deploy.', why: 'O tamanho do código não define a cobrança. O que conta é execução e duração.' },
    ],
    conceito: { titulo: 'Serverless', texto: 'Na Lambda você não gerencia servidor: envia a função e ela roda quando é chamada. A cobrança é pelo número de requisições e pelo tempo de execução, proporcional à memória. Sem chamadas, sem custo de execução.' } },

  m8: { npc: 'caio', tema: 'A vitrine que não carrega', tipo: 'escolha',
    contexto: 'A API responde certinho no CloudShell, mas a vitrine no navegador não mostra produto nenhum. O erro está no console do navegador.',
    pista: '<b>Console do navegador</b><br>Access to fetch at \'https://…execute-api.us-east-1.amazonaws.com/prod/produtos\' from origin \'http://loja-vitrine.s3-website-us-east-1.amazonaws.com\' <b>has been blocked by CORS policy</b>',
    pergunta: 'O que falta configurar?',
    opcoes: [
      { t: 'Habilitar o CORS na API para a origem do site.', ok: true, why: 'O site e a API estão em origens diferentes. Sem os cabeçalhos de CORS na resposta, o navegador bloqueia a leitura.' },
      { t: 'Trocar a função Lambda por uma instância EC2 maior.', why: 'A API já responde no CloudShell. O bloqueio acontece no navegador, por regra de origem.' },
      { t: 'Aumentar o tempo limite da função para 30 segundos.', why: 'Não houve demora: a resposta chegou e foi barrada pelo navegador.' },
      { t: 'Mover o bucket da vitrine para outra região da AWS.', why: 'Mudar de região mantém origens diferentes. O que falta é a API autorizar a origem do site.' },
    ],
    conceito: { titulo: 'CORS', texto: 'O navegador só deixa uma página ler a resposta de outra origem se essa resposta disser que permite, com cabeçalhos como Access-Control-Allow-Origin. Por isso a chamada funciona no terminal e falha no site: o CORS é uma regra do navegador.' } },

  m9: { npc: 'lucia', tema: 'Forbidden', tipo: 'escolha',
    contexto: 'O Caio me passou o endereço da API para eu ver os produtos pelo celular. Eu abri e apareceu só isto: {"message":"Forbidden"}. Quebrou alguma coisa?',
    pergunta: 'O que provavelmente aconteceu?',
    opcoes: [
      { t: 'A chamada foi sem o cabeçalho x-api-key com a chave da loja.', ok: true, why: 'A API exige chave de uso. Pelo navegador do celular, sem o cabeçalho, o API Gateway recusa com 403 Forbidden.' },
      { t: 'A função Lambda caiu e precisa de um novo Deploy para voltar.', why: 'Função com erro devolve 502, não 403. O Forbidden vem antes de a função ser chamada.' },
      { t: 'A tabela de produtos está vazia e a API responde com um erro.', why: 'Tabela vazia devolve uma lista vazia, com 200. Não gera Forbidden.' },
      { t: 'O CORS bloqueou a resposta, porque o celular é outra origem.', why: 'Ela abriu o endereço direto, sem página fazendo fetch. CORS não entra nessa história.' },
    ],
    conceito: { titulo: 'Chave de uso da API', texto: 'Uma API com chave obrigatória só atende quem manda o cabeçalho x-api-key com uma chave válida, ligada a um plano de uso. Sem a chave, o API Gateway responde 403 Forbidden antes mesmo de chamar a função.' } },

  /* ---------------- Dados · S3 e DynamoDB (Aulas 10 e 11) */
  m10: { npc: 'marta', tema: 'O disco que queimou', tipo: 'escolha',
    contexto: 'Boa tarde! Sou a Dra. Marta, da PetVida. Li uma notícia: um disco queimou num datacenter da AWS. Corri para conferir e o raio-x do Thor estava lá, inteiro. Como isso é possível?',
    pergunta: 'Que propriedade do S3 protegeu o raio-x?',
    opcoes: [
      { t: 'Durabilidade: havia cópias do arquivo em outras zonas.', ok: true, why: 'O S3 guarda cada objeto em pelo menos três zonas antes de confirmar a gravação. Um disco a menos não perde o dado.' },
      { t: 'Disponibilidade: o arquivo pôde ser aberto naquele momento.', why: 'Conseguir abrir agora é disponibilidade. A pergunta é por que o dado não se perdeu.' },
      { t: 'Consistência: todos leram a mesma versão logo após gravar.', why: 'Consistência fala de ler a versão nova. Não protege contra disco queimado.' },
      { t: 'Elasticidade: o armazenamento cresceu sozinho com o uso.', why: 'Crescer sem limite é outra virtude. Quem guarda as cópias é a durabilidade.' },
    ],
    conceito: { titulo: 'Durabilidade e disponibilidade', texto: 'Durabilidade é o dado não se perder: o S3 Standard é projetado para onze noves. Disponibilidade é conseguir ler agora. Atenção: durabilidade alta não é backup, porque apagar o objeto apaga todas as cópias.' } },

  m11: { npc: 'marta', tema: 'Classes de armazenamento', tipo: 'classificar',
    contexto: 'A conta do S3 da clínica cresce todo mês. A Ana Paula disse que dá para guardar cada arquivo numa classe diferente, conforme o uso. Me ajuda a decidir?',
    pergunta: 'Qual classe combina com cada arquivo?',
    categorias: ['Standard', 'Standard-IA', 'Glacier'],
    itens: [
      { t: 'Fotos dos pets, vistas todo dia no app dos tutores.', cat: 0, why: 'Acesso frequente: Standard, sem taxa de recuperação.' },
      { t: 'Raio-x do mês passado, aberto de vez em quando.', cat: 1, why: 'Acesso infrequente, mas que precisa abrir na hora: Standard-IA.' },
      { t: 'Prontuários de cinco anos atrás, guardados por exigência legal.', cat: 2, why: 'Quase nunca lidos, e a espera para recuperar é aceitável: Glacier.' },
      { t: 'O logotipo e as imagens do site da clínica.', cat: 0, why: 'Carregados a cada visita: acesso frequente.' },
      { t: 'Exames do trimestre passado, consultados raramente.', cat: 1, why: 'Pouco acesso, mas sem poder esperar horas: Standard-IA.' },
    ],
    conceito: { titulo: 'Classes e ciclo de vida', texto: 'Quanto menos um arquivo é acessado, mais barato guardá-lo numa classe fria, em troca de taxa ou espera para recuperar. Uma regra de ciclo de vida move os arquivos sozinha: por exemplo, para Standard-IA depois de 30 dias e para Glacier depois de 90.' } },

  m12: { npc: 'breno', tema: 'A leitura que ficou cara', tipo: 'escolha',
    contexto: 'O app da PetVida ficou lento e a conta de leitura do DynamoDB subiu. A tela que lista os pets de um tutor demora cada vez mais. Os detalhes da tabela e da função estão no painel.',
    pista: '<b>Tabela pets</b> · chave de partição: <b>tutor_id</b> · chave de ordenação: pet_id<br><b>Função listar_pets:</b> table.<b>scan()</b> e depois filtra pelo tutor no código<br>itens na tabela: 48.000',
    pergunta: 'O que resolve a lentidão e o custo?',
    opcoes: [
      { t: 'Usar Query pela chave do tutor, no lugar do Scan.', ok: true, why: 'A Query vai direto na partição do tutor e lê só os pets dele. O Scan lê os 48 mil itens para descartar quase todos.' },
      { t: 'Trocar o modo da tabela para capacidade provisionada.', why: 'Mudar a forma de cobrança não muda o desperdício: o Scan continua lendo a tabela inteira.' },
      { t: 'Criar uma tabela nova para cada tutor cadastrado.', why: 'A chave de partição já separa os tutores. Milhares de tabelas só complicariam.' },
      { t: 'Aumentar a memória da função para ela ler mais rápido.', why: 'O gargalo é ler 48 mil itens no banco, não a memória da função.' },
    ],
    conceito: { titulo: 'Query e Scan', texto: 'A Query busca pela chave de partição e lê só aquela partição. O Scan lê a tabela inteira e filtra depois, pagando por cada item lido. Uma boa chave de partição é escolhida pensando na consulta que o sistema mais faz.' } },

  /* ---------------- NOC · Rede (Aula 12) */
  m13: { npc: 'rita', tema: 'Pública ou privada', tipo: 'classificar',
    contexto: 'Rita, segurança da informação. A PetVida vai ganhar uma VPC e eu preciso do desenho antes de qualquer clique no console. Onde fica cada peça?',
    pergunta: 'Em que sub-rede cada peça deve ficar?',
    categorias: ['Sub-rede pública', 'Sub-rede privada'],
    itens: [
      { t: 'O banco de dados da clínica.', cat: 1, why: 'Banco nunca fica exposto: só a aplicação fala com ele.' },
      { t: 'O balanceador de carga que recebe os tutores.', cat: 0, why: 'É a porta de entrada: precisa ser alcançado da internet.' },
      { t: 'A função que lê e grava no banco.', cat: 1, why: 'Ninguém de fora precisa alcançá-la pela rede.' },
      { t: 'O servidor que gera relatórios toda madrugada.', cat: 1, why: 'Ele só inicia conexões. Não recebe visita de ninguém.' },
      { t: 'Um servidor web único, sem balanceador na frente.', cat: 0, why: 'Sem balanceador, é ele mesmo que recebe os visitantes.' },
    ],
    conceito: { titulo: 'Sub-rede pública e privada', texto: 'Uma sub-rede é pública quando a sua tabela de rotas manda o tráfego da internet para um Internet Gateway. Sem essa rota, é privada: a internet não chega nela. O que precisa ser visitado fica na pública; o resto, na privada.' } },

  m14: { npc: 'breno', tema: 'A função que parou', tipo: 'escolha',
    contexto: 'Plantão de hoje: ligaram a função da Loja de Roupas às sub-redes privadas e a vitrine parou. O log e a tabela de rotas estão no monitor do NOC.',
    pista: '<b>Log da Lambda</b><br>Task timed out after 3.00 seconds<br><b>Tabela de rotas privada</b><br>10.0.0.0/16 → local<br>(nenhuma outra rota)',
    pergunta: 'O que faz a função voltar a ler o DynamoDB, sem custo?',
    opcoes: [
      { t: 'Criar o gateway endpoint do DynamoDB na VPC.', ok: true, why: 'O endpoint dá à sub-rede privada um caminho até o DynamoDB que não passa pela internet, e é gratuito.' },
      { t: 'Criar um NAT Gateway na sub-rede pública da mesma VPC.', why: 'Funcionaria, mas cobra por hora enquanto existir: mais de US$ 30 por mês. A pergunta pede sem custo.' },
      { t: 'Aumentar o tempo limite da função para 30 segundos.', why: 'Esperar mais não cria rota. A chamada continuaria sem caminho até o banco.' },
      { t: 'Mover a função para a sub-rede pública da mesma VPC.', why: 'A interface de rede da Lambda não ganha IP público. Na sub-rede pública ela continua sem internet.' },
    ],
    conceito: { titulo: 'Lambda dentro da VPC', texto: 'Ligada a sub-redes privadas, a função obedece às rotas delas e perde a saída para a internet, inclusive até o DynamoDB. O gateway endpoint resolve sem custo para S3 e DynamoDB. Para a internet em geral, só o NAT Gateway, que é pago.' } },

  m15: { npc: 'rita', tema: 'O banco aberto', tipo: 'escolha',
    contexto: 'Achei isto numa auditoria de outro cliente: o grupo de segurança do banco libera a porta 5432 para 0.0.0.0/0. Ou seja, para a internet inteira. Como deveria estar?',
    pergunta: 'Qual regra de entrada o banco deveria ter?',
    opcoes: [
      { t: 'Porta 5432 liberada só para o grupo de segurança da função.', ok: true, why: 'A regra aponta para o grupo de quem precisa acessar. Se o IP da função mudar, a regra continua valendo.' },
      { t: 'Porta 5432 liberada para todos, mas só em horário comercial.', why: 'Grupo de segurança não tem regra por horário. E aberto para todos continua sendo aberto.' },
      { t: 'Porta 5432 trocada por uma porta alta, que ninguém procura.', why: 'Trocar a porta só esconde. Varreduras encontram qualquer porta aberta em minutos.' },
      { t: 'Saída do banco bloqueada para a internet, entrada como está.', why: 'O problema é a entrada aberta para o mundo. Bloquear a saída não fecha a porta.' },
    ],
    conceito: { titulo: 'Grupo de segurança', texto: 'O grupo de segurança é um firewall preso ao recurso, só com regras de permitir e com estado: a resposta volta sozinha. A boa prática é liberar a porta apenas para o grupo de quem precisa, nunca para 0.0.0.0/0.' } },

  /* ---------------- Diretoria · Custo e arquitetura */
  m16: { npc: 'jonas', tema: 'A fatura do mês', tipo: 'escolha',
    contexto: 'Jonas, do financeiro. A fatura da Loja de Roupas veio maior do que a do mês passado, e a Dona Lúcia quer saber o porquê antes de pagar. O detalhamento está no relatório.',
    pista: '<b>Fatura · outubro</b><br>NAT Gateway · us-east-1 · 744 h · <b>US$ 33,48</b><br>DynamoDB · sob demanda · US$ 0,12<br>Lambda · 41 mil execuções · US$ 0,00<br>S3 · 2 GB · US$ 0,09',
    pergunta: 'O que derruba a fatura sem tirar a loja do ar?',
    opcoes: [
      { t: 'Apagar o NAT Gateway e usar o endpoint do DynamoDB.', ok: true, why: 'O NAT respondeu por quase toda a fatura: 744 horas a US$ 0,045. O endpoint gateway faz o mesmo caminho até o banco, de graça.' },
      { t: 'Mudar a tabela do DynamoDB para capacidade provisionada.', why: 'O DynamoDB custou US$ 0,12. Mexer nele não muda a conta.' },
      { t: 'Reduzir pela metade a memória da função da loja.', why: 'A Lambda saiu de graça, dentro do nível gratuito.' },
      { t: 'Levar a vitrine do S3 para uma instância EC2 pequena.', why: 'O S3 custou nove centavos. Uma instância ligada o mês todo custaria bem mais.' },
    ],
    conceito: { titulo: 'Ler a fatura', texto: 'Antes de otimizar, descubra quem pesa. Recursos cobrados por hora, como NAT Gateway e instâncias, pesam mesmo parados. Recursos cobrados por uso, como Lambda e DynamoDB sob demanda, quase somem quando o tráfego é pequeno.' } },

  m17: { npc: 'livia', tema: 'A arquitetura da PetVida', tipo: 'classificar',
    contexto: 'Fechamos o contrato com a PetVida! A arquitetura vai ser a mesma da loja. Antes da reunião com a Dra. Marta, quero conferir que todo mundo entende onde mora cada peça.',
    pergunta: 'Onde fica cada peça da arquitetura?',
    categorias: ['Serviço regional, fora da VPC', 'Dentro da VPC, na sub-rede privada'],
    itens: [
      { t: 'O bucket S3 com o site do app dos tutores.', cat: 0, why: 'O S3 é um serviço regional: não mora em sub-rede nenhuma.' },
      { t: 'O API Gateway que recebe as chamadas do app.', cat: 0, why: 'Também é regional. Ele chama a função pelo serviço da Lambda.' },
      { t: 'A função Lambda com as regras da clínica.', cat: 1, why: 'É ela que ligamos às sub-redes privadas, para não ter saída para a internet.' },
      { t: 'A tabela do DynamoDB com os pets e tutores.', cat: 0, why: 'Regional. A função chega até ela pelo gateway endpoint.' },

  m18: { npc: 'marta', tema: 'A pergunta da cliente', tipo: 'escolha',
    contexto: 'Última pergunta antes de assinar. Meu sobrinho acha que eu deveria comprar um servidor e deixar no consultório. Por que a minha clínica deveria ficar na nuvem?',
    pergunta: 'Qual resposta é honesta e completa?',
    opcoes: [
      { t: 'Paga pelo uso, cresce quando precisa e guarda cópias do dado.', ok: true, why: 'Junta o que a turma viu: custo por uso, elasticidade e durabilidade. Sem prometer o que a nuvem não entrega.' },
      { t: 'Fica de graça para sempre, porque o nível gratuito da AWS não acaba.', why: 'O nível gratuito tem limites e prazos. Promessa de custo zero vira problema na primeira fatura.' },
      { t: 'Não precisa de ninguém cuidando, porque a AWS faz tudo sozinha.', why: 'No modelo de responsabilidade compartilhada, configuração, acesso e dados são do cliente.' },
      { t: 'O sistema fica mais rápido em qualquer lugar, até sem internet.', why: 'Nuvem depende de rede. Sem internet, o sistema não é alcançado.' },
    ],
    conceito: { titulo: 'Por que nuvem', texto: 'A nuvem troca investimento antecipado por custo de uso, cresce e encolhe com a demanda e guarda os dados com alta durabilidade. Em troca, exige rede, controle de custos e cuidado com a parte que é sempre do cliente: configuração, acesso e dados.' } },
  /* ---------------- Desafios em dupla (pista dividida ou ordenar) */
  m19: { npc: 'nina', tema: 'O pico da Black Friday', tipo: 'escolha',
    contexto: 'Nina, do comercial. A Dona Lúcia quer saber se compra um servidor para a loja ou fica na nuvem. Eu separei dois papéis: o orçamento do servidor e o histórico de acessos da loja. Sozinho, nenhum dos dois responde.',
    partes: ['<b>Orçamento · servidor próprio</b><br>Compra à vista: <b>R$ 18.000</b><br>Dimensionado para <b>6.000 acessos por dia</b><br>Vida útil: 4 anos · energia e manutenção à parte',
             '<b>Histórico de acessos · Loja de Roupas</b><br>Dia comum: <b>cerca de 200 acessos</b><br>Black Friday: 6.000 por dia, <b>só 4 dias no ano</b><br>No resto do ano, o pico nunca passou de 400'],
    pergunta: 'O que a Nina deve recomendar para a Dona Lúcia?',
    opcoes: [
      { t: 'Nuvem: pagar o dia comum e escalar só nos dias de pico.', ok: true, why: 'O pico dura 4 dias. Com elasticidade, a loja paga pouco no dia comum e aumenta a capacidade só quando precisa. O servidor comprado ficaria ocioso quase o ano inteiro.' },
      { t: 'Servidor próprio: paga R$ 18.000 uma vez e acaba a conta.', why: 'Ele seria dimensionado para 6.000 acessos e usado a 200 em quase todo o ano. É dinheiro parado, e energia e manutenção continuam.' },
      { t: 'Servidor menor, para 400 acessos, e torcer na Black Friday.', why: 'Aí a loja cai justamente nos 4 dias em que mais vende.' },
      { t: 'Nuvem, porque ela sai mais barata em qualquer cenário.', why: 'Não vale para toda carga: uso alto e constante pode compensar servidor próprio. Aqui a nuvem ganha por causa do pico curto.' },
    ],
    conceito: { titulo: 'Elasticidade e CapEx', texto: 'Comprar servidor é CapEx: paga-se antes, dimensionando pelo pico. A nuvem é OpEx com elasticidade: a capacidade acompanha a demanda e a cobrança acompanha o uso. Carga com pico curto e raro é o caso em que a nuvem mais compensa.' } },

  m20: { npc: 'teo', tema: 'Subir uma EC2', tipo: 'ordenar',
    contexto: 'Téo, DevOps. O Caio quer uma máquina de teste para a loja e pediu um passo a passo. Eu escrevi os passos em post-its e eles caíram fora de ordem. Me ajuda a remontar?',

      { t: 'Lançar a instância e conectar por SSH para instalar o site.', why: 'Só depois de lançada a instância existe para receber a conexão.' },

  m21: { npc: 'duda', tema: 'O 502 da rota nova', tipo: 'escolha',
    contexto: 'Duda, estagiária. O Caio saiu para o almoço e a rota nova da API parou. Eu testei no Postman e olhei o log da função. Separei os dois prints, mas não entendi nada.',
    partes: ['<b>Postman</b> · GET /prod/promocoes<br>Status: <b>502 Bad Gateway</b><br>{"message": "Internal server error"}',
             '<b>Log da Lambda · CloudWatch</b><br>START promocoes<br>12 itens lidos · <b>duração 140 ms</b> · END<br><b>Última linha do código:</b> return promocoes;'],

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));

}

function retratoCanvas(look, size, dir) {
  const c = document.createElement('canvas');
  const dpr = window.devicePixelRatio || 1;
  c.width = size * dpr; c.height = size * dpr; c.style.width = size + 'px'; c.style.height = size + 'px';

  if (!ctx) return c;
  const s = size / 46;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * size / 2, dpr * (size + 38 * s));
  drawAvatar(ctx, look, dir == null ? 0 : dir, 0, false);
  return c;
}

    ctx.fillStyle = 'rgba(255,255,255,.75)'; rr(ctx, x - 11, y - 17, 22, 12, 6); ctx.fill();
    [-5, 0, 5].forEach((d) => circ(ctx, x + d, y - 11, 1.8, '#667'));
  }
}
function desenhar() {
  const ctx = M.ctx, s = salaAtual();
  ctx.setTransform(M.dpr, 0, 0, M.dpr, 0, 0);
  const g = ctx.createRadialGradient(M.cw / 2, M.ch * 0.4, 40, M.cw / 2, M.ch / 2, Math.max(M.cw, M.ch));
  g.addColorStop(0, '#15304F'); g.addColorStop(1, '#060E19');
  ctx.fillStyle = g; ctx.fillRect(0, 0, M.cw, M.ch);
  ctx.setTransform(M.dpr * M.scale, 0, 0, M.dpr * M.scale, M.dpr * M.offX, M.dpr * M.offY);

  // espessura do piso
  poly(ctx, [iso(0, s.H), iso(s.W, s.H), iso(s.W, s.H, -10), iso(0, s.H, -10)], shade(s.piso[1], -60), null);
  poly(ctx, [iso(s.W, 0), iso(s.W, s.H), iso(s.W, s.H, -10), iso(s.W, 0, -10)], shade(s.piso[1], -40), null);
  // piso
  for (let y = 0; y < s.H; y++) for (let x = 0; x < s.W; x++) {
    poly(ctx, [iso(x, y), iso(x + 1, y), iso(x + 1, y + 1), iso(x, y + 1)], s.piso[(x + y) % 2], 'rgba(0,0,0,.07)');
  }
  // tapetes e capacho
  s.moveis.filter((f) => f.t === 'tapete').forEach((f) => {
    poly(ctx, [iso(f.x + .08, f.y + .08), iso(f.x + f.w - .08, f.y + .08), iso(f.x + f.w - .08, f.y + f.d - .08), iso(f.x + .08, f.y + f.d - .08)], f.cor, null);
    poly(ctx, [iso(f.x + .28, f.y + .28), iso(f.x + f.w - .28, f.y + .28), iso(f.x + f.w - .28, f.y + f.d - .28), iso(f.x + .28, f.y + f.d - .28)], null, 'rgba(255,255,255,.35)');
  });
  poly(ctx, [iso(.05, s.porta + .12), iso(.75, s.porta + .12), iso(.75, s.porta + .88), iso(.05, s.porta + .88)], '#6B4F3A', null);

  // paredes
  poly(ctx, [iso(0, 0), iso(0, s.H), iso(0, s.H, WALLH), iso(0, 0, WALLH)], s.parede[0], 'rgba(0,0,0,.15)');
  poly(ctx, [iso(0, 0), iso(s.W, 0), iso(s.W, 0, WALLH), iso(0, 0, WALLH)], s.parede[1], 'rgba(0,0,0,.15)');
  poly(ctx, [iso(0, 0), iso(0, s.H), iso(0, s.H, 8), iso(0, 0, 8)], shade(s.parede[0], -35), null);
  poly(ctx, [iso(0, 0), iso(s.W, 0), iso(s.W, 0, 8), iso(0, 0, 8)], shade(s.parede[1], -35), null);
  poly(ctx, [iso(0, 0, WALLH), iso(0, s.H, WALLH), iso(-.18, s.H + .18, WALLH), iso(-.18, -.18, WALLH)], shade(s.parede[0], 30), 'rgba(0,0,0,.12)');
  poly(ctx, [iso(0, 0, WALLH), iso(s.W, 0, WALLH), iso(s.W + .18, -.18, WALLH), iso(-.18, -.18, WALLH)], shade(s.parede[1], 30), 'rgba(0,0,0,.12)');
  s.paredeObj.forEach((o) => desenharParedeObj(ctx, o, M.hoverObj && M.hoverObj.t === 'quadro' && M.hoverObj.a === o.a));
  desenharParedeObj(ctx, portaObj(), M.hoverObj && M.hoverObj.t === 'porta');

  // destaque de tile e marcas de clique
  if (M.hover && !M.hoverNpc && !M.hoverObj) {
    const h = M.hover; ctx.lineWidth = 2;
    poly(ctx, [iso(h.x, h.y), iso(h.x + 1, h.y), iso(h.x + 1, h.y + 1), iso(h.x, h.y + 1)], 'rgba(255,224,102,.18)', livre(h.x, h.y) || (h.x === Math.round(M.player.x) && h.y === Math.round(M.player.y)) ? '#FFE066' : 'rgba(255,255,255,.35)');
    ctx.lineWidth = 1;
  }
  M.marcas.forEach((m) => {
    const k = m.t / 0.6, i = 0.5 - 0.5 * (1 - k) * 0.6;
    ctx.globalAlpha = 1 - k; ctx.lineWidth = 2;
    poly(ctx, [iso(m.x + .5, m.y + .5 - i), iso(m.x + .5 + i, m.y + .5), iso(m.x + .5, m.y + .5 + i), iso(m.x + .5 - i, m.y + .5)], null, '#FFFFFF');
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  });

  // objetos com ordem de profundidade
  const itens = [];
  s.moveis.filter((f) => f.t !== 'tapete').forEach((f) => itens.push({ z: f.x + (f.w || 1) - 1 + f.y + (f.d || 1) - 1, fn: () => desenharMovel(ctx, f) }));
  M.npcs.forEach((n) => itens.push({ z: n.x + n.y + .5, fn: () => {
    const p = iso(n.x + .5, n.y + .5);
    ctx.save(); ctx.translate(p.x, p.y); drawAvatar(ctx, NPCS[n.id].look, n.dir, M.t + n.x, !!n.walking); ctx.restore();
    marcador(ctx, p.x, p.y - 72, statusNpc(estado.sala, n.id));
    if (M.hoverNpc === n) etiqueta(ctx, p.x, p.y - 98, NPCS[n.id].nome + ' · ' + NPCS[n.id].cargo);
  } }));
  const pl = M.player;
  itens.push({ z: pl.x + pl.y + .5, fn: () => {
    const p = iso(pl.x + .5, pl.y + .5);
    ctx.save(); ctx.translate(p.x, p.y); drawAvatar(ctx, estado.avatar, pl.dir, M.t, pl.walking); ctx.restore();
  } });
  if (Dupla.visivel()) {
    const q = Dupla.P;
    itens.push({ z: q.x + q.y + .5, fn: () => {
      const p = iso(q.x + .5, q.y + .5);
      ctx.save(); ctx.translate(p.x, p.y); drawAvatar(ctx, Dupla.parceiro.look, q.dir, M.t + 1.7, q.walking); ctx.restore();
      etiqueta(ctx, p.x, p.y - 86, (M.hoverParceiro ? '👋 Acenar para ' : '👥 ') + Dupla.parceiro.apelido);
    } });
  }
  itens.sort((a, b) => a.z - b.z).forEach((i) => i.fn());

  // balões (em coordenadas de tela)
  ctx.setTransform(M.dpr, 0, 0, M.dpr, 0, 0);
  M.bolhas.forEach((b) => desenharBolha(ctx, b));
}
function etiqueta(ctx, x, y, txt) {
  ctx.font = '700 11px Nunito, sans-serif';
  const w = ctx.measureText(txt).width + 14;
  ctx.fillStyle = 'rgba(9,22,40,.88)'; rr(ctx, x - w / 2, y - 10, w, 20, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y);
}
function desenharBolha(ctx, b) {
  ctx.font = '700 13px Nunito, sans-serif';
  const larg = Math.max(...b.linhas.map((l) => ctx.measureText(l).width)) + 38;
  const x = Math.max(6, Math.min(M.cw - larg - 6, b.ax - larg / 2));
  const y = b.y;
  ctx.globalAlpha = b.idade > 22 ? Math.max(0, 1 - (b.idade - 22) / 6) : 1;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(ctx, x + 2, y + 3, larg, b.alt, 7); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; rr(ctx, x, y, larg, b.alt, 7); ctx.fill();
  ctx.strokeStyle = '#23262E'; ctx.lineWidth = 1.2; ctx.stroke();
  const tx = Math.max(x + 10, Math.min(x + larg - 10, b.ax));
  ctx.beginPath(); ctx.moveTo(tx - 5, y + b.alt - .5); ctx.lineTo(tx, y + b.alt + 6); ctx.lineTo(tx + 5, y + b.alt - .5); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 5, y + b.alt); ctx.lineTo(tx, y + b.alt + 6); ctx.lineTo(tx + 5, y + b.alt); ctx.stroke();
  ctx.fillStyle = b.cor; rr(ctx, x + 7, y + 6, 14, 14, 3); ctx.fill();
  ctx.fillStyle = '#23262E'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  b.linhas.forEach((l, i) => {
    if (i === 0 && l.startsWith(b.nome + ':')) {
      ctx.font = '800 13px Nunito, sans-serif'; ctx.fillText(b.nome + ':', x + 27, y + 7);
      const wn = ctx.measureText(b.nome + ': ').width;
      ctx.font = '600 13px Nunito, sans-serif'; ctx.fillText(l.slice(b.nome.length + 2), x + 27 + wn, y + 7);
    } else { ctx.font = '600 13px Nunito, sans-serif'; ctx.fillText(l, x + 27, y + 7 + i * 16); }
  });
  ctx.globalAlpha = 1;
}

function telaJogo() {
  app.innerHTML = `
    <div id="jogo">
      <div>
        <div id="stageWrap">
          <canvas id="stage" aria-label="Sala do jogo: clique no chão para andar e nas pessoas para conversar"></canvas>
          <div id="roomTag"></div>

            <button class="btn" id="chatBtn">Falar</button>
          </div>
        </div>
      </div>
      <aside id="side"></aside>
    </div>`;
  montarSala();
  iniciarMotor();
  atualizarPainel();
  const chatIn = document.getElementById('chatIn');
  const enviar = () => {
    const txt = chatIn.value.trim(); if (!txt) return;
    chatIn.value = '';
    falar('player', txt); Musica.sfx('blip');
    Dupla.enviar({ t: 'chat', txt });
    responderChat(txt);
  };
  document.getElementById('chatBtn').addEventListener('click', enviar);
  chatIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviar(); });
  if (!estado.visto[salaAtual().id]) setTimeout(() => abrirIntroSala(false), 350);
}
function responderChat(txt) {
  const p = M.player;
  let perto = null, md = 99;
  M.npcs.forEach((n) => { const d = Math.max(Math.abs(n.x - p.x), Math.abs(n.y - p.y)); if (d < md) { md = d; perto = n; } });
  if (!perto || md > 3) return;
  const info = NPCS[perto.id];
  const st = statusNpc(estado.sala, perto.id);
  let resp;
  if (/\b(oi|ol[aá]|opa|e a[ií]|bom dia|boa tarde|boa noite|salve)\b/i.test(txt)) resp = `Oi, ${apelido()}! Tudo certo?`;
  else if (/obrigad|valeu/i.test(txt)) resp = 'Imagina! A gente está junto nesse projeto.';
  else if (st === 'pend') resp = 'Quando puder, clica em mim que eu te conto o problema.';
  else resp = info.falas[Math.floor(Math.random() * info.falas.length)];
  setTimeout(() => { if (M.on) { perto.dir = dirPara(p.x - perto.x, p.y - perto.y, perto.dir); perto.virarEm = 5; falar(perto, resp); } }, 900);
}
function atualizarPainel() {

      <div class="side-btns">
        <button class="btn dark" id="btnNav">🗺️ Mapa do prédio</button>
        <button class="btn sec" id="btnQuadro">📌 Quadro da sala</button>
      </div>
      <p class="dica">A porta da sala também abre o mapa. O quadro na parede resume o que se vê aqui.</p>
    </div>`;
  side.querySelectorAll('[data-look]').forEach((el) => el.replaceWith(retratoCanvas(NPCS[el.dataset.look].look, 40)));
  side.querySelectorAll('.npc-item').forEach((b) => b.addEventListener('click', () => {

}
function fecharModal() { modal.classList.remove('on'); mbox.innerHTML = ''; }
modal.addEventListener('click', (e) => { if (e.target === modal && !mbox.querySelector('[data-travado]')) fecharModal(); });

function abrirIntroSala(revisita) {

  abrirModal(`
    <button class="x-btn" aria-label="Fechar">✕</button>

function abrirNavegador() {
  const lista = SALAS.map((s, i) => {

      <span class="e">${lib ? s.emoji : '🔒'}</span>
      <span><span class="n">${s.nome}</span><br><span class="u">${s.unidade}</span></span>
      <span class="p">${aqui ? 'Você está aqui' : lib ? `${f}/${s.missoes.length}` : 'Trancada'}</span></button>`;

  mbox.querySelectorAll('.nav-item:not([disabled])').forEach((b) => b.addEventListener('click', () => {

function irParaSala(i) {
  estado.sala = i;

function concluirMissao(mid) {

function blocoConceito(m) { return `<div class="conceito"><b>${m.conceito.titulo}</b>${m.conceito.texto}</div>`; }
function montarEscolha(mid) {
  const m = MISSOES[mid];
  if (!estado.ordem[mid]) estado.ordem[mid] = embaralhar(m.opcoes.map((_, i) => i));
  const corpo = document.getElementById('corpo');
  corpo.innerHTML = `<div class="opts">${estado.ordem[mid].map((oi, k) => `<button class="opt" data-oi="${oi}"><span class="l">${'ABCD'[k]}</span><span>${m.opcoes[oi].t}</span></button>`).join('')}</div>`;
  corpo.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => {
    const op = m.opcoes[Number(b.dataset.oi)];
    const fb = document.getElementById('fb');
    if (op.ok) {
      corpo.querySelectorAll('.opt').forEach((x) => { x.disabled = true; });
      b.classList.add('right');
      fb.innerHTML = `<div class="fb ok"><b>${estado.errou[mid] ? 'Agora sim.' : 'Certo de primeira!'}</b>${op.why}</div>${blocoConceito(m)}`;
      concluirMissao(mid);
    } else {
      estado.errou[mid] = true; Musica.sfx('erro');
      b.classList.add('wrong'); b.disabled = true;
      fb.innerHTML = `<div class="fb err"><b>Ainda não.</b>${op.why} Tente outra alternativa.</div>`;
    }

function montarClassificar(mid) {
  const m = MISSOES[mid];
  if (!estado.ordem[mid]) estado.ordem[mid] = embaralhar(m.itens.map((_, i) => i));
  const escolhas = {}; const travados = {};
  const corpo = document.getElementById('corpo');
  corpo.innerHTML = `<div class="cls">${estado.ordem[mid].map((ii) => `
    <div class="cls-item" data-ii="${ii}"><p>${m.itens[ii].t}</p>
      <div class="cls-btns">${m.categorias.map((c, ci) => `<button data-ci="${ci}">${c}</button>`).join('')}</div>
      <div class="cls-why"></div></div>`).join('')}</div>`;
  const rod = document.getElementById('rodape');
  rod.innerHTML = '<button class="btn" id="conferir" disabled>Conferir</button>';
  const btnC = document.getElementById('conferir');
  const checar = () => { btnC.disabled = m.itens.some((_, ii) => escolhas[ii] == null); };
  corpo.querySelectorAll('.cls-item').forEach((it) => {
    const ii = Number(it.dataset.ii);
    it.querySelectorAll('.cls-btns button').forEach((b) => b.addEventListener('click', () => {
      if (travados[ii]) return;
      escolhas[ii] = Number(b.dataset.ci);
      it.querySelectorAll('.cls-btns button').forEach((x) => x.classList.toggle('sel', x === b));
      it.classList.remove('wrong'); it.querySelector('.cls-why').textContent = '';
      checar();
    }));
  });
  btnC.addEventListener('click', () => {
    let erros = 0;
    corpo.querySelectorAll('.cls-item').forEach((it) => {
      const ii = Number(it.dataset.ii), item = m.itens[ii];
      if (travados[ii]) return;
      if (escolhas[ii] === item.cat) {
        travados[ii] = true; it.classList.add('right');
        it.querySelectorAll('.cls-btns button').forEach((x) => { x.disabled = true; });
        it.querySelector('.cls-why').textContent = '✓ ' + item.why;
      } else {
        erros++; it.classList.add('wrong');
        it.querySelector('.cls-why').textContent = 'Reveja esta. Pense: ' + dicaCategoria(m, item);
        escolhas[ii] = null; it.querySelectorAll('.cls-btns button').forEach((x) => x.classList.remove('sel'));
      }
    });
    const fb = document.getElementById('fb');
    if (erros) {
      estado.errou[mid] = true; Musica.sfx('erro');
      fb.innerHTML = `<div class="fb err"><b>${erros === 1 ? 'Falta acertar uma.' : `Faltam ${erros}.`}</b>As certas ficaram travadas. Reclassifique as marcadas em vermelho e confira de novo.</div>`;

const PEER_CFG = (() => {
  const q = new URLSearchParams(location.search), h = q.get('peerhost');
  return h ? { host: h, port: Number(q.get('peerport') || 9000), path: '/', secure: false, debug: 0 } : { debug: 0 };

const PREFIXO = 'rebootti-senac-';
const LETRAS = 'ABCDEFGHJKMNPQRSTUVWXYZ';
const CHAVE_LS = 'rebootti-v1';
function novoCodigo() { let c = ''; for (let i = 0; i < 4; i++) c += LETRAS[Math.floor(Math.random() * LETRAS.length)]; return c; }
function normCodigo(s) { return String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); }

/* ---------- a dupla ---------- */
const Dupla = {
  peer: null, conn: null, online: false, parceiro: null, pistas: {}, ouvindo: false,
  P: { id: '__parceiro', x: 2, y: 5, dir: 0, path: [], walking: false, sala: 0 },

  disponivel() { return typeof Peer !== 'undefined'; },

  criarPeer(id) {
    return new Promise((ok, falha) => {
      let pronto = false;
      const p = id ? new Peer(id, PEER_CFG) : new Peer(PEER_CFG);
      p.on('open', () => { pronto = true; ok(p); });
      p.on('error', (e) => { if (!pronto) falha(e); else Dupla.erroPeer(e); });
      setTimeout(() => { if (!pronto) { try { p.destroy(); } catch (e) { /* */ } falha({ type: 'timeout' }); } }, 15000);
    });
  },

  erroPeer(e) {
    // erros depois de aberto: quase sempre o colega fora do ar; o jogo segue
    if (e && e.type === 'peer-unavailable' && estado.modo === 'guest') Dupla.agendarReconexao();
  },

  async hospedar(codigo, tentativas = 8) {
    for (let i = 0; i < tentativas; i++) {
      try {
        const p = await Dupla.criarPeer(PREFIXO + codigo);
        Dupla.peer = p; Dupla.ouvindo = true;
        p.on('connection', (c) => { if (c.label === 'placar') return; Dupla.ligar(c); });
        p.on('disconnected', () => { try { p.reconnect(); } catch (e) { /* */ } });
        return true;
      } catch (e) {
        if (e && e.type === 'unavailable-id') { await new Promise((r) => setTimeout(r, 3000)); continue; }
        throw e;
      }
    }
    throw { type: 'unavailable-id' };
  },

  async entrar(codigo, espera = 20000) {
    if (!Dupla.peer || Dupla.peer.destroyed) {
      Dupla.peer = await Dupla.criarPeer();
      Dupla.peer.on('disconnected', () => { try { Dupla.peer.reconnect(); } catch (e) { /* */ } });
    }
    return new Promise((ok, falha) => {
      const c = Dupla.peer.connect(PREFIXO + codigo, { reliable: true, label: 'dupla' });
      const t = setTimeout(() => { if (!Dupla.online) { try { c.close(); } catch (e) { /* */ } falha({ type: 'timeout' }); } }, espera);
      Dupla.ligar(c, () => { clearTimeout(t); ok(true); });
    });
  },

  ligar(c, aoAbrir) {
    if (Dupla.conn && Dupla.conn !== c) { try { Dupla.conn.close(); } catch (e) { /* */ } }
    Dupla.conn = c;
    c.on('open', () => {
      Dupla.online = true;
      Dupla.enviar(Dupla.ola(false));
      if (aoAbrir) aoAbrir();
      atualizarHud();
    });
    c.on('data', (m) => Dupla.receber(m));
    c.on('close', () => {
      if (Dupla.conn !== c) return;
      Dupla.online = false; atualizarHud();
      if (estado.tela === 'jogo') toast(`👥 ${Dupla.parceiro ? Dupla.parceiro.apelido : 'Sua dupla'} saiu da conexão. Você segue jogando.`);
      if (estado.modo === 'guest') Dupla.agendarReconexao();
    });
    c.on('error', () => { /* tratado no close */ });
  },

  agendarReconexao() {
    if (Dupla._rc || estado.modo !== 'guest' || !estado.codigo) return;
    Dupla._rc = setTimeout(async () => {
      Dupla._rc = null;
      if (Dupla.online) return;
      try { await Dupla.entrar(estado.codigo, 12000); toast('👥 Dupla reconectada.'); } catch (e) { Dupla.agendarReconexao(); }
    }, 5000);
  },

  ola(resposta) {
    const p = M.player || { x: 1, y: 5 };
    return { t: 'ola', resposta, nome: estado.nome, apelido: apelido(), look: estado.avatar,
      feitas: estado.feitas, errou: estado.errou, sala: estado.sala, x: Math.round(p.x), y: Math.round(p.y) };
  },

  enviar(m) { if (Dupla.conn && Dupla.conn.open) { try { Dupla.conn.send(m); } catch (e) { /* */ } } },

  visivel() { return Dupla.online && Dupla.parceiro && Dupla.P.sala === estado.sala && estado.tela === 'jogo'; },

  receber(m) {
    if (!m || !m.t) return;
    if (m.t === 'ola') {
      const novo = !Dupla.parceiro;
      Dupla.parceiro = { nome: m.nome, apelido: m.apelido, look: m.look };
      NPCS.__parceiro = { nome: m.apelido, cargo: 'sua dupla', look: m.look, falas: [] };
      estado.parceiro = { nome: m.nome, apelido: m.apelido };
      Object.assign(Dupla.P, { sala: m.sala, x: m.x, y: m.y, path: [], walking: false });
      // junta o progresso dos dois: o que um resolveu vale para a dupla
      Object.keys(m.feitas || {}).forEach((k) => {
        if (!estado.feitas[k]) { estado.feitas[k] = true; estado.errou[k] = !!(m.errou || {})[k]; }
        else estado.errou[k] = !!estado.errou[k] && !!(m.errou || {})[k];
      });
      if (!m.resposta) Dupla.enviar(Dupla.ola(true));
      if (novo && estado.tela === 'jogo') toast(`👥 ${m.apelido} está na sua dupla!`);
      if (typeof Lobby !== 'undefined') Lobby.parceiroChegou();
      atualizarHud(); if (estado.tela === 'jogo') atualizarPainel();
      salvar(); Placar.reportar();
      return;
    }
    if (m.t === 'path') { Object.assign(Dupla.P, { sala: m.sala, x: m.from[0], y: m.from[1], path: m.path || [] }); return; }
    if (m.t === 'sala') { Object.assign(Dupla.P, { sala: m.sala, x: m.x, y: m.y, path: [], walking: false }); return; }
    if (m.t === 'chat') {
      if (Dupla.visivel()) falar(Dupla.P, m.txt);
      else toast(`💬 ${Dupla.parceiro ? Dupla.parceiro.apelido : 'Dupla'}: ${m.txt}`);
      Musica.sfx('blip');
      return;
    }
    if (m.t === 'done') {
      delete Dupla.pistas[m.mid]; Dupla.mostrarPistas();
      if (!estado.feitas[m.mid]) {
        estado.feitas[m.mid] = true; estado.errou[m.mid] = !!m.errou;
        const quem = Dupla.parceiro ? Dupla.parceiro.apelido : 'Sua dupla';
        toast(`✅ ${quem} resolveu: ${MISSOES[m.mid].tema}`);
        Musica.sfx('ok');
        salvar();
        if (estado.tela === 'jogo') { atualizarPainel(); atualizarHud(); Dupla.checarSala(m.mid); }
      }
      return;
    }
    if (m.t === 'pista') {
      Dupla.pistas[m.mid] = { de: Dupla.parceiro ? Dupla.parceiro.apelido : 'sua dupla' };
      Dupla.mostrarPistas(); Musica.sfx('abrir');
      toast(`📎 Chegou uma evidência para ${Dupla.pistas[m.mid].de}. Leia para a sua dupla!`);
      return;
    }
    if (m.t === 'pista-fim') { delete Dupla.pistas[m.mid]; Dupla.mostrarPistas(); return; }
    if (m.t === 'emote') {
      if (Dupla.visivel()) { emoteEm('parceiro', m.e); Musica.sfx('blip'); }
      else if (estado.tela === 'jogo') toast(`${m.e} ${Dupla.parceiro ? Dupla.parceiro.apelido : 'Sua dupla'} reagiu de outra sala.`);
      return;
    }
  },

  checarSala(mid) {
    const i = SALAS.findIndex((s) => s.missoes.includes(mid));
    if (feitasTotal() === TOTAL) {
      if (!modal.classList.contains('on')) posConclusao();
      else Dupla._fimPendente = true;
      return;
    }
    if (i >= 0 && salaCompleta(i) && i + 1 < SALAS.length) toast(`🚪 ${SALAS[i].nome} concluída. ${SALAS[i + 1].emoji} ${SALAS[i + 1].nome} liberada!`);
  },

  atualizar(dt) {
    const q = Dupla.P;
    if (!q.path || !q.path.length) { q.walking = false; return; }
    const [nx, ny] = q.path[0];
    const dx = nx - q.x, dy = ny - q.y, d = Math.hypot(dx, dy), passo = 3.4 * dt;
    if (d > 0.001) q.dir = dirPara(dx, dy, q.dir);
    q.walking = true;
    if (d <= passo) { q.x = nx; q.y = ny; q.path.shift(); if (!q.path.length) q.walking = false; }
    else { q.x += dx / d * passo; q.y += dy / d * passo; }
  },

  mostrarPistas() {
    let el = document.getElementById('evid');
    const ids = Object.keys(Dupla.pistas);
    if (!ids.length) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'evid'; document.body.appendChild(el); }
    el.innerHTML = `<div class="ev-h">📎 Evidência para ${esc(Dupla.pistas[ids[0]].de)}<button class="ev-min" aria-label="Recolher">–</button></div>` +
      ids.map((mid) => `<div class="ev-b"><span class="ev-t">${MISSOES[mid].tema}</span><div>${MISSOES[mid].partes ? MISSOES[mid].partes[1] : MISSOES[mid].pista}</div></div>`).join('') +
      `<p class="ev-d">Só você está vendo isto. Leia em voz alta para a sua dupla.</p>`;
    el.querySelector('.ev-min').addEventListener('click', () => el.classList.toggle('min'));
  },
};

const Placar = {
  conn: null, _t: null,
  chave() { return estado.modo !== 'solo' && estado.codigo ? 'D-' + estado.codigo : 'S-' + estado.matricula; },
  async conectar() {
    if (!estado.placar || !Dupla.disponivel()) return;
    if (Placar.conn && Placar.conn.open) return;
    try {
      if (!Dupla.peer || Dupla.peer.destroyed) Dupla.peer = await Dupla.criarPeer();
      const c = Dupla.peer.connect(PREFIXO + 'placar-' + estado.placar, { reliable: true, label: 'placar' });
      c.on('open', () => { Placar.conn = c; Placar.reportar(); });
      c.on('close', () => { Placar.conn = null; Placar.agendar(); });
      c.on('error', () => { Placar.agendar(); });
      setTimeout(() => { if (!c.open) Placar.agendar(); }, 12000);
    } catch (e) { Placar.agendar(); }
  },
  agendar() { clearTimeout(Placar._t); Placar._t = setTimeout(() => Placar.conectar(), 10000); },
  reportar(final) {

        salaNome: SALAS[estado.sala].emoji + ' ' + SALAS[estado.sala].nome, final: !!final || feitasTotal() === TOTAL, ts: Date.now() });

};

    if (t < 10) {
      const z = 1 + ease(lim((t - 5.2) / 4.6)) * 2.4, fx = PREDIO.x + PREDIO.w / 2, fy = VH - BARRA - PREDIO.h - 20;
      ctx.save(); ctx.translate(fx, fy); ctx.scale(z, z); ctx.translate(-fx, -fy + (z - 1) * 30); cidade(t); ctx.restore();
    } else if (t < 15.6) chamados(t);
    else if (t < 21.5) equipe(t);
    else titulo(t);
    const cortes = [10, 15.6, 21.5];
    let preto = t < .9 ? 1 - t / .9 : 0;
    cortes.forEach((c) => { preto = Math.max(preto, 1 - Math.abs(t - c) / .45); });
    if (preto > 0) { ctx.fillStyle = `rgba(0,0,0,${preto.toFixed(3)})`; ctx.fillRect(0, 0, VW, VH); }
    const barra = t < 21.5 ? BARRA : BARRA * (1 - ease(lim((t - 21.5) / .8)));
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, barra); ctx.fillRect(0, VH - barra, VW, barra);
    legenda(t);
    ctx.restore();
    raf = requestAnimationFrame(quadro);
  }

  function medir() {
    if (!cv) return;
    dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + 'px'; cv.style.height = h + 'px';
    esc = Math.min(w / VW, h / VH); ox = (w - VW * esc) / 2; oy = (h - VH * esc) / 2;
  }
  function tecla(e) { if (e.key === 'Escape' || (e.key === 'Enter' && botaoFim)) fechar(); }
  function comecar() {
    Musica.iniciar(); Musica.tocar('menu');
    el.innerHTML = '<canvas id="cineCv" aria-label="Abertura do jogo"></canvas><button id="cineSkip" aria-label="Pular abertura">Pular ›</button>';
    cv = el.querySelector('#cineCv'); ctx = cv.getContext('2d');
    el.querySelector('#cineSkip').addEventListener('click', () => fechar());
    medir(); window.addEventListener('resize', medir);
    tocados = {}; botaoFim = false; t0 = performance.now();
    raf = requestAnimationFrame(quadro);
  }
  function abrir() {
    if (el) return;
    el = document.createElement('div'); el.id = 'cine';
    el.innerHTML = `<div class="cine-gate">
      <svg width="96" height="96" viewBox="0 0 34 34" aria-hidden="true"><polygon points="17,3 31,10 17,17 3,10" fill="#F2A65A"/><polygon points="3,10 17,17 17,31 3,24" fill="#1F6F6B"/><polygon points="31,10 17,17 17,31 31,24" fill="#15524F"/></svg>
      <h1>Reboot TI</h1><p>Um plantão inteiro na nuvem</p>
      <button class="btn" id="cineGo">▶ Começar</button>
      <button class="cine-link" id="cinePular">Pular a abertura</button>
      <small>Melhor com som 🔊</small></div>`;
    document.body.appendChild(el);
    el.querySelector('#cineGo').addEventListener('click', comecar);
    el.querySelector('#cinePular').addEventListener('click', () => { Musica.iniciar(); fechar(); });
    document.addEventListener('keydown', tecla);
  }
  function fechar(rapido) {
    if (!el) return;
    if (raf) cancelAnimationFrame(raf); raf = null;
    window.removeEventListener('resize', medir); document.removeEventListener('keydown', tecla);
    const alvo = el; el = null; cv = null;
    const fim = () => { alvo.remove(); const n = document.getElementById('inNome'); if (n) n.focus(); };
    if (rapido) fim(); else { alvo.classList.add('saindo'); setTimeout(fim, 450); }
  }
  return { abrir, fechar, aberta: () => !!el };
})();

retomar().then((r) => { render(); if (!r) Cinematica.abrir(); });

</script>
