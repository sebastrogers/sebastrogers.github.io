<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fazenda dos Paradigmas · Coding: Linguagens e Técnicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{
  --pau:#5A3214; --pau2:#3A2010; --creme:#FCE6B4; --creme2:#F5D79B; --tinta:#4A2A10; --tinta2:#7A5530;
  --ouro:#F2B84B; --verde:#3E8E3A; --verm:#B5382B;
}
*{box-sizing:border-box;font-variant-ligatures:none}
html,body{margin:0;padding:0}
body{font-family:"Nunito",system-ui,sans-serif;color:var(--tinta);min-height:100vh;
  background:#2E4A1E;
  background-image:linear-gradient(180deg,#7EC8EE 0,#A9DDF2 160px,#6FAE36 160px,#62A12F 100%);
  background-attachment:fixed}
h1,h2,h3,h4{margin:0;font-family:"Pixelify Sans",sans-serif;line-height:1.1}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #FFF3B0;outline-offset:2px}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.oculto{display:none!important}

.madeira{background:var(--creme);border:4px solid var(--pau);border-radius:10px;color:var(--tinta);
  box-shadow:inset 0 0 0 3px #D9954A,inset 0 0 0 6px #F7D594,0 4px 0 rgba(0,0,0,.35)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ouro);color:var(--pau2);font-family:"Pixelify Sans",sans-serif;font-size:1.08rem;font-weight:700;
  padding:.5em 1.1em;border:3px solid var(--pau);border-radius:8px;box-shadow:inset 0 -3px 0 #C98A2A,0 3px 0 var(--pau2);transition:transform .08s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 #C98A2A,0 1px 0 var(--pau2)}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:not-allowed;transform:none}
.btn.sec{background:#F7E8C4;box-shadow:inset 0 -3px 0 #D8BE8A,0 3px 0 var(--pau2)}
.btn.peq{font-size:.9rem;padding:.35em .8em}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.acoes.centro{justify-content:center}
.lbl{display:block;font-family:"Pixelify Sans",sans-serif;font-size:.95rem;color:var(--tinta2);margin-top:12px}
input[type=text]{width:100%;margin-top:5px;font-family:inherit;font-size:1rem;color:var(--tinta);background:#FFF8E6;border:3px solid #C9965A;border-radius:8px;padding:10px 12px}
input[type=text]:focus{outline:none;border-color:var(--pau)}

/* capa */
.capa{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 16px}
.logo{position:relative;text-align:center;margin-bottom:22px;display:flex;flex-direction:column;align-items:center}
.logo-sol{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#FFE680 0,#FFD24A 55%,rgba(255,210,74,0) 70%);top:-40px;right:-60px;z-index:-1}
.logo .l1,.logo .l2{font-family:"Pixelify Sans",sans-serif;font-weight:700;color:#FFE9A6;letter-spacing:.02em;
  text-shadow:3px 0 var(--pau),-3px 0 var(--pau),0 3px var(--pau),0 -3px var(--pau),3px 3px var(--pau),-3px -3px var(--pau),3px -3px var(--pau),-3px 3px var(--pau),7px 7px 0 rgba(0,0,0,.25)}
.logo .l1{font-size:clamp(1.5rem,4vw,2.2rem)}
.logo .l2{font-size:clamp(2.8rem,9vw,4.8rem);color:#9CE06A;margin-top:-4px}
.logo .l3{margin-top:10px;background:#B5844C;border:3px solid var(--pau);border-radius:6px;padding:4px 14px;font-family:"Pixelify Sans",sans-serif;color:#FFF3D6;font-size:1rem;box-shadow:0 3px 0 var(--pau2)}
.painel-capa{max-width:520px;width:100%;padding:24px}
.capa-txt{font-size:1rem;line-height:1.55}
.painel-avatar{max-width:760px;width:100%;padding:24px}
.titulo-painel{font-size:1.8rem;color:var(--pau);margin-bottom:6px}
.av-grid{display:grid;grid-template-columns:190px 1fr;gap:24px;align-items:start;margin-top:8px}
.av-prev{background:linear-gradient(180deg,#9ED7F2 0,#9ED7F2 60%,#71AE36 60%);border:3px solid #C9965A;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:14px 8px 10px}
.av-botoes{display:flex;gap:6px;margin-top:10px}
.sw-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.sw{width:30px;height:30px;border-radius:6px;border:3px solid var(--pau)}
.sw.sel{outline:3px solid #FFF;box-shadow:0 0 0 6px var(--pau)}
.sw-t{padding:5px 10px;border-radius:7px;border:3px solid #C9965A;background:#FFF8E6;font-family:"Pixelify Sans",sans-serif;font-size:.92rem;color:var(--tinta2)}
.sw-t.sel{border-color:var(--pau);background:var(--ouro);color:var(--pau2)}
.pergaminho{max-width:680px;width:100%;background:#FFF4D8;border:4px solid #B98A4E;border-radius:6px;padding:30px 34px;box-shadow:0 0 0 4px #F0DDB0,0 8px 0 rgba(0,0,0,.25);
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent 27px,rgba(185,138,78,.18) 27px,rgba(185,138,78,.18) 28px)}
.pergaminho h2{font-size:1.7rem;color:var(--pau);margin-bottom:12px}
.pergaminho p{font-size:1.06rem;line-height:1.75}
.pips{display:flex;gap:6px;margin-top:18px}
.pip{width:12px;height:12px;border:2px solid var(--pau);background:#F7E8C4}
.pip.on{background:var(--ouro)}

/* jogo */
#palco{position:relative;max-width:1240px;margin:14px auto 6px;border:6px solid var(--pau);border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px #D9954A,0 10px 30px rgba(0,0,0,.4);background:#1B2A12}
#tela{display:block;width:100%;height:clamp(420px,80vh,780px);cursor:pointer}
.dica-teclas{text-align:center;font-family:"Pixelify Sans",sans-serif;color:#FFF3D6;text-shadow:0 2px 0 rgba(0,0,0,.4);font-size:.92rem;margin:4px 12px 20px}
#relogio{position:absolute;top:10px;right:10px;min-width:158px;max-width:240px;padding:8px 12px;font-family:"Pixelify Sans",sans-serif;text-align:center;pointer-events:none}
.rel-fazenda{font-size:.8rem;line-height:1.15;color:var(--tinta2);overflow-wrap:anywhere}
.rel-linha{display:flex;justify-content:space-between;font-size:1.05rem;margin-top:2px}
.rel-hora{font-size:1.5rem;color:var(--pau)}
.rel-ouro{margin-top:4px;background:#F7E8C4;border:2px solid #C9965A;border-radius:6px;padding:2px 6px;display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:1.05rem}
.moeda{display:inline-block;width:12px;height:12px;border-radius:50%;background:#F2C744;border:2px solid #A8741A;box-shadow:inset -2px -2px 0 #D9A22A}
#objetivos{position:absolute;top:10px;left:10px;width:250px;padding:10px 14px;font-size:.88rem}
#objetivos h4{font-size:1.05rem;color:var(--pau)}
.obj-sub{font-size:.74rem;color:var(--tinta2);margin-top:2px}
#objetivos ul{list-style:none;margin:8px 0 0;padding:0}
#objetivos li{padding:2px 0;font-weight:700}
#objetivos li.feito{color:#3E7A2E;text-decoration:line-through;opacity:.75}
.obj-total{margin-top:6px;font-family:"Pixelify Sans",sans-serif;font-size:.85rem;color:var(--tinta2)}
.obj-ok{margin:6px 0 10px;font-weight:700}
#hotbar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--creme);border:4px solid var(--pau);border-radius:10px;padding:5px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.slot{position:relative;width:46px;height:46px;background:#F7E8C4;border:3px solid #C9965A;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.slot.ativo{border-color:#E03A2E;box-shadow:0 0 0 2px #FFF3B0;background:#FFF6DC}
.slot b{position:absolute;right:3px;bottom:0;font-family:"Pixelify Sans",sans-serif;font-size:.85rem;color:var(--pau2);text-shadow:1px 1px 0 #FFF}
#dialogo{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);width:min(820px,94%);display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px 18px;cursor:pointer}
.dl-nome{display:inline-block;font-family:"Pixelify Sans",sans-serif;font-size:1.05rem;background:#B5844C;color:#FFF3D6;border:3px solid var(--pau);border-radius:6px;padding:1px 10px;margin-bottom:8px}
#dialogo p{font-size:1.08rem;line-height:1.5;font-weight:600}
.dl-seta{display:block;text-align:right;color:var(--verm);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.2}}
.dl-ret{background:linear-gradient(180deg,#9ED7F2 0,#9ED7F2 65%,#71AE36 65%);border:3px solid var(--pau);border-radius:8px;padding:6px;display:flex;align-items:flex-end;justify-content:center}
#btnSom{position:absolute;right:10px;bottom:10px;width:46px;height:46px;font-family:"Pixelify Sans",sans-serif;font-size:1.3rem}
#mobile .dpad{position:absolute;left:14px;bottom:74px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
#mobile .dpad button{background:rgba(252,230,180,.9);border:3px solid var(--pau);border-radius:8px;font-size:1.1rem;color:var(--pau)}
#mobile [data-k=up]{grid-column:2;grid-row:1}#mobile [data-k=left]{grid-column:1;grid-row:2}#mobile [data-k=right]{grid-column:3;grid-row:2}#mobile [data-k=down]{grid-column:2;grid-row:3}
.acao-mob{position:absolute;right:66px;bottom:74px;width:64px;height:64px;border-radius:50%;background:var(--ouro);border:4px solid var(--pau);font-family:"Pixelify Sans",sans-serif;font-size:1.6rem;color:var(--pau2)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(20,12,4,.6);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:24px 12px;overflow-y:auto}
#modal.on{display:flex}
#mbox{position:relative;max-width:740px;width:100%;margin:auto 0;background:var(--creme);border:4px solid var(--pau);border-radius:12px;padding:22px 24px;
  box-shadow:inset 0 0 0 3px #D9954A,inset 0 0 0 6px #F7D594,0 8px 0 rgba(0,0,0,.35)}
.x-btn{position:absolute;right:12px;top:10px;font-family:"Pixelify Sans",sans-serif;font-size:1.2rem;color:var(--tinta2);padding:4px 9px;border-radius:6px}
.x-btn:hover{background:#F5D79B}
.d-head{display:flex;gap:12px;align-items:center}
.d-ic{font-size:2rem;background:#F7E8C4;border:3px solid #C9965A;border-radius:8px;width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.d-rot{font-family:"Pixelify Sans",sans-serif;font-size:.85rem;color:var(--tinta2)}
.d-head h3{font-size:1.45rem;color:var(--pau)}
.d-ctx{margin-top:14px;font-size:1rem;line-height:1.55;background:#FFF6DC;border-left:5px solid #C9965A;padding:10px 12px;border-radius:0 8px 8px 0}
.d-perg{margin-top:14px;font-weight:800;font-size:1.06rem}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;background:#FFF8E6;border:3px solid #D8B47C;border-radius:8px;padding:10px 12px;font-size:.98rem;font-weight:600;color:var(--tinta)}
.opt .mao{font-family:"Pixelify Sans",sans-serif;color:transparent}
.opt:hover:not(:disabled){border-color:var(--pau);background:#FFF1CC}
.opt:hover:not(:disabled) .mao{color:var(--verm)}
.opt:disabled{cursor:default}
.certo{border-color:#3E8E3A!important;background:#E6F5DC!important}
.errado{border-color:#B5382B!important;background:#FBE3DE!important;opacity:.85}
.fb{margin-top:12px;border-radius:8px;padding:10px 12px;border:3px solid;font-size:.95rem;line-height:1.5}
.fb b{display:block;font-family:"Pixelify Sans",sans-serif;font-size:1.05rem;margin-bottom:2px}
.fb.ok{background:#E6F5DC;border-color:#3E8E3A;color:#23531A}
.fb.err{background:#FBE3DE;border-color:#B5382B;color:#6E1D14}
.conceito{margin-top:12px;border-radius:8px;padding:12px 14px;background:#FFF1C4;border:3px dashed #C9965A;font-size:.95rem;line-height:1.5}
.conceito b{display:block;font-family:"Pixelify Sans",sans-serif;font-size:1.05rem;color:var(--pau);margin-bottom:3px}
.afirm{margin-top:14px;font-size:1.15rem;font-weight:800;text-align:center;background:#FFF8E6;border:3px solid #D8B47C;border-radius:8px;padding:16px}
.vf{display:flex;gap:12px;justify-content:center;margin-top:14px}
.vfb{min-width:140px;justify-content:center}
.codigo{margin-top:12px;background:#2A2118;border:3px solid var(--pau);border-radius:8px;padding:8px 0;overflow-x:auto}
.linha{display:flex;gap:12px;width:100%;text-align:left;padding:3px 12px;border-left:4px solid transparent;color:#F2E6CC;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.linha:hover:not(:disabled){background:#3E3122;border-left-color:#F2B84B}
.linha:disabled{cursor:default}
.linha .ln{color:#9C8866;min-width:18px;text-align:right}
.linha code{white-space:pre;font-family:inherit}
.linha.certo{background:#2F5A26!important;border-left-color:#8AD35A}
.linha.errado{background:#5A2620!important;border-left-color:#E86A5A}
.cls{display:grid;gap:8px;margin-top:12px}
.cls-item{background:#FFF8E6;border:3px solid #D8B47C;border-radius:8px;padding:10px 12px}
.cls-item p{font-weight:700}
.cls-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cls-btns button{border:2px solid #C9965A;border-radius:6px;padding:4px 10px;font-family:"Pixelify Sans",sans-serif;font-size:.9rem;background:#FFF;color:var(--tinta2)}
.cls-btns button.sel{background:var(--ouro);border-color:var(--pau);color:var(--pau2)}
.cls-why{font-size:.86rem;margin-top:5px;font-weight:600}
.ord-dica{margin-top:10px;font-size:.9rem;color:var(--tinta2)}
.ord-seq,.ord-pool{display:grid;gap:6px;margin-top:10px}
.ord-pool{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding-top:10px;border-top:3px dashed #D8B47C}
.ord-vaga{border:3px dashed #D8B47C;border-radius:8px;padding:9px 12px;font-family:"Pixelify Sans",sans-serif;color:#C9A36B}
.ord-card{text-align:left;display:flex;gap:10px;align-items:center;background:#FFF8E6;border:3px solid #D8B47C;border-radius:8px;padding:9px 12px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;color:var(--tinta)}
.ord-card:hover:not(:disabled){border-color:var(--pau)}
.ord-card .ln{font-family:"Pixelify Sans",sans-serif;color:var(--tinta2)}
.carta{background:#FFF7E3;border:3px solid #D8B47C;border-radius:6px;padding:22px 26px;position:relative;
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent 25px,rgba(185,138,78,.16) 25px,rgba(185,138,78,.16) 26px)}
.carta-selo{position:absolute;right:16px;top:14px;width:48px;height:48px;border-radius:50%;background:#C0392B;border:3px solid #7A1F16;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.carta-kicker{font-family:"Pixelify Sans",sans-serif;color:var(--verm);font-size:.9rem}
.carta h3{font-size:1.5rem;color:var(--pau);margin:4px 0 12px}
.carta p{margin-top:8px;line-height:1.6}
.carta ul{margin:6px 0 0;padding-left:22px;line-height:1.6;font-weight:700}
.carta-ass{font-style:italic;text-align:right;color:var(--tinta2)}
.painel-final{max-width:760px;width:100%;padding:24px}
.final-top{display:flex;gap:18px;align-items:center;margin-top:10px}
.final-top > div:first-child{background:linear-gradient(180deg,#9ED7F2 0,#9ED7F2 65%,#71AE36 65%);border:3px solid var(--pau);border-radius:8px;padding:8px}
.big-num{font-family:"Pixelify Sans",sans-serif;font-size:3.2rem;color:var(--pau);line-height:1}
.final-ouro{display:flex;align-items:center;gap:8px;font-family:"Pixelify Sans",sans-serif;font-size:1.2rem;margin-top:6px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:16px}
.res-item{background:#FFF8E6;border:3px solid #D8B47C;border-radius:8px;padding:10px}
.res-item b{display:block}
.res-item small{color:var(--tinta2);font-weight:700}
.final-quem{margin-top:14px}
.selo{display:inline-block;background:#E6F5DC;border:3px solid #3E8E3A;color:#23531A;border-radius:8px;padding:6px 12px;font-weight:800;margin-top:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--creme);color:var(--tinta);border:4px solid var(--pau);border-radius:10px;padding:10px 18px;z-index:90;transition:transform .25s;font-weight:800;max-width:92vw;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:760px){
  .av-grid{grid-template-columns:1fr}
  #objetivos{width:190px;font-size:.78rem;padding:8px 10px}
  #relogio{min-width:120px;max-width:170px;padding:6px 8px}
  .rel-hora{font-size:1.2rem}
  .slot{width:38px;height:38px;font-size:1.2rem}
  #tela{height:72vh}
}
</style>

<script>
'use strict';
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzyVDcweu9eO6c8CztBCIj8y6hj1MXWVpWr0aFmXn_jrE3AYJC-BG7gc3OnsYiz6gbY/exec';
/* =====================================================================
   CONTEÚDO: uma unidade por talhão, em ordem de complexidade
   plantio = múltipla escolha · rega = verdadeiro ou falso
   bug = pesca do bug no lago · pedido = quadro de pedidos
   ===================================================================== */
const UNIDADES = [
  {
    id: 'u1', nome: 'Batata dos Fundamentos', cultura: 'batata', emoji: '🥔', unidade: 'Linguagens e fundamentos', preco: 20, predio: 'galinheiro',
    carta: {

      itens: ['Como escolher uma linguagem para um projeto', 'Paradigmas: imperativo, funcional e orientado a objetos', 'Tipos, coleções e dinheiro em Python', 'Funções, módulos, testes e a rotina do Git'],
    },
    plantio: [

        opcoes: [
          { t: 'A que melhor se encaixa no contexto do projeto', ok: true, why: 'Linguagem é ferramenta: decidem o problema, as bibliotecas disponíveis, o desempenho necessário e quem vai manter o código.' },
          { t: 'A mais nova do mercado, com os recursos mais modernos', why: 'Novidade não garante adequação. Uma linguagem recente pode não ter bibliotecas, comunidade ou estabilidade para o caso.' },
          { t: 'A que a equipe já usou antes, em qualquer situação', why: 'Familiaridade ajuda, mas usar sempre a mesma linguagem, mesmo quando ela não encaixa, gera soluções forçadas.' },
          { t: 'Qualquer uma, já que todas resolvem os mesmos problemas', why: 'Linguagens diferem em desempenho, ecossistema e propósito, e a escolha afeta a viabilidade do projeto.' },
        ],
        conceito: { titulo: 'Escolher uma linguagem', texto: 'É uma decisão de engenharia: pesa o problema, o ecossistema de bibliotecas, o desempenho exigido e a equipe disponível. Não existe "a melhor linguagem" fora de um contexto.' } },
      { tema: 'Paradigmas', contexto: 'Três pessoas calcularam o mesmo relatório de vendas, cada uma num estilo. A terceira escreveu no paradigma funcional.',

        opcoes: [
          { t: 'Usar map, filter e reduce sem alterar o dado original', ok: true, why: 'Essas funções transformam os dados e devolvem valores novos, sem mudar o original.' },

function usar() {

    if (G.pesca.fase === 'fisgou') { G.pesca = null; Musica.sfx('puxar'); abrirBug(unidadeAtual()); }
    else { G.pesca = null; toast('Cedo demais! A linha voltou vazia.'); }
    return;
  }
  const f = tileAFrente(), a0 = alvoEm(f.x, f.y);
  const a = a0 ? { ...a0, tx: f.x, ty: f.y } : null;
  G.alvo = a;
  if (!a) { return; }
  const ua = unidadeAtual();
  if (a.tipo === 'npc') return falarLurdes();
  if (a.tipo === 'correio') return abrirCarta();
  if (a.tipo === 'casa') return mostrarDialogo(apelido(), estado.look, ['Minha casa. Ainda não é hora de descansar: tem trabalho no campo!']);

  if (a.tipo === 'placa') { const U = UNIDADES[a.campo], u = estado.u[a.campo]; return mostrarDialogo('Placa', LURDES.look, [`Talhão ${a.campo + 1}: ${U.emoji} ${U.nome}.`, `Conteúdo: ${U.unidade}. Situação: ${u.completa ? 'colhido e replantado' : liberada(a.campo) ? 'aberto' : 'tomado pelo mato'}.`]); }
  if (a.tipo === 'trancado') { const ant = UNIDADES[a.campo - 1]; return mostrarDialogo(apelido(), estado.look, [`Este talhão ainda está tomado pelo mato. Ele abre quando eu terminar o de ${ant.nome.split(' ')[0].toLowerCase()}.`]); }

    return abrirPedido(ua);
  }
  if (a.tipo === 'agua') {
    if (ua < 0) return toast('O lago está calmo. Nenhum bug à vista.');
    if (!estado.u[ua].carta) return toast('Leia a carta do correio antes de pescar.');
    if (estado.u[ua].bug) return toast('Você já pescou o bug deste capítulo. O lago está calmo.');

  }
  if (a.tipo === 'plot') {

    if (i !== ua) return;

    if (p.fase === 'vazio') return abrirPlantio(i, a.k);
    if (p.fase === 'semeado') return abrirRega(i, a.k);

function abrirModal(html, semFechar) {
  mbox.innerHTML = (semFechar ? '' : '<button class="x-btn" aria-label="Fechar">✕</button>') + html;
  modal.classList.add('on');
  const x = mbox.querySelector('.x-btn'); if (x) x.addEventListener('click', fecharModal);
  G.teclas.clear();
}
function fecharModal() { modal.classList.remove('on'); mbox.innerHTML = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('on') && mbox.querySelector('.x-btn')) fecharModal(); });
function cabecalho(ic, rotulo, U, tema) { return `<div class="d-head"><span class="d-ic">${ic}</span><div><span class="d-rot">${rotulo} · ${U.emoji} ${U.nome}</span><h3>${tema}</h3></div></div>`; }
function blocoConceito(c) { return `<div class="conceito"><b>${c.titulo}</b>${c.texto}</div>`; }
function registrar(id, errou) { if (errou) estado.errou[id] = true; }
function concluir(id, aoFim) {
  estado.feitas[id] = true;
  Musica.sfx('ok');
  const rod = document.getElementById('rodape');
  rod.innerHTML = '<button class="btn" id="seguir">Continuar ▸</button>';
  const x = mbox.querySelector('.x-btn'); if (x) x.remove();
  document.getElementById('seguir').addEventListener('click', () => { fecharModal(); aoFim(); atualizarHUD(); });
}
function abrirPlantio(i, k) {
  const U = UNIDADES[i], q = U.plantio[k], id = `${U.id}-p${k}`;
  abrirModal(`${cabecalho('🌱', 'Plantio', U, q.tema)}
    <p class="d-ctx">${q.contexto}</p><p class="d-perg">${q.pergunta}</p>
    <div id="corpo"></div><div id="fb"></div><div class="acoes" id="rodape"></div>`);
  if (!estado.ordem[id]) estado.ordem[id] = embaralhar(q.opcoes.map((_, n) => n));
  const corpo = document.getElementById('corpo');
  corpo.innerHTML = `<div class="opts">${estado.ordem[id].map((oi) => `<button class="opt" data-oi="${oi}"><span class="mao">▸</span><span>${q.opcoes[oi].t}</span></button>`).join('')}</div>`;
  corpo.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => {
    const op = q.opcoes[Number(b.dataset.oi)], fb = document.getElementById('fb');
    if (op.ok) {
      corpo.querySelectorAll('.opt').forEach((x) => { x.disabled = true; }); b.classList.add('certo');
      fb.innerHTML = `<div class="fb ok"><b>${estado.errou[id] ? 'Agora sim!' : 'Certo de primeira!'}</b>${op.why}</div>${blocoConceito(q.conceito)}`;
      concluir(id, () => { estado.u[i].plots[k].fase = 'semeado'; const pl = plotsDoCampo(i)[k]; for (let n = 0; n < 8; n++) addPart(pl.x * T + 8, pl.y * T + 8, 'terra'); Musica.sfx('plantar'); });
    } else {
      registrar(id, true); Musica.sfx('erro'); b.classList.add('errado'); b.disabled = true;
      fb.innerHTML = `<div class="fb err"><b>Não foi dessa vez.</b>${op.why} Tente outra alternativa.</div>`;
    }
  }));
}
function abrirRega(i, k) {
  const U = UNIDADES[i], q = U.rega[k], id = `${U.id}-r${k}`;
  abrirModal(`${cabecalho('💧', 'Rega', U, 'Verdade ou mito?')}
    <p class="d-ctx">Para a semente brotar, decida se a afirmação é verdadeira ou falsa.</p>
    <div class="afirm">"${q.afirm}"</div>
    <div class="vf"><button class="btn vfb" data-v="1">Verdade</button><button class="btn vfb sec" data-v="0">Mito</button></div>
    <div id="fb"></div><div class="acoes" id="rodape"></div>`);
  mbox.querySelectorAll('.vfb').forEach((b) => b.addEventListener('click', () => {
    const resp = b.dataset.v === '1', fb = document.getElementById('fb');
    if (resp === q.v) {
      mbox.querySelectorAll('.vfb').forEach((x) => { x.disabled = true; }); b.classList.add('certo');
      fb.innerHTML = `<div class="fb ok"><b>${estado.errou[id] ? 'Isso!' : 'Certo de primeira!'} É ${q.v ? 'verdade' : 'mito'}.</b>${q.why}</div>`;
      concluir(id, () => { const p = estado.u[i].plots[k]; p.fase = 'crescendo'; p.cresc = 0; const pl = plotsDoCampo(i)[k]; for (let n = 0; n < 10; n++) addPart(pl.x * T + 8, pl.y * T, 'agua'); Musica.sfx('regar'); });
    } else {
      registrar(id, true); Musica.sfx('erro'); b.classList.add('errado'); b.disabled = true;
      fb.innerHTML = `<div class="fb err"><b>Não é bem assim.</b>Pense de novo e escolha a outra opção.</div>`;
    }
  }));
}
function abrirBug(i) {
  const U = UNIDADES[i], q = U.bug, id = `${U.id}-bug`;
  abrirModal(`${cabecalho('🎣', 'Pesca do bug', U, q.titulo)}
    <p class="d-ctx">Você fisgou um bug! ${q.contexto} Clique na linha onde ele está escondido.</p>
    <div class="codigo">${q.codigo.map((l, n) => `<button class="linha" data-n="${n}" ${l.trim() ? '' : 'disabled'}><span class="ln">${n + 1}</span><code>${esc(l) || ' '}</code></button>`).join('')}</div>
    <div id="fb"></div><div class="acoes" id="rodape"></div>`);
  mbox.querySelectorAll('.linha:not([disabled])').forEach((b) => b.addEventListener('click', () => {
    const n = Number(b.dataset.n), fb = document.getElementById('fb');
    if (n === q.linha) {
      mbox.querySelectorAll('.linha').forEach((x) => { x.disabled = true; }); b.classList.add('certo');
      fb.innerHTML = `<div class="fb ok"><b>${estado.errou[id] ? 'Achou!' : 'Fisgado de primeira!'}</b>${q.why}</div>${blocoConceito(q.conceito)}`;
      concluir(id, () => { estado.u[i].bug = true; G.jog.segura = null; toast('Bug capturado e consertado!'); checarUnidade(i); });
    } else {
      registrar(id, true); Musica.sfx('erro'); b.classList.add('errado'); b.disabled = true;
      fb.innerHTML = '<div class="fb err"><b>O bug não está nessa linha.</b>Leia de novo o sintoma descrito e procure a linha que o explica.</div>';
    }
  }));
}
function abrirPedido(i) {
  const U = UNIDADES[i], q = U.pedido, id = `${U.id}-ped`;
  abrirModal(`${cabecalho('📜', 'Quadro de pedidos', U, q.titulo)}
    <p class="d-ctx">Recado preso no quadro: ${q.contexto}</p>
    <div id="corpo"></div><div id="fb"></div><div class="acoes" id="rodape"></div>`);
  if (q.tipo === 'classificar') montarClassificar(i, q, id); else montarOrdenar(i, q, id);
}
function fimPedido(i) { estado.u[i].pedido = true; estado.moedas += 100; Musica.sfx('moeda'); toast('Pedido atendido! +100 moedas.'); checarUnidade(i); }
function montarClassificar(i, q, id) {
  if (!estado.ordem[id]) estado.ordem[id] = embaralhar(q.itens.map((_, n) => n));
  const escolha = {}, trava = {};
  const corpo = document.getElementById('corpo');
  corpo.innerHTML = `<div class="cls">${estado.ordem[id].map((n) => `<div class="cls-item" data-n="${n}"><p>${q.itens[n].t}</p><div class="cls-btns">${q.categorias.map((c, ci) => `<button data-ci="${ci}">${c}</button>`).join('')}</div><div class="cls-why"></div></div>`).join('')}</div>`;
  const rod = document.getElementById('rodape'); rod.innerHTML = '<button class="btn" id="conferir" disabled>Conferir</button>';
  const bc = document.getElementById('conferir');
  const checar = () => { bc.disabled = q.itens.some((_, n) => escolha[n] == null); };
  corpo.querySelectorAll('.cls-item').forEach((it) => {
    const n = Number(it.dataset.n);
    it.querySelectorAll('.cls-btns button').forEach((b) => b.addEventListener('click', () => {
      if (trava[n]) return; escolha[n] = Number(b.dataset.ci);
      it.querySelectorAll('.cls-btns button').forEach((x) => x.classList.toggle('sel', x === b));
      it.classList.remove('errado'); it.querySelector('.cls-why').textContent = ''; checar();
    }));
  });
  bc.addEventListener('click', () => {
    let erros = 0;
    corpo.querySelectorAll('.cls-item').forEach((it) => {
      const n = Number(it.dataset.n), item = q.itens[n];
      if (trava[n]) return;
      if (escolha[n] === item.cat) { trava[n] = true; it.classList.add('certo'); it.querySelectorAll('button').forEach((x) => { x.disabled = true; }); it.querySelector('.cls-why').textContent = '✔ ' + item.why; }
      else { erros++; it.classList.add('errado'); it.querySelector('.cls-why').textContent = 'Reveja esta.'; escolha[n] = null; it.querySelectorAll('.cls-btns button').forEach((x) => x.classList.remove('sel')); }
    });
    const fb = document.getElementById('fb');
    if (erros) { registrar(id, true); Musica.sfx('erro'); fb.innerHTML = `<div class="fb err"><b>${erros === 1 ? 'Falta acertar uma.' : `Faltam ${erros}.`}</b>As certas ficaram travadas. Reclassifique as marcadas e confira de novo.</div>`; checar(); }
    else { fb.innerHTML = `<div class="fb ok"><b>${estado.errou[id] ? 'Agora sim, tudo no lugar!' : 'Tudo certo de primeira!'}</b>Cada item está na categoria certa.</div>${blocoConceito(q.conceito)}`; concluir(id, () => fimPedido(i)); }
  });
}
function montarOrdenar(i, q, id) {
  if (!estado.ordem[id]) { let o; do { o = embaralhar(q.itens.map((_, n) => n)); } while (o.every((v, n) => v === n)); estado.ordem[id] = o; }
  let seq = [], trava = 0;
  const corpo = document.getElementById('corpo');
  const rod = document.getElementById('rodape');
  const pintar = () => {
    const pool = estado.ordem[id].filter((n) => !seq.includes(n));
    corpo.innerHTML = `<p class="ord-dica">Clique nos cartões na ordem em que devem acontecer. Clique num cartão da sequência para devolvê-lo.</p>
      <div class="ord-seq">${q.itens.map((_, pos) => { const n = seq[pos]; return n == null ? `<div class="ord-vaga">${pos + 1}</div>` : `<button class="ord-card na-seq ${pos < trava ? 'certo' : ''}" data-pos="${pos}" ${pos < trava ? 'disabled' : ''}><span class="ln">${pos + 1}</span>${esc(q.itens[n])}</button>`; }).join('')}</div>
      <div class="ord-pool">${pool.map((n) => `<button class="ord-card" data-n="${n}">${esc(q.itens[n])}</button>`).join('')}</div>`;
    corpo.querySelectorAll('.ord-pool .ord-card').forEach((b) => b.addEventListener('click', () => { seq.push(Number(b.dataset.n)); pintar(); }));
    corpo.querySelectorAll('.ord-seq .ord-card:not([disabled])').forEach((b) => b.addEventListener('click', () => { seq = seq.slice(0, Number(b.dataset.pos)); pintar(); }));
    rod.innerHTML = `<button class="btn" id="conferir" ${seq.length === q.itens.length ? '' : 'disabled'}>Conferir</button>`;
    const bc = document.getElementById('conferir');
    bc.addEventListener('click', () => {
      let ok = 0; while (ok < seq.length && seq[ok] === ok) ok++;
      const fb = document.getElementById('fb');
      if (ok === q.itens.length) {
        trava = ok; pintar();
        fb.innerHTML = `<div class="fb ok"><b>${estado.errou[id] ? 'Agora sim, na ordem!' : 'Na ordem certa de primeira!'}</b>${q.why}</div>${blocoConceito(q.conceito)}`;
        concluir(id, () => fimPedido(i));
      } else {
        registrar(id, true); Musica.sfx('erro'); trava = ok; seq = seq.slice(0, ok); pintar();
        fb.innerHTML = `<div class="fb err"><b>${ok ? `Os ${ok} primeiros passos estão certos.` : 'O primeiro passo não é esse.'}</b>Os corretos ficaram travados. Continue a partir daí.</div>`;
      }
    });
  };
  pintar();
}

/* =====================================================================
   PROGRESSÃO
   ===================================================================== */
function checarUnidade(i) {
  const u = estado.u[i];
  if (u.completa || !u.bug || !u.pedido || !u.plots.every((p) => p.fase === 'colhido')) return;
  u.completa = true;
  Musica.sfx('capitulo');
  const U = UNIDADES[i];
  if (i + 1 < UNIDADES.length) {
    const c = CAMPOS[i + 1];
    for (let n = 0; n < 30; n++) addPart((c.ix + Math.random() * c.iw) * T, (c.iy + Math.random() * c.ih) * T, 'poof');
    const p = PREDIOS[U.predio];
    if (p) for (let n = 0; n < 24; n++) addPart((p.x + Math.random() * p.w) * T, (p.y + Math.random() * p.h) * T, 'poof');
    const novo = { galinheiro: 'um galinheiro, com galinhas e tudo', estufa: 'uma estufa de vidro', celeiro: 'um celeiro e um silo', moinho: 'um moinho de vento' }[U.predio];
    Musica.tocar(presetJogo());
    setTimeout(() => mostrarDialogo(LURDES.nome, LURDES.look, [`O talhão de ${U.nome.split(' ')[0].toLowerCase()} está completo, ${apelido()}! E olha só: a fazenda ganhou ${novo}.`, `O mato do próximo talhão foi limpo, e chegou carta nova na caixa de correio: ${UNIDADES[i + 1].carta.titulo}.`]), 300);
  } else {
    for (let n = 0; n < 60; n++) addPart(G.jog.x * T + (Math.random() - 0.5) * 160, G.jog.y * T - 40, 'confete');
    Musica.tocar('final');
    setTimeout(() => mostrarDialogo(LURDES.nome, LURDES.look, [`${apelido()}, você conseguiu! Os cinco talhões colhidos, do alicerce à grande colheita.`, 'Hoje tem Festival da Colheita! Quando quiser, veja o resultado no quadro de objetivos.'], () => { estado.tela = 'final'; render(); }), 400);
  }
  atualizarHUD();
}

/* =====================================================================
   RESULTADO
   ===================================================================== */
function telaFinal() {
  const ac = acertosPrimeira(), pct = Math.round((ac / TOTAL) * 100);
  app.innerHTML = `
    <div class="capa">
      <div class="madeira painel-final">
        <span class="d-rot">Festival da Colheita</span>
        <h2 class="titulo-painel">${esc(nomeFazenda())}</h2>
        <div class="final-top"><div id="retFinal"></div><div><div class="big-num">${ac}/${TOTAL}</div><p>atividades certas de primeira · ${pct}%</p><p class="final-ouro"><span class="moeda"></span>${estado.moedas} moedas</p></div></div>
        <div class="res-grid">${UNIDADES.map((U) => { const ids = [...U.plantio.map((_, k) => `${U.id}-p${k}`), ...U.rega.map((_, k) => `${U.id}-r${k}`), `${U.id}-bug`, `${U.id}-ped`]; const a = ids.filter((x) => estado.feitas[x] && !estado.errou[x]).length; return `<div class="res-item"><b>${U.emoji} ${U.nome}</b><small>${a} de ${ids.length} de primeira</small></div>`; }).join('')}</div>
        <p class="final-quem">Resultado de <b>${esc(estado.nome)}</b> (${esc(estado.matricula)}) pronto para envio.</p>
        <div class="acoes"><button class="btn" id="btnEnviar">Enviar resultado</button><button class="btn sec" id="voltarJogo">Voltar à fazenda</button></div>
        <p id="statusEnvio"></p>
      </div>
    </div>`;
  document.getElementById('retFinal').appendChild(retrato(estado.look, 4));
  document.getElementById('btnEnviar').addEventListener('click', () => enviarResultado(ac, pct));
  document.getElementById('voltarJogo').addEventListener('click', () => { estado.tela = 'jogo'; render(); });
}
function enviarResultado(ac, pct) {
  const st = document.getElementById('statusEnvio'), btn = document.getElementById('btnEnviar');
  btn.disabled = true; st.textContent = 'Enviando...';
  const dados = { nome: estado.nome, matricula: estado.matricula, disciplina: 'Coding: Linguagens e Técnicas', aula: 'todas (1 a 16)', atividade: 'Fazenda dos Paradigmas', acertos: ac, total: TOTAL, pontuacao: pct, timestamp: new Date().toISOString() };
  if (!WEBAPP_URL) { st.textContent = 'Resultado registrado só nesta tela.'; return; }
  fetch(WEBAPP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(dados) })
    .then(() => { st.innerHTML = '<span class="selo">✔ Resultado enviado.</span>'; btn.style.display = 'none'; })
    .catch(() => { st.textContent = 'Não foi possível enviar agora. Tente de novo ou mostre esta tela ao professor.'; btn.disabled = false; });
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 3000);
}
['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, () => Musica.iniciar(), { once: true }));
render();

</script>
</body>
</html>
