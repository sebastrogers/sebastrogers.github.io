<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fazenda dos Paradigmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --sky1:#8FD3E8; --sky2:#CDEFC4; --soil:#6B4A32; --soil-d:#573A27; --grass:#5FA83D; --grass-d:#4C8A30;
  --wood:#8A5A34; --panel:#FBF6E9; --panel-2:#F3EAD1; --ink:#2C2013; --ink-2:#5B4A34; --line:#D8C79E;
  --sun:#FFB547; --good:#3E9B5E; --bad:#D2483C; --signal:#2E86AB; --shadow:0 3px 0 rgba(0,0,0,.18);
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,#EFE6C6);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background 1.2s ease;position:relative}
body.per-manha{background:linear-gradient(180deg,#8FD3E8,#CDEFC4 55%,#EFE6C6)}
body.per-tarde{background:linear-gradient(180deg,#F7B267,#F4845F 45%,#E8C39E)}
body.per-noite{background:linear-gradient(180deg,#0F1A33,#25315A 55%,#1B2436)}
body.per-noite .kicker{color:#8ECAE6}
body.per-noite h2.big{color:#F3EFE4}
body.per-noite .narr{color:#C7C2D6}
body.per-noite .narr b{color:#F3EFE4}
body.per-noite #farmhud{color:#C7C2D6}
body.per-noite #farmhud .day{color:#F3EFE4}
body.per-noite #farmwrap .hint{color:#C7C2D6}
body.per-noite::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 28% 8%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 44% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 62% 12%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 78% 28%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 15%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 8% 35%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 5%,#fff,transparent)}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;margin:0;line-height:1.1;font-weight:800}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
input[type=text]{font-family:inherit;font-size:1rem;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:9px;padding:11px 14px;width:100%}
input[type=text]:focus{outline:none;border-color:var(--signal)}

#top{position:sticky;top:0;z-index:60;background:rgba(251,246,233,.95);backdrop-filter:blur(6px);border-bottom:2px solid var(--line);padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#top .brand{display:flex;align-items:center;gap:10px;font-size:1.02rem;letter-spacing:-.01em}
#top .brand small{display:block;font-family:"JetBrains Mono",monospace;font-size:.56rem;letter-spacing:.14em;color:var(--ink-2);font-weight:400;text-transform:uppercase;margin-top:1px}
#hud{flex:1 1 auto;display:flex;align-items:center;gap:16px;justify-content:flex-end;font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--ink-2)}
#hud b{color:var(--ink)}
.periodo-badge{font-size:1.25rem;line-height:1}
.mute-btn{font-size:1.05rem;padding:6px 11px;border-radius:9px;border:2px solid var(--line);background:var(--panel-2)}
.mute-btn:hover{border-color:var(--signal)}

#app{max-width:980px;margin:0 auto;padding:26px 18px 60px;position:relative;z-index:1}
.kicker{font-family:"JetBrains Mono",monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--signal);margin-bottom:10px;display:flex;align-items:center;gap:7px}
h2.big{font-size:clamp(1.4rem,4vw,2.1rem)}
.narr{color:var(--ink-2);max-width:62ch;margin-top:12px}
.narr b{color:var(--ink)}

.cta{display:inline-flex;align-items:center;gap:9px;background:var(--sun);color:#3A2500;font-weight:700;padding:12px 22px;border-radius:99px;font-size:1rem;box-shadow:var(--shadow);transition:transform .12s}
.cta:hover{transform:translateY(-2px)}
.cta:disabled{background:#E3DCC4;color:#9A9075;box-shadow:none;transform:none;cursor:not-allowed}
.ghost{border:2px solid var(--line);color:var(--ink-2);padding:10px 18px;border-radius:99px;font-weight:600}
.ghost:hover{border-color:var(--signal);color:var(--signal)}
.ghost.small{padding:6px 13px;font-size:.78rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}

.panel{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-top:18px}
.panel.tight{padding:14px 18px}

.checklist{display:grid;gap:10px;margin-top:16px}
.checklist .it{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start;font-size:.94rem;color:var(--ink-2)}
.checklist .it b{color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:.82rem}

.crops-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.cl-item{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.cl-item .e{font-size:1.5rem}
.cl-item .t{font-size:.86rem}
.cl-item .t b{display:block;font-size:.92rem}
.cl-item .t small{color:var(--ink-2)}

/* --- prólogo / história --- */
.historia-panel{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel-2));overflow:hidden}
.historia-panel::before{content:'🌾';position:absolute;top:-10px;right:-6px;font-size:5.5rem;opacity:.12;transform:rotate(12deg)}
.historia-texto{font-size:1.02rem;line-height:1.7}
.historia-pips{display:flex;gap:6px;margin-top:20px}

/* --- mapa geral da fazenda (hub) --- */
.lotes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:18px}
.lote-card{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .12s}
.lote-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.lote-card.locked{opacity:.55;cursor:not-allowed;filter:grayscale(65%)}
.lote-card.done{border-color:var(--good);background:rgba(62,155,94,.1)}
.lote-emoji{font-size:2.5rem}
.lote-nome{font-weight:700;margin-top:8px;font-size:.92rem}
.lote-unidade{color:var(--ink-2);font-size:.72rem;margin-top:2px}
.lote-pips{display:flex;gap:5px;justify-content:center;margin-top:12px}
.pip{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pip.on{background:var(--sun)}

/* --- fazenda / cena --- */
#farmwrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:16px}
#farmhud{width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--ink-2)}
#farmhud .day{color:var(--ink);font-weight:600}
#progress-crops{display:flex;gap:6px}
#progress-crops span{width:26px;height:26px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1rem;opacity:.45}
#progress-crops span.on{opacity:1;background:#FFF2CE;border-color:var(--sun)}

#grid{--tile:min(80px,9.2vw);display:grid;grid-template-columns:repeat(var(--cols,9),var(--tile));grid-template-rows:repeat(var(--rows,6),var(--tile));position:relative;border-radius:10px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15),0 10px 28px -14px rgba(0,0,0,.5);border:3px solid #3D6B26}
.tile{width:var(--tile);height:var(--tile);display:flex;align-items:center;justify-content:center;font-size:calc(var(--tile) * 0.5);position:relative}
.tile.grass{background:var(--grass)}
.tile.grass.alt{background:var(--grass-d)}
.tile.tree{background:var(--grass-d)}
.tile.plot{background:var(--soil)}
.tile.plot.alt{background:var(--soil-d)}
.tile.plot .stage{font-size:calc(var(--tile) * 0.56);filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.tile.plot.pronto .stage{animation:bob 1.1s ease-in-out infinite}
.tile.plot.done{outline:3px solid var(--sun);outline-offset:-3px}
.tile.plot.locked{filter:grayscale(70%) brightness(.72)}
.tile.plot.locked .stage{font-size:calc(var(--tile) * 0.42);filter:none;opacity:.85}
.tile .badge{position:absolute;top:1px;right:1px;font-size:calc(var(--tile) * 0.24)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%)}}
.tile.plot .stage.pulse{animation:pulso .45s ease-out}
@keyframes pulso{0%{transform:scale(.4) rotate(-8deg)}60%{transform:scale(1.25) rotate(4deg)}100%{transform:scale(1) rotate(0)}}

#player{position:absolute;width:var(--tile);height:var(--tile);transition:left .13s linear,top .13s linear;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));pointer-events:none;z-index:5}
.flip{position:absolute;inset:0}
#player.facing-left .flip{transform:scaleX(-1)}
.charbox{position:absolute;inset:0;animation:respira 1.6s ease-in-out infinite;transform-origin:50% 85%}
#player.walking .charbox{animation:none}
@keyframes respira{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4%) scale(1.03)}}

/* --- boneco por partes: pernas, tronco, braços, cabeça e cabelo --- */
.perna{position:absolute;width:15%;height:30%;top:58%;background:var(--skin,#E8AD7B);border-radius:4px;transform-origin:50% 0%}
.perna.esq{left:30%}
.perna.dir{left:55%}
.c-torso{position:absolute;width:46%;height:30%;top:32%;left:27%;background:var(--shirt,#2E86AB);border-radius:7px 7px 3px 3px}
.braco{position:absolute;width:12%;height:26%;top:34%;background:var(--skin,#E8AD7B);border-radius:4px;transform-origin:50% 0%}
.braco.esq{left:14%}
.braco.dir{left:74%}
.c-cabeca{position:absolute;width:40%;height:40%;top:2%;left:30%;background:var(--skin,#E8AD7B);border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.c-cabelo{position:absolute;left:-6%;right:-6%;top:-8%;height:52%;background:var(--hair,#2C1B0E);border-radius:50% 50% 20% 20%}
.c-cabelo.estilo-careca{display:none}
.c-cabelo.estilo-moicano{left:38%;right:38%;top:-14%;height:62%;border-radius:40% 40% 0 0}
.c-cabelo.estilo-longo{height:92%;border-radius:50% 50% 35% 35%}
.c-cabelo.estilo-cacheado{border-radius:50%}
.c-cabelo.estilo-cacheado::before,.c-cabelo.estilo-cacheado::after{content:'';position:absolute;top:14%;width:34%;height:60%;background:var(--hair,#2C1B0E);border-radius:50%}
.c-cabelo.estilo-cacheado::before{left:-16%}
.c-cabelo.estilo-cacheado::after{right:-16%}

@keyframes balA{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
@keyframes balB{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}}
#player.walking .perna.esq{animation:balA .45s ease-in-out infinite}
#player.walking .perna.dir{animation:balB .45s ease-in-out infinite}
#player.walking .braco.esq{animation:balB .45s ease-in-out infinite}
#player.walking .braco.dir{animation:balA .45s ease-in-out infinite}

/* --- tela de criação de personagem --- */
#charPreviewWrap{width:150px;height:150px;flex-shrink:0;background:linear-gradient(180deg,var(--sky1),var(--sky2));border:2px solid var(--line);border-radius:12px;position:relative;overflow:hidden}
#charPreview{position:absolute;inset:0}
.lbl{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:block;margin-top:14px}
.lbl:first-child{margin-top:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.sel{border-color:var(--signal);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--signal)}
.sw-txt{padding:7px 13px;border-radius:8px;border:2px solid var(--line);background:#fff;font-size:.8rem;color:var(--ink-2)}
.sw-txt.sel{border-color:var(--signal);color:var(--signal);font-weight:700;background:rgba(46,134,171,.08)}

.poeira{position:absolute;width:calc(var(--tile) * .5);height:calc(var(--tile) * .22);border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;z-index:4;animation:poeira-fade .4s ease-out forwards}
@keyframes poeira-fade{0%{opacity:.55;transform:scale(.6) translateY(0)}100%{opacity:0;transform:scale(1.3) translateY(8%)}}

.particula{position:absolute;font-size:calc(var(--tile) * .42);pointer-events:none;z-index:6;animation:particula-sobe .9s ease-out forwards}
@keyframes particula-sobe{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-10%) scale(1.1)}100%{opacity:0;transform:translateY(-140%) scale(1)}}

#controls{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
.dpad button{background:var(--panel);border:2px solid var(--line);border-radius:9px;font-size:1.2rem;box-shadow:var(--shadow);color:var(--ink-2)}
.dpad button:active{transform:translateY(2px);box-shadow:none}
.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:3}.dpad .right{grid-column:3;grid-row:2}
#interagir{background:var(--sun);color:#3A2500;font-weight:700;padding:14px 24px;border-radius:99px;box-shadow:var(--shadow);font-size:1rem}
#interagir:active{transform:translateY(2px)}
.hint{font-size:.85rem;color:var(--ink-2);margin-top:2px;text-align:center}

/* --- modal (contexto + pergunta) --- */
#overlay{position:fixed;inset:0;background:rgba(20,15,5,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:80}
#overlay.show{display:flex}
#qmodal{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);max-width:560px;width:100%;padding:22px;box-shadow:0 20px 60px -20px rgba(0,0,0,.6);max-height:88vh;overflow:auto}
#qmodal .tag{font-family:"JetBrains Mono",monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--signal);margin-bottom:8px;display:flex;align-items:center;gap:8px}
#qmodal .tag .e{font-size:1.3rem}
#qmodal p.q{font-weight:700;font-size:1.05rem}
#qmodal p.ctx{font-size:.96rem;color:var(--ink-2);margin-top:6px}
#qmodal .aviso{margin-top:14px;border-left:3px solid var(--signal);background:var(--panel-2);padding:11px 14px;border-radius:0 9px 9px 0;font-size:.88rem;color:var(--ink-2)}
#qmodal .aviso b{color:var(--signal);display:block;font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:grid;grid-template-columns:24px 1fr;gap:10px;text-align:left;align-items:start;background:#fff;border:2px solid var(--line);border-radius:9px;padding:11px 14px;font-size:.94rem}
.opt:hover:not(:disabled){border-color:var(--signal)}
.opt .l{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--ink-2)}
.opt.right{border-color:var(--good);background:rgba(62,155,94,.1)}
.opt.right .l{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(210,72,60,.08)}
.opt.wrong .l{color:var(--bad)}
.opt:disabled{cursor:default}
.shake{animation:shk .36s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.fb{margin-top:14px;border-radius:9px;padding:13px 16px;font-size:.92rem;border:2px solid;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(62,155,94,.1);border-color:var(--good);color:#1F5C36}
.fb.err{background:rgba(210,72,60,.08);border-color:var(--bad);color:#7A241C}
.fb b{display:block;font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
#qmodal .actions{margin-top:16px;justify-content:flex-end}

/* --- fatura --- */
.counter{font-family:"JetBrains Mono",monospace;font-size:clamp(2.2rem,8vw,3.4rem);font-weight:600;color:var(--good);letter-spacing:-.02em;line-height:1}
.colheita-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.ch{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.ch .e{font-size:1.7rem}
.ch .t b{display:block;font-size:.92rem}
.ch .t small{color:var(--ink-2);font-size:.78rem}
.seal{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--good);background:rgba(62,155,94,.1);border-radius:99px;padding:10px 20px;margin-top:20px;font-weight:700;color:#1F5C36}

@media (max-width:520px){#grid{--tile:min(46px,10.5vw)}.dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>
<header id="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="24" cy="9" r="6" fill="#FFB547"/>
      <path d="M2 30 C2 22 8 16 17 16 C26 16 32 22 32 30 Z" fill="#6B4A32"/>
      <path d="M2 30 C2 26 8 23 17 23 C26 23 32 26 32 30 Z" fill="#573A27"/>
      <path d="M17 22 C17 15 13 12 10 10" stroke="#3E9B5E" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M17 22 C17 14 21 12 23 9" stroke="#5FA83D" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="17" cy="22" r="3.4" fill="#5FA83D"/>
    </svg>
    <span>Fazenda dos Paradigmas<small>Coding: Linguagens e Técnicas</small></span>
  </div>
  <div id="hud"></div>
  <span class="periodo-badge" id="periodoBadge"></span>
  <button class="mute-btn" id="btnMute" title="Música de fundo">🔊</button>
</header>
<main id="app"></main>

<div id="overlay"><div id="qmodal"></div></div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzyVDcweu9eO6c8CztBCIj8y6hj1MXWVpWr0aFmXn_jrE3AYJC-BG7gc3OnsYiz6gbY/exec';
const LETRAS = 'ABCD';

function embaralhar(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// distribui as etapas de um talhão em 2 a 3 "pontos de plantio" (níveis) dentro da cena
function distribuirEmSpots(etapas) {
  const n = etapas.length;
  const numSpots = n <= 3 ? n : 3;
  const buckets = Array.from({ length: numSpots }, () => []);
  etapas.forEach((e, i) => buckets[i % numSpots].push(e));
  let offset = 0;
  return buckets.map((arr) => { const info = { etapas: arr, offset }; offset += arr.length; return info; });
}

// ---------------------------------------------------------------- conteúdo: 5 talhões, um por unidade da disciplina
const CULTURAS = [
  {
    id: 'fundamentos', nome: 'Batata dos Fundamentos', unidade: 'Unidade 1 · Linguagens e fundamentos', emoji: '🥔', brotoEmoji: '🌱', creEmoji: '🌿',
    lore: { titulo: 'Capítulo 1 — O alicerce', texto: 'Esse é o primeiro talhão, o mais simples de todos. Antes de erguer qualquer sistema, é aqui que se decide a linguagem, o paradigma e as ferramentas de base.' },
    etapas: [
      { tema: 'Escolher a linguagem certa para o projeto',
        contexto: 'Sua equipe está decidindo, do zero, qual linguagem de programação vai usar num projeto novo — e cada integrante sugere uma diferente.',
        pergunta: { texto: 'Qual é o critério mais importante para escolher uma linguagem de programação para um projeto?',

// ---------------------------------------------------------------- música de fundo procedural (sem arquivos externos)
// Obs.: não usa a trilha real de nenhum jogo (é conteúdo protegido por direitos autorais) — é uma
// composição própria, gerada por código, só inspirada no clima aconchegante/folk desse tipo de jogo:
// escalas pentatônicas, dedilhado curto tipo ukulele, um baixo suave e um eco leve por cima.
const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let masterChain = null;
function getAudioCtx() {
  if (!AudioCtxClass) return null;
  if (!audioCtx) {
    try {
      audioCtx = new AudioCtxClass();
      const gain = audioCtx.createGain(); gain.gain.value = 1;
      const filtro = audioCtx.createBiquadFilter(); filtro.type = 'lowpass'; filtro.frequency.value = 3400;
      const delay = audioCtx.createDelay(1.2); delay.delayTime.value = 0.34;
      const feedback = audioCtx.createGain(); feedback.gain.value = 0.24;
      const wet = audioCtx.createGain(); wet.gain.value = 0.18;
      gain.connect(filtro);
      filtro.connect(audioCtx.destination);
      filtro.connect(delay);
      delay.connect(feedback); feedback.connect(delay);
      delay.connect(wet); wet.connect(audioCtx.destination);
      masterChain = { gain, wet };
    } catch (e) { return null; }
  }
  return audioCtx;
}

function tocarNota(ctx, freq, tempoInicio, duracao, timbre, volume, ataque) {
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = timbre;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, tempoInicio);
  osc.connect(g);
  g.connect(masterChain.gain);
  g.gain.linearRampToValueAtTime(volume, tempoInicio + (ataque || 0.015));
  g.gain.exponentialRampToValueAtTime(0.0001, tempoInicio + duracao);
  osc.start(tempoInicio);
  osc.stop(tempoInicio + duracao + 0.05);
}

// um pequeno desenho melódico (graus da escala pentatônica) reaproveitado por todas as cenas —
// só a escala, o timbre e o andamento mudam de uma para outra
const FRASE = [0, 2, 4, 2, 3, 2, 4, 1, 0, 2, 3, 2, 4, 3, 1, 0];
function criarTrilha(escala, bpm, timbre, vol, reverbo) {
  return { escala, bpm, timbre, vol, reverbo };
}
const SCENE_MUSIC = [
  criarTrilha([261.63, 293.66, 329.63, 392.00, 440.00], 92, 'triangle', 0.055, 0.16), // fundamentos — dó maior, calmo
  criarTrilha([220.00, 246.94, 277.18, 329.63, 369.99], 88, 'triangle', 0.05, 0.2), // poo — lá, mais introspectivo
  criarTrilha([196.00, 220.00, 246.94, 293.66, 329.63], 82, 'square', 0.03, 0.1), // backend — sol, mais seco/mecânico
  criarTrilha([349.23, 392.00, 440.00, 523.25, 587.33], 100, 'triangle', 0.055, 0.22), // frontend — fá, brilhante
  criarTrilha([293.66, 329.63, 392.00, 440.00, 523.25], 96, 'triangle', 0.06, 0.24), // fullstack — ré, grandioso
];
const MUSICA_MENU = criarTrilha([261.63, 329.63, 392.00, 440.00, 493.88], 84, 'sine', 0.04, 0.15);

let musicaAtual = null;
function pararMusica() { if (musicaAtual) { musicaAtual.stop(); musicaAtual = null; } }
function tocarMusica(preset) {
  pararMusica();
  const ctx = getAudioCtx();
  if (!ctx || !preset || estado.audio.muted) return;
  masterChain.wet.gain.value = preset.reverbo;
  const duracaoPasso = 60 / preset.bpm / 2;
  let passo = 0;
  let ativo = true;
  function tocarPasso() {
    if (!ativo) return;
    const agora = ctx.currentTime + 0.02;
    const grau = FRASE[passo % FRASE.length];
    const freq = preset.escala[grau % preset.escala.length];
    tocarNota(ctx, freq, agora, duracaoPasso * 1.3, preset.timbre, preset.vol, 0.01);
    if (passo % 4 === 0) {
      tocarNota(ctx, preset.escala[0] / 2, agora, duracaoPasso * 3.6, 'sine', preset.vol * 0.65, 0.05);
    }
    passo++;
  }
  tocarPasso();
  const id = setInterval(tocarPasso, duracaoPasso * 1000);
  musicaAtual = { stop() { ativo = false; clearInterval(id); } };
}
function atualizarMusicaPorTela() {
  if (estado.tela === 'cena') tocarMusica(SCENE_MUSIC[estado.loteAtual]);
  else if (['mapa', 'briefing', 'fatura'].includes(estado.tela)) tocarMusica(MUSICA_MENU);
  else pararMusica();
}

// ---------------------------------------------------------------- dia/tarde/noite (horário real do jogador)
function periodoDoDia() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'manha';
  if (h >= 12 && h < 18) return 'tarde';
  return 'noite';
}
function aplicarPeriodo() {
  const per = periodoDoDia();
  document.body.classList.remove('per-manha', 'per-tarde', 'per-noite');
  document.body.classList.add('per-' + per);
  const badge = document.getElementById('periodoBadge');
  if (badge) badge.textContent = per === 'manha' ? '☀️' : per === 'tarde' ? '🌇' : '🌙';
}

function totalEtapas() { return CULTURAS.reduce((s, c) => s + c.etapas.length, 0); }

// ---------------------------------------------------------------- estado
const estado = {
  tela: 'id', nome: '', matricula: '',
  personagem: { apelido: '', pele: PELES[0], cabeloCor: CORES_CABELO[0], cabeloEstilo: 'curto', roupa: CORES_ROUPA[0] },
  audio: { muted: false },
  loteAtual: 0,
  jogador: { x: 2, y: 2, facing: 'right' },
  dia: 1,
  culturas: CULTURAS.map((c) => {
    const etapas = c.etapas.map((e) => ({ ...e, pergunta: { ...e.pergunta, opcoesEmbaralhadas: null, acertouDePrimeira: null, tentativas: 0 } }));
    return { ...c, progresso: 0, etapas, spots: distribuirEmSpots(etapas), vistoIntro: false };
  }),
  perguntaAtual: null,
  _sceneGrid: null, _sceneCols: 0, _sceneRows: 0,
};

function culturaPronta(c) { return c.progresso >= c.etapas.length; }
function culturaDesbloqueada(cultura) {
  const idx = estado.culturas.indexOf(cultura);
  return idx <= 0 || estado.culturas.slice(0, idx).every(culturaPronta);
}

function atualizarHud() {
  const colhidas = estado.culturas.filter(culturaPronta).length;
  hud.innerHTML = estado.nome ? `<span>🌾 <b>${colhidas}/${estado.culturas.length}</b></span>` : '';
}

function telaMapa() {
  const colhidas = estado.culturas.filter(culturaPronta).length;
  app.innerHTML = `
    <div class="kicker">Sua fazenda</div>
    <h2 class="big">Escolha um talhão, ${estado.personagem.apelido || estado.nome.split(' ')[0]}</h2>

    <div class="lotes-grid" id="lotesGrid">
      ${estado.culturas.map((c, i) => renderLoteCard(c, i)).join('')}
    </div>
    <div class="panel tight" style="margin-top:20px;text-align:center">
      <p class="hint">🏆 ${colhidas} de ${estado.culturas.length} talhões colhidos</p>
    </div>`;
  document.querySelectorAll('.lote-card').forEach((card) => {
    card.addEventListener('click', () => {
      const i = Number(card.dataset.i);
      const cultura = estado.culturas[i];
      if (!culturaDesbloqueada(cultura)) { mostrarBloqueadoMapa(cultura); return; }
      estado.loteAtual = i;
      estado.tela = 'cena';
      render();

function renderLoteCard(c, i) {
  const pronto = culturaPronta(c);
  const desbloqueada = culturaDesbloqueada(c);
  let cls = 'lote-card';
  if (!desbloqueada) cls += ' locked';
  else if (pronto) cls += ' done';
  const pips = c.spots.map((s) => `<span class="pip ${c.progresso >= s.offset + s.etapas.length ? 'on' : ''}"></span>`).join('');
  return `<div class="${cls}" data-i="${i}">
    <div class="lote-emoji">${!desbloqueada ? '🔒' : c.emoji}</div>
    <div class="lote-nome">${c.nome}</div>
    <div class="lote-unidade">${c.unidade}</div>
    <div class="lote-pips">${pips}</div>
  </div>`;
}

function mostrarBloqueadoMapa(cultura) {
  const anterior = estado.culturas.find((c) => !culturaPronta(c));
  const modal = document.getElementById('qmodal');
  modal.innerHTML = `

    <p class="q">Esse talhão ainda não está liberado.</p>
    <p class="ctx">Os talhões abrem em ordem, do mais básico ao mais avançado. Termine primeiro ${anterior ? `${anterior.emoji} ${anterior.nome}` : 'os talhões anteriores'} para destravar este.</p>
    <div class="actions"><button class="cta" id="btnFecharBloqueio">Entendi</button></div>`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('btnFecharBloqueio').addEventListener('click', () => document.getElementById('overlay').classList.remove('show'));
}

// ---------------------------------------------------------------- tela: cena (a fazenda individual de um talhão)
let loopId = null;
const held = new Set();

function telaCena() {
  const cultura = estado.culturas[estado.loteAtual];
  const scene = SCENES[estado.loteAtual];
  estado._sceneGrid = scene.grid;
  estado._sceneCols = scene.grid[0].length;
  estado._sceneRows = scene.grid.length;
  estado.jogador = { x: scene.start.x, y: scene.start.y, facing: 'right' };

  let cells = '';
  scene.grid.forEach((row, y) => {
    row.forEach((code, x) => {
      const alt = (x + y) % 2 === 0 ? '' : ' alt';
      let cls, inner = '';
      if ('123'.includes(code)) {
        cls = 'tile plot' + alt;
        const spot = cultura.spots[Number(code) - 1];
        if (spot) {
          const pronto = cultura.progresso >= spot.offset + spot.etapas.length;
          const desbloqueado = cultura.progresso >= spot.offset;
          cls += pronto ? ' done' : desbloqueado ? ' pronto' : ' locked';
          inner = `<span class="stage">${pronto ? '✅' : desbloqueado ? (cultura.progresso > spot.offset ? '🌿' : '🌱') : '🔒'}</span>`;
        }
      } else if (code === 'T') {
        cls = 'tile tree' + alt;
      } else {
        cls = 'tile grass' + alt;
        if (scene.decor[code]) inner = scene.decor[code];
      }
      cells += `<div class="${cls}" data-x="${x}" data-y="${y}" data-spot="${'123'.includes(code) ? code : ''}">${inner}</div>`;
    });
  });

  app.innerHTML = `
    <div id="farmwrap">
      <div id="farmhud">
        <button class="ghost small" id="btnVoltarMapa">← Fazenda</button>
        <span class="day">${cultura.emoji} ${cultura.nome}</span>
        <div id="progress-crops">${cultura.spots.map((s, si) => `<span class="${cultura.progresso >= s.offset + s.etapas.length ? 'on' : ''}">${si + 1}</span>`).join('')}</div>
      </div>
      <div id="grid" style="--cols:${estado._sceneCols};--rows:${estado._sceneRows};--grass:${scene.palette.grass};--grass-d:${scene.palette.grassD};--soil:${scene.palette.soil};--soil-d:${scene.palette.soilD}">${cells}<div id="player">${personagemHTML(estado.personagem)}</div></div>
      <div id="controls">
        <div class="dpad">
          <button class="up" data-dir="up" aria-label="Cima">▲</button>
          <button class="left" data-dir="left" aria-label="Esquerda">◀</button>
          <button class="down" data-dir="down" aria-label="Baixo">▼</button>
          <button class="right" data-dir="right" aria-label="Direita">▶</button>
        </div>
        <button id="interagir">Interagir (E)</button>
      </div>
      <p class="hint">Ande até um ponto de plantio e aperte Interagir.</p>
    </div>`;

  posicionarJogador();
  document.getElementById('interagir').addEventListener('click', interagir);
  document.getElementById('btnVoltarMapa').addEventListener('click', () => { estado.tela = 'mapa'; render(); });
  document.querySelectorAll('.dpad button').forEach((b) => {
    const dir = b.dataset.dir;
    b.addEventListener('mousedown', () => held.add(dir));
    b.addEventListener('touchstart', (e) => { e.preventDefault(); held.add(dir); }, { passive: false });
    ['mouseup', 'mouseleave', 'touchend'].forEach((ev) => b.addEventListener(ev, () => held.delete(dir)));
  });

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  if (!loopId) loopId = setInterval(tick, 150);

  if (!cultura.vistoIntro && cultura.lore) mostrarCapitulo(cultura);
}

function mostrarCapitulo(cultura) {
  estado.perguntaAtual = 'capitulo';
  const modal = document.getElementById('qmodal');
  modal.innerHTML = `
    <div class="tag"><span class="e">${cultura.emoji}</span> ${cultura.lore.titulo}</div>
    <p class="ctx">${cultura.lore.texto}</p>
    <div class="actions"><button class="cta" id="btnComecarCapitulo">Começar →</button></div>`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('btnComecarCapitulo').addEventListener('click', () => {
    cultura.vistoIntro = true;
    estado.perguntaAtual = null;
    document.getElementById('overlay').classList.remove('show');
  });
}

function onKeyDown(e) {
  const k = e.key.toLowerCase();
  if (['arrowup', 'w'].includes(k)) held.add('up');
  if (['arrowdown', 's'].includes(k)) held.add('down');
  if (['arrowleft', 'a'].includes(k)) held.add('left');
  if (['arrowright', 'd'].includes(k)) held.add('right');
  if (['e', 'enter', ' '].includes(k)) { e.preventDefault(); interagir(); }
}
function onKeyUp(e) {
  const k = e.key.toLowerCase();
  if (['arrowup', 'w'].includes(k)) held.delete('up');
  if (['arrowdown', 's'].includes(k)) held.delete('down');
  if (['arrowleft', 'a'].includes(k)) held.delete('left');
  if (['arrowright', 'd'].includes(k)) held.delete('right');
}

function tick() {
  const el = document.getElementById('player');
  if (estado.tela !== 'cena' || estado.perguntaAtual) { if (el) el.classList.remove('walking'); return; }
  let { x, y } = estado.jogador;
  let moveu = false;
  if (held.has('left')) { x--; estado.jogador.facing = 'left'; moveu = true; }
  else if (held.has('right')) { x++; estado.jogador.facing = 'right'; moveu = true; }
  else if (held.has('up')) { y--; moveu = true; }
  else if (held.has('down')) { y++; moveu = true; }
  if (!moveu) { if (el) el.classList.remove('walking'); return; }
  if (y < 0 || y >= estado._sceneRows || x < 0 || x >= estado._sceneCols || estado._sceneGrid[y][x] === 'T') {
    if (el) el.classList.remove('walking');
    return;
  }
  const antes = { ...estado.jogador };
  estado.jogador.x = x; estado.jogador.y = y;
  posicionarJogador();
  if (el) el.classList.add('walking');
  poeiraNaPosicao(antes.x, antes.y);
}

function posicionarJogador() {
  const el = document.getElementById('player');
  if (!el) return;
  const grid = document.getElementById('grid');
  const tile = grid.getBoundingClientRect().width / estado._sceneCols;
  el.style.left = (estado.jogador.x * tile) + 'px';
  el.style.top = (estado.jogador.y * tile) + 'px';
  el.classList.toggle('facing-left', estado.jogador.facing === 'left');
}

function poeiraNaPosicao(x, y) {
  const grid = document.getElementById('grid');
  if (!grid) return;
  const tile = grid.getBoundingClientRect().width / estado._sceneCols;
  const d = document.createElement('div');
  d.className = 'poeira';
  d.style.left = (x * tile + tile * 0.25) + 'px';
  d.style.top = (y * tile + tile * 0.68) + 'px';
  grid.appendChild(d);
  setTimeout(() => d.remove(), 420);
}

function particulaNoJogador(emoji) {
  const grid = document.getElementById('grid');
  const player = document.getElementById('player');
  if (!grid || !player) return;
  const p = document.createElement('div');
  p.className = 'particula';
  p.textContent = emoji;
  p.style.left = player.style.left;
  p.style.top = player.style.top;
  grid.appendChild(p);
  setTimeout(() => p.remove(), 950);
}
window.addEventListener('resize', () => { if (estado.tela === 'cena') posicionarJogador(); });

function interagir() {
  if (estado.tela !== 'cena' || estado.perguntaAtual) return;
  const { x, y } = estado.jogador;
  const code = estado._sceneGrid[y] && estado._sceneGrid[y][x];
  if (!code || !'123'.includes(code)) return;
  const cultura = estado.culturas[estado.loteAtual];
  const spot = cultura.spots[Number(code) - 1];
  if (!spot) return;
  if (cultura.progresso >= spot.offset + spot.etapas.length) return;
  if (cultura.progresso < spot.offset) { mostrarSpotBloqueado(); return; }
  const etapa = spot.etapas[cultura.progresso - spot.offset];
  abrirContexto(cultura, etapa, code);
}

function mostrarSpotBloqueado() {
  estado.perguntaAtual = 'bloqueio';
  const modal = document.getElementById('qmodal');
  modal.innerHTML = `
    <div class="tag">🔒 Ainda não</div>
    <p class="q">Esse ponto do talhão ainda não abriu.</p>
    <p class="ctx">Termine a etapa anterior deste talhão antes de seguir para a próxima.</p>
    <div class="actions"><button class="cta" id="btnFecharBloqueio">Entendi</button></div>`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('btnFecharBloqueio').addEventListener('click', () => {
    estado.perguntaAtual = null;
    document.getElementById('overlay').classList.remove('show');
  });
}

function verificarFimDoTalhao(cultura) {
  if (!culturaPronta(cultura)) return;
  const todas = estado.culturas.every(culturaPronta);
  setTimeout(() => { estado.tela = todas ? 'fatura' : 'mapa'; render(); }, 900);
}

function renderSpotTile(cultura, spotCode) {
  const spot = cultura.spots[Number(spotCode) - 1];
  const tileEl = document.querySelector(`.tile[data-spot="${spotCode}"]`);
  if (!tileEl || !spot) return;
  const pronto = cultura.progresso >= spot.offset + spot.etapas.length;
  const desbloqueado = cultura.progresso >= spot.offset;
  tileEl.classList.remove('pronto', 'done', 'locked');
  tileEl.classList.add(pronto ? 'done' : desbloqueado ? 'pronto' : 'locked');
  const stageEl = tileEl.querySelector('.stage');
  if (stageEl) {
    stageEl.textContent = pronto ? '✅' : desbloqueado ? (cultura.progresso > spot.offset ? '🌿' : '🌱') : '🔒';
    stageEl.classList.remove('pulse');
    void stageEl.offsetWidth;
    stageEl.classList.add('pulse');
  }
}

// ---------------------------------------------------------------- modal: contexto (aviso) antes da pergunta
function abrirContexto(cultura, etapa, spotCode) {
  estado.perguntaAtual = { cultura, etapa, spotCode };
  const ultima = cultura.progresso === cultura.etapas.length - 1;
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('qmodal');
  modal.innerHTML = `
    <div class="tag"><span class="e">${cultura.emoji}</span> ${cultura.nome} · Fase ${cultura.progresso + 1} de ${cultura.etapas.length}</div>
    <p class="q">${etapa.tema}</p>
    <p class="ctx">${etapa.contexto}</p>
    <div class="aviso"><b>O que vem a seguir</b>Um desafio rápido sobre essa situação${ultima ? ' — respondendo certo, o talhão está pronto para colher.' : ' antes de seguir para a próxima etapa.'}</div>
    <div class="actions">
      <button class="cta" id="btnVerDesafio">Ver desafio →</button>
    </div>`;
  overlay.classList.add('show');
  document.getElementById('btnVerDesafio').addEventListener('click', () => abrirPergunta(cultura, etapa));
}

// ---------------------------------------------------------------- modal: pergunta
function abrirPergunta(cultura, etapa) {
  const pergunta = etapa.pergunta;
  const ultima = cultura.progresso === cultura.etapas.length - 1;
  if (!pergunta.opcoesEmbaralhadas) pergunta.opcoesEmbaralhadas = embaralhar(pergunta.opcoes);
  const modal = document.getElementById('qmodal');
  modal.innerHTML = `
    <div class="tag"><span class="e">${cultura.emoji}</span> ${cultura.nome} · Fase ${cultura.progresso + 1} de ${cultura.etapas.length}</div>
    <p class="q">${pergunta.texto}</p>
    <div class="opts">
      ${pergunta.opcoesEmbaralhadas.map((o, i) => `<button class="opt" data-i="${i}"><span class="l">${LETRAS[i]}</span><span>${o.t}</span></button>`).join('')}
    </div>
    <div class="fb" id="qfb"></div>
    <div class="actions" id="qactions" style="display:none">
      <button class="cta" id="qseguir">${ultima ? 'Colher →' : 'Continuar →'}</button>
    </div>`;
  const botoes = modal.querySelectorAll('.opt');
  botoes.forEach((b) => b.addEventListener('click', () => responder(b, pergunta, botoes)));
}

function responder(botao, pergunta, botoes) {
  if (botao.disabled) return;
  const i = Number(botao.dataset.i);
  const opcao = pergunta.opcoesEmbaralhadas[i];
  pergunta.tentativas++;
  const fb = document.getElementById('qfb');
  if (opcao.ok) {
    if (pergunta.acertouDePrimeira === null) pergunta.acertouDePrimeira = pergunta.tentativas === 1;
    botoes.forEach((b) => { b.disabled = true; if (Number(b.dataset.i) === i) b.classList.add('right'); });
    fb.className = 'fb show ok';
    fb.innerHTML = `<b>${pergunta.tentativas === 1 ? 'Acertou de primeira' : 'Acertou'}</b>${pergunta.definicao || ''}`;
    document.getElementById('qactions').style.display = 'flex';
    document.getElementById('qseguir').addEventListener('click', () => fecharPergunta(true));
  } else {
    if (pergunta.acertouDePrimeira === null) pergunta.acertouDePrimeira = false;
    botao.classList.add('wrong', 'shake');
    botao.disabled = true;
    setTimeout(() => botao.classList.remove('shake'), 400);
    fb.className = 'fb show err';
    fb.innerHTML = `<b>Não foi essa</b>${opcao.why || 'Tente outra opção.'}`;
  }
}

function fecharPergunta(avancou) {
  const { cultura, etapa, spotCode } = estado.perguntaAtual;
  estado.perguntaAtual = null;
  document.getElementById('overlay').classList.remove('show');
  if (avancou) {
    cultura.progresso++;
    estado.dia++;
    if (spotCode) renderSpotTile(cultura, spotCode);
    atualizarHud();
    particulaNoJogador(culturaPronta(cultura) ? '✨' : '🌱');
    verificarFimDoTalhao(cultura);
  }
}

// ---------------------------------------------------------------- tela: fatura da colheita
function telaFatura() {
  const todasPerguntas = estado.culturas.flatMap((c) => c.etapas.map((e) => e.pergunta));
  const acertosPrimeira = todasPerguntas.filter((p) => p.acertouDePrimeira === true).length;
  const total = todasPerguntas.length;
  const pct = Math.round((acertosPrimeira / total) * 100);

  app.innerHTML = `
    <div class="kicker">Fatura da colheita</div>
    <h2 class="big">Fazenda completa, ${estado.personagem.apelido || estado.nome.split(' ')[0]}</h2>
    <div class="panel" style="text-align:center">
      <div class="counter">${acertosPrimeira}/${total}</div>
      <p class="narr" style="margin:8px auto 0;text-align:center">fases acertadas de primeira, das ${total} da disciplina · pontuação ${pct}%</p>
    </div>
    <div class="colheita-grid">
      ${estado.culturas.map((c) => `<div class="ch"><span class="e">${c.emoji}</span><span class="t"><b>${c.nome}</b><small>${c.unidade}</small></span></div>`).join('')}
    </div>
    <div class="panel tight" id="envioBox">
      <p style="font-size:.92rem;color:var(--ink-2)">Resultado de <b style="color:var(--ink)">${estado.nome}</b> (${estado.matricula}) pronto para envio.</p>
      <div class="actions">
        <button class="cta" id="btnEnviar">Enviar resultado</button>
      </div>
      <p class="hint" id="statusEnvio" style="text-align:left;margin-top:10px"></p>
    </div>`;

  document.getElementById('btnEnviar').addEventListener('click', () => enviarResultado(acertosPrimeira, total, pct));
}

function enviarResultado(acertos, total, pct) {
  const status = document.getElementById('statusEnvio');
  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  status.textContent = 'Enviando...';
  const dados = {
    nome: estado.nome, matricula: estado.matricula,
    disciplina: 'Coding: Linguagens e Técnicas', aula: 'todas (1 a 16)',
    atividade: 'Fazenda dos Paradigmas',
    acertos, total, pontuacao: pct,
    timestamp: new Date().toISOString(),
  };
  if (!WEBAPP_URL) { status.textContent = 'Resultado registrado só nesta tela.'; return; }
  fetch(WEBAPP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(dados) })
    .then(() => {
      status.innerHTML = '<span class="seal">✓ Resultado enviado.</span>';
      btn.style.display = 'none';
    })
    .catch(() => { status.textContent = 'Não foi possível enviar agora — tente de novo.'; btn.disabled = false; });
}

// ---------------------------------------------------------------- roteador
function render() {
  if (estado.tela === 'id') telaId();
  else if (estado.tela === 'personagem') telaPersonagem();
  else if (estado.tela === 'historia') telaHistoria(0);
  else if (estado.tela === 'briefing') telaBriefing();
  else if (estado.tela === 'mapa') telaMapa();
  else if (estado.tela === 'cena') telaCena();
  else if (estado.tela === 'fatura') telaFatura();
  atualizarHud();
  aplicarPeriodo();
  atualizarMusicaPorTela();
}

aplicarPeriodo();
setInterval(aplicarPeriodo, 60000);
const btnMute = document.getElementById('btnMute');
if (btnMute) {
  btnMute.addEventListener('click', () => {
    estado.audio.muted = !estado.audio.muted;
    btnMute.textContent = estado.audio.muted ? '🔇' : '🔊';
    if (estado.audio.muted) pararMusica(); else atualizarMusicaPorTela();
  });
}
render();
</script>
