<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ateliê de RNF · Clínica PetVida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee3;--paper:#fffdf8;--ink:#1b1c1f;--muted:#6b675d;--teal:#1f6f6b;--teal2:#e3efed;--wine:#7a2c46;--gold:#c79a2b;--red:#c2412d;--green:#2f8a55;--line:#d9d2c2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:10;background:#16171a;color:#eeeae0;display:flex;align-items:center;gap:18px;padding:10px 22px;flex-wrap:wrap}
header .t{font:700 19px Fraunces,Georgia,serif}
header .sp{flex:1}
header .pill{font:600 13px JetBrains Mono,monospace;background:#2a2b30;border-radius:20px;padding:5px 12px}
header button{background:#2a2b30;color:#eeeae0;border:0;border-radius:20px;padding:6px 12px;font:600 13px Inter;cursor:pointer}
.trilha{display:flex;gap:6px;padding:10px 22px;background:#202126;overflow-x:auto}
.trilha span{font:600 12px JetBrains Mono,monospace;color:#8d897d;padding:4px 10px;border-radius:14px;border:1px solid #3a3b40;white-space:nowrap}
.trilha span.ok{color:#9fd8b5;border-color:#2f8a55}
.trilha span.at{color:#16171a;background:var(--gold);border-color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:26px 22px 80px}
h1{font:700 34px/1.15 Fraunces,Georgia,serif;margin:4px 0 10px}
h2{font:700 26px/1.2 Fraunces,Georgia,serif;margin:0 0 8px}
.kick{font:700 13px JetBrains Mono,monospace;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:14px 0}
.fala{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.fala .av{flex:0 0 52px;height:52px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;font:700 20px Fraunces,serif}
.fala b.n{display:block;font:700 14px Inter;color:var(--wine)}
.uc{font:500 16px/1.6 JetBrains Mono,monospace;background:#16171a;color:#eeeae0;border-radius:12px;padding:18px 20px;white-space:pre-wrap}
.uc .hl{background:#c79a2b33;border-radius:4px;padding:0 2px}
.btn{display:inline-block;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:700 16px Inter;cursor:pointer;margin:6px 8px 6px 0}
.btn.sec{background:#e7e1d3;color:var(--ink)}
.btn.dica{background:#fff3d6;color:#7a5a12;border:1px solid #e8cf8a}
.btn:disabled{opacity:.45;cursor:default}
.rodape{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
.mouse{display:inline-flex;align-items:center;gap:8px;background:var(--teal2);color:var(--teal);border-radius:20px;padding:6px 14px;font:600 14px Inter}
input,select{font:16px Inter;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
select{padding:7px 8px;font-size:15px}
.membros{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;max-width:720px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:#fff;border:2px solid var(--line);border-radius:22px;padding:8px 14px;font:600 15px Inter;cursor:pointer;user-select:none}
.chip.sel{border-color:var(--gold);background:#fff6df}
.chip.ok{border-color:var(--green);background:#eef8f1}
.chip.no{border-color:var(--red);background:#fbefeb}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.baldes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.balde{background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:12px;min-height:120px;cursor:pointer}
.balde.alvo{border-color:var(--gold);background:#fffaf0}
.balde h3{margin:0 0 6px;font:700 15px Inter;color:var(--teal)}
.balde p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.fb{border-radius:10px;padding:12px 16px;margin:10px 0;font-size:15px}
.fb.ok{background:#eef8f1;border:1px solid #a9d4b7}
.fb.no{background:#fbefeb;border:1px solid #e9b8ae}
.fb.info{background:var(--teal2);border:1px solid #b9d6d2}
.lista-exp{margin:8px 0 0;padding-left:18px;font-size:14px}
.lista-exp li{margin:3px 0}
.diag{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin:12px 0}
.diag svg{width:100%;height:auto;display:block;max-width:1000px;margin:0 auto}
svg text{font-family:Inter,system-ui,sans-serif}
.assoc{display:grid;grid-template-columns:110px 92px 1fr 92px 120px;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;font-weight:600}
.assoc.ok{border-color:#a9d4b7;background:#f3faf5}.assoc.no{border-color:#e9b8ae;background:#fdf4f1}
.assoc .r{text-align:right}
.mcq{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.mcq .en{font-weight:600;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin:6px 0;font:15px Inter;cursor:pointer}
.opt.sel{border-color:var(--gold);background:#fff6df}
.opt.ok{border-color:var(--green);background:#eef8f1}
.opt.no{border-color:var(--red);background:#fbefeb}
.cards5{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.c5{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.c5 .tx{font-weight:600;margin-bottom:8px}
.c5 .bt{display:flex;gap:6px;flex-wrap:wrap}
.c5 .bt button{flex:1;border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px;font:600 13px Inter;cursor:pointer}
.c5 .bt button.sel{border-color:var(--teal);background:var(--teal2);color:var(--teal)}
.c5.ok{border-color:#a9d4b7;background:#f3faf5}.c5.no{border-color:#e9b8ae;background:#fdf4f1}
.ordem{display:flex;flex-wrap:wrap;gap:8px}
.ordem .chip .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:13px;margin-right:6px}
.hot{cursor:pointer}
.hot rect.hb{fill:transparent;stroke:transparent;stroke-width:3;rx:6}
.hot:hover rect.hb{stroke:#c79a2b88}
.hot.marc rect.hb{fill:#c79a2b22;stroke:var(--gold)}
.hot.ok rect.hb{fill:#2f8a5522;stroke:var(--green)}
.hot.no rect.hb{fill:#c2412d22;stroke:var(--red)}
.placar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.placar div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.placar b{display:block;font:700 26px Fraunces,serif;color:var(--teal)}
.grande{font:700 64px Fraunces,serif;color:var(--teal);line-height:1}
.status{font-weight:600;color:var(--teal)}
.dicabox{background:#fff8e6;border:1px solid #e8cf8a;border-radius:10px;padding:10px 14px;margin:8px 0;font-size:15px}
.prancheta{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.prancheta .colD{position:sticky;top:104px}
.prancheta .diag{margin-top:14px}
.prancheta .assoc{grid-template-columns:96px 74px minmax(0,1fr) 74px 98px;font-size:14px;padding:6px 8px;gap:6px}
.prancheta .assoc select{font-size:14px;padding:6px 4px;width:100%}
.prancheta .chip{padding:6px 11px;font-size:14px}
[data-c]:hover rect{fill:#fff6df}
@media (max-width:1000px){.prancheta{grid-template-columns:1fr}.prancheta .colD{position:static}}
main{max-width:1260px}
@media (max-width:760px){.assoc{grid-template-columns:1fr 1fr;}.membros{grid-template-columns:1fr}h1{font-size:28px}}
.tok{display:inline-block;border-bottom:3px dotted var(--line);padding:0 3px;cursor:pointer;border-radius:4px}
.tok.sel{background:#fff0c2;border-bottom-color:var(--gold)}
.tok.ok{background:#e3f3e9;border-bottom:3px solid var(--green)}
.tok.no{background:#fbe3dd;border-bottom:3px solid var(--red)}
.tok.perdi{background:#fff3d6;border-bottom:3px dashed var(--gold)}
.frase{font:500 19px/2 Inter,sans-serif;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin:8px 0}
.frase small{font:700 12px JetBrains Mono,monospace;color:var(--wine);margin-right:10px}
.prancheta{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.prancheta .vago{font:600 16px Inter;color:var(--wine);margin-bottom:10px}
.prancheta label{display:block;font:700 12px JetBrains Mono,monospace;color:var(--muted);margin:10px 0 3px;text-transform:uppercase;letter-spacing:.08em}
.prancheta select{width:100%;font-size:15px;padding:9px 8px;border:2px solid var(--line);border-radius:8px;background:#fff}
.prancheta select.ok{border-color:var(--green);background:#eef8f1}
.prancheta select.no{border-color:var(--red);background:#fbefeb}
.montada{font:500 16px/1.5 Inter;background:#16171a;color:#eeeae0;border-radius:10px;padding:12px 16px;margin-top:10px}
.linha{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0;cursor:pointer;font-size:17px}
.linha b{font:700 13px JetBrains Mono,monospace;color:var(--wine);flex:0 0 62px;padding-top:3px}
.linha.sel{border-color:var(--gold);background:#fff6df}
.linha.ok{border-color:var(--green);background:#eef8f1}
.linha.no{border-color:var(--red);background:#fbefeb}

</style>
</head>
<body>
<header>
  <span class="t">Ateliê de RNF</span>
  <span class="pill" id="hEquipe">Clínica PetVida</span>
  <span class="sp"></span>
  <span class="pill" id="hPontos">0 pontos</span>
  <span class="pill" id="hTempo">00:00</span>
  <button id="bSom">som: ligado</button>
  <button id="bRe">recomeçar</button>
</header>
<nav class="trilha" id="trilha"></nav>
<main id="app"></main>
<script>
'use strict';
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzyVDcweu9eO6c8CztBCIj8y6hj1MXWVpWr0aFmXn_jrE3AYJC-BG7gc3OnsYiz6gbY/exec';
const CHAVE = 'atelie-rnf-petvida-v1';
const ESTACOES = ['Equipe', '1 · Briefing', '2 · Marca-texto', '3 · Classificar', '4 · Prancheta', '5 · Pergunta ao cliente', '6 · Caça ao defeito', 'Resultado'];

let S = carregar() || novo();
function novo(){ return {est:0, equipe:'', membros:[], pts:{}, max:{}, dicas:{}, inicio:null, fim:null, enviado:false, som:true, r:{}}; }
function carregar(){ try{ return JSON.parse(localStorage.getItem(CHAVE)); }catch(e){ return null; } }
function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(S)); }catch(e){} }
const $ = (s, el=document) => el.querySelector(s);
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') e.className=v; else if (k==='html') e.innerHTML=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()){ if (k==null) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
function md(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>'); }
function embaralhar(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function total(){ let p=0; for(const k in S.pts) p+=S.pts[k]; for(const k in S.dicas) p-=S.dicas[k]; return Math.max(0,p); }
function totalMax(){ let m=0; for(const k in S.max) m+=S.max[k]; return m; }

let AC=null;
function bip(ok){
  if(!S.som) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const notas = ok ? [523,659,784] : [330,262];
    notas.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type= ok?'triangle':'square'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,AC.currentTime+i*0.09); g.gain.exponentialRampToValueAtTime(0.06,AC.currentTime+i*0.09+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+i*0.09+0.16); o.connect(g).connect(AC.destination); o.start(AC.currentTime+i*0.09); o.stop(AC.currentTime+i*0.09+0.2); });
  }catch(e){}
}
function cab(){
  $('#hEquipe').textContent = S.equipe ? 'Equipe ' + S.equipe : 'Clínica PetVida';
  $('#hPontos').textContent = total() + ' pontos';
  $('#bSom').textContent = 'som: ' + (S.som ? 'ligado' : 'desligado');
  if (!S.inicio) $('#hTempo').textContent = '00:00';
  const tr = $('#trilha'); tr.innerHTML='';
  ESTACOES.forEach((n,i)=> tr.append(h('span',{class: i<S.est ? 'ok' : i===S.est ? 'at' : ''}, n)));
}
setInterval(()=>{ if(!S.inicio) return; const s=Math.floor(((S.fim||Date.now())-S.inicio)/1000);
  $('#hTempo').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }, 1000);
$('#bSom').onclick = ()=>{ S.som=!S.som; salvar(); cab(); };
$('#bRe').onclick = ()=>{ const som=S.som; S=novo(); S.som=som; salvar(); ir(0); };
function comMouse(){
  if(!S.membros.length) return null;
  const n = S.membros[(S.est-1+S.membros.length)%S.membros.length].nome.split(' ')[0];
  return h('span',{class:'mouse'}, 'Com o mouse agora: ' + n);
}
function fala(texto, quem='Dona Rita', sigla='R'){
  return h('div',{class:'fala'}, h('div',{class:'av'}, sigla), h('div',{}, h('b',{class:'n'}, quem), h('div',{html: md(texto)})));
}
function dicaBtn(id, texto, area){
  const b = h('button',{class:'btn dica'}, S.dicas[id] ? 'Dica usada (−1)' : 'Pedir dica (custa 1 ponto)');
  if (S.dicas[id]) { b.disabled = true; area.append(h('div',{class:'dicabox', html: md(texto)})); }
  b.onclick = ()=>{ S.dicas[id]=1; salvar(); b.disabled=true; b.textContent='Dica usada (−1)'; area.append(h('div',{class:'dicabox', html: md(texto)})); cab(); };
  return b;
}
function ir(n){ S.est=n; salvar(); cab(); const app=$('#app'); app.innerHTML=''; TELAS[n](app); window.scrollTo(0,0); }

/* ============================================================ conteúdo */
const RNF_VAGOS = `RNF01  O sistema deve ser rápido.
RNF02  O sistema deve ser seguro.
RNF03  O sistema deve ser fácil de usar.
RNF04  O sistema deve estar sempre disponível.`;

/* 2 · marca-texto: v=true vago, v=false medido (isca) */
const FRASES = [
  ['RNF01', ['O sistema deve ser ', {t:'rápido', v:true}, '.']],
  ['RNF02', ['O sistema deve ser ', {t:'seguro', v:true}, '.']],
  ['RNF03', ['O app deve ser ', {t:'fácil de usar', v:true}, ' e ', {t:'intuitivo', v:true}, '.']],
  ['RNF04', ['O sistema deve estar ', {t:'sempre', v:true}, ' disponível.']],
  ['RNF05', ['O app deve ter aparência ', {t:'moderna', v:true}, ' e funcionar em ', {t:'qualquer aparelho', v:true}, '.']],
  ['RNF06', ['A tela de horários deve carregar ', {t:'em até 2 segundos', v:false}, ' em rede ', {t:'4G', v:false}, '.']],
  ['RNF07', ['A conta deve ficar ', {t:'bloqueada por 15 minutos', v:false}, ' após ', {t:'5 tentativas erradas', v:false}, '.']],
  ['RNF08', ['A senha deve ser guardada com ', {t:'hash e sal', v:false}, '.']],
];
const EXPLICA_TOK = {
  vagas: 'Palavra vaga: cada pessoa entende de um jeito e ninguém consegue testar. Falta um número, um limite ou um contexto.',
  certas: 'Termo mensurável ou verificável: tem número, limite ou técnica que dá para conferir. Marcar isso tira ponto.'
};

/* 3 · classificar */
const BALDES = [
  ['Desempenho', 'tempo e capacidade'], ['Segurança', 'proteção de dados e acesso'], ['Usabilidade', 'facilidade e acessibilidade'],
  ['Confiabilidade', 'no ar e recuperação'], ['Portabilidade', 'onde o sistema roda']];
const ITENS = [
  ['A tela de horários carrega em até 2 segundos com 4G', 0, 'Mede tempo de resposta: desempenho.'],
  ['A senha do tutor é guardada cifrada, nunca em texto puro', 1, 'Protege um dado sensível: segurança.'],
  ['Um tutor novo conclui um agendamento sem ajuda em até 3 minutos', 2, 'Mede a facilidade de uso por uma pessoa real: usabilidade.'],
  ['O app fica no ar 99,5% do tempo em cada mês', 3, 'Mede o tempo em que o sistema está disponível: confiabilidade.'],
  ['O app funciona no Android 10 ou mais novo e no iOS 15 ou mais novo', 4, 'Diz em quais ambientes o sistema roda: portabilidade.'],
  ['O sistema atende 200 agendamentos ao mesmo tempo no sábado de manhã', 0, 'Mede capacidade sob carga: desempenho.'],
  ['Depois de 5 senhas erradas, a conta é bloqueada por 15 minutos', 1, 'Controle de acesso contra tentativa de invasão: segurança.'],
  ['Se o servidor cair, os dados voltam em até 1 hora, com perda máxima de 15 minutos', 3, 'Trata de recuperação após falha: confiabilidade.'],
  ['Os botões têm texto legível e contraste mínimo de 4,5 para 1', 2, 'Acessibilidade visual faz parte da usabilidade.'],
  ['O site abre nos 3 navegadores mais usados, na versão atual de cada um', 4, 'Define a compatibilidade com ambientes: portabilidade.'],
];

/* 4 · prancheta: [vago, [[rótulo, correta, opções..., explicação]] ] */
const PRANCHETA = [
  { vago: 'O sistema deve ser rápido.', slots: [
    ['Contexto', 'na tela de horários, com o tutor em rede 4G',
      ['em qualquer tela, com o tutor em qualquer rede', 'na tela de horários, com o tutor em rede muito veloz', 'na tela principal, quando o servidor permitir'],
      'Contexto é onde e em que condição vale a regra. Rede 4G é o caso comum do tutor; "qualquer" e "muito veloz" escondem o pior caso.'],
    ['Critério', 'carregar em até 2 segundos em 95% dos acessos',
      ['carregar o mais rápido que a tecnologia permitir', 'carregar em um tempo razoável para o usuário', 'carregar em 2 segundos como tempo médio geral'],
      'Número e proporção: 2 segundos em 95% dos acessos. Média esconde os acessos muito lentos.'],
    ['Como verificar', 'teste de carga com 200 acessos simultâneos',
      ['perguntar à dona da clínica se ela achou rápido', 'ler o código do servidor procurando lentidão', 'o desenvolvedor abrir a tela uma vez e anotar'],
      'Verificar é medir com um teste repetível. Opinião e uma única tentativa não provam nada.'] ] },
  { vago: 'O sistema deve ser seguro.', slots: [
    ['Contexto', 'no login do tutor, pelo app e pelo site',
      ['em todas as telas do sistema, o tempo todo', 'no login do tutor, só pelo aplicativo', 'no banco de dados, nos dados internos'],
      'Escolha um alvo claro. O login é a porta de entrada e existe nos dois canais.'],
    ['Critério', 'bloquear a conta 15 min após 5 senhas erradas',
      ['usar uma proteção forte contra qualquer invasor', 'bloquear a conta quando houver alguma suspeita', 'pedir uma senha bem difícil para o tutor criar'],
      'Critério é comportamento com número: 5 erros, 15 minutos. "Forte" e "suspeita" não dá para testar.'],
    ['Como verificar', 'teste que erra a senha 5 vezes e vê o bloqueio',
      ['confiar que o programador seguiu as boas práticas', 'perguntar ao tutor se ele se sente seguro no app', 'olhar a tela de login e ver se ela está bonita'],
      'O teste reproduz o ataque e confere o resultado, sempre do mesmo jeito.'] ] },
  { vago: 'O sistema deve ser fácil de usar.', slots: [
    ['Contexto', 'para um tutor que nunca usou o app, no celular',
      ['para um programador acostumado com sistemas novos', 'para qualquer pessoa, em qualquer situação de uso', 'para o tutor depois de um mês de uso do app'],
      'Facilidade depende de quem usa. O pior caso é o novato, no aparelho que ele realmente tem.'],
    ['Critério', 'concluir um agendamento em 3 minutos sem ajuda',
      ['achar o app simples e agradável de usar no dia a dia', 'concluir um agendamento com poucos toques na tela', 'ter o menu organizado de um jeito bem intuitivo'],
      'Critério é uma tarefa real com tempo: agendar em 3 minutos, sem ajuda. "Poucos" e "intuitivo" são vagos.'],
    ['Como verificar', 'teste de usabilidade com 5 tutores, cronometrado',
      ['conferir se o projeto segue o guia de estilo da marca', 'a equipe testar entre si antes da entrega final', 'enviar um formulário perguntando se gostaram do app'],

function blocoMCQ(lista, resp, chave, feito, redesenhar){
  return lista.map((q,k)=>{
    const box=h('div',{class:'mcq'});
    if(q.ctx) box.append(h('div',{html: md(q.ctx), style:'margin-bottom:6px'}));
    box.append(h('div',{class:'en'}, q.en));
    const ordem = resp['o'+chave+k] || (resp['o'+chave+k]=embaralhar([0,1,2,3]));
    ordem.forEach(i=>{ let c='opt'; if(resp[chave][k]===i) c+=' sel'; if(feito){ if(i===q.c) c+=' ok'; else if(resp[chave][k]===i) c+=' no'; }
      const b=h('button',{class:c}, q.ops[i]); if(!feito) b.onclick=()=>{ resp[chave][k]=i; salvar(); redesenhar(); }; box.append(b); });
    if(feito) box.append(h('div',{class:'fb '+(resp[chave][k]===q.c?'ok':'no'), html: md(q.e)}));
    return box;
  });
}

    Object.keys(S.dicas).length ? h('p',{style:'text-align:center;color:#7a5a12'}, `Dicas usadas: ${Object.keys(S.dicas).length} (−${Object.keys(S.dicas).length} pontos)`) : '');
  const st=h('div',{class:'status', style:'text-align:center;margin:10px 0'});
  app.append(st, fala('Obrigada, equipe! Agora façam o mesmo com os RNF do projeto de vocês: **contexto, critério e como verificar**. A lista entra no DDR como "RNF mensuráveis".'));
  if(!S.enviado){ S.enviado=true; salvar();
    enviarResultado(S.membros.map(m=>({ timestamp:new Date().toISOString(), nome:m.nome, matricula:m.mat,
      disciplina:'Engenharia de Requisitos', aula:10, atividade:'Ateliê de RNF: PetVida · equipe ' + S.equipe,
      acertos:pts, total:mx, pontuacao:pct })), st);
  } else st.textContent='Resultado já enviado. Mostre esta tela ao professor se precisar.';
};
function enviarResultado(lista, st){
  if(!WEBAPP_URL){ st.textContent='Resultado registrado só nesta tela.'; return; }
  Promise.all(lista.map(d=> fetch(WEBAPP_URL,{method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(d)})))
    .then(()=>{ st.textContent='Resultado enviado para o professor, uma linha por integrante.'; })
    .catch(()=>{ st.textContent='Não consegui enviar agora. Mostre esta tela ao professor.'; });
}
cab(); ir(S.est||0);

</script>
