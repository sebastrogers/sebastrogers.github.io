<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Atributos que caracterizam os requisitos — revisão — revisão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --night:#0A0F1F; --deep:#111834; --panel:#182042; --panel-2:#1F2950;
  --edge:#2C3765; --edge-hi:#41508C; --ink:#EAEEFB; --ink-2:#B4BEE0; --dim:#7480A8;
  --signal:#4FD6EC; --signal-deep:#1E7F94; --stage:#FFB547; --good:#5FD98F; --bad:#FF7A6B;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 18px 44px -22px rgba(0,0,0,.9); --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--night);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;margin:0;line-height:1.08;font-weight:700;text-wrap:balance}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:4px}
input[type=text]{font-family:inherit;font-size:1rem;color:var(--ink);background:#0A1023;border:1px solid var(--edge-hi);border-radius:8px;padding:11px 14px;width:100%}
input[type=text]:focus{outline:none;border-color:var(--signal)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

#top{position:sticky;top:0;z-index:50;background:rgba(10,15,31,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--edge);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#top .brand{font-family:"Bricolage Grotesque",serif;font-weight:800;font-size:1.02rem;letter-spacing:-.01em}
#top .brand small{display:block;font-family:"JetBrains Mono",monospace;font-size:.56rem;letter-spacing:.16em;color:var(--dim);font-weight:400;text-transform:uppercase;margin-top:1px}
#meter{flex:1 1 160px;min-width:120px;display:flex;align-items:center;gap:10px}
#meter .track{flex:1;height:6px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--edge)}
#meter .fill{height:100%;width:0;background:linear-gradient(90deg,var(--signal-deep),var(--signal));transition:width .8s cubic-bezier(.22,1,.36,1)}
#meter .pct{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--signal);min-width:36px;text-align:right}
#meter .lbl{font-family:"JetBrains Mono",monospace;font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
#top .tools{display:flex;gap:6px}
.tbtn{font-size:.74rem;padding:5px 10px;border:1px solid var(--edge);border-radius:99px;color:var(--ink-2)}
.tbtn:hover{border-color:var(--edge-hi);color:var(--ink)}

#app{max-width:720px;margin:0 auto;padding:28px 20px 64px;min-height:calc(100vh - 60px)}

.kicker{font-family:"JetBrains Mono",monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--signal);margin-bottom:12px}
.kicker.warm{color:var(--stage)}
h2.big{font-size:clamp(1.5rem,4.2vw,2.3rem);letter-spacing:-.02em}
.narr{color:var(--ink-2);max-width:64ch;margin-top:14px}
.narr b{color:var(--ink)}
.micro{margin-top:16px;border-left:3px solid var(--signal);background:var(--deep);padding:14px 18px;border-radius:0 var(--r) var(--r) 0;color:var(--ink-2);font-size:.95rem}

.cta{display:inline-flex;align-items:center;gap:9px;background:var(--signal);color:#06121A;font-weight:700;padding:12px 22px;border-radius:99px;font-size:1rem;transition:transform .16s,box-shadow .16s}
.cta:hover{transform:translateY(-2px);box-shadow:0 8px 22px -8px rgba(79,214,236,.7)}
.cta:disabled{background:var(--panel-2);color:var(--dim);cursor:not-allowed;transform:none;box-shadow:none}
.cta.warm{background:var(--stage)}
.ghost{border:1px solid var(--edge-hi);color:var(--ink-2);padding:11px 20px;border-radius:99px;font-weight:600;font-size:.94rem}
.ghost:hover{border-color:var(--signal);color:var(--signal)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}

.panel{background:var(--deep);border:1px solid var(--edge);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-top:20px}
.grid{display:grid;gap:12px}
@media(min-width:560px){.g2{grid-template-columns:1fr 1fr}}

.cmd{background:var(--panel);border:1px solid var(--edge-hi);border-radius:var(--r);padding:14px 18px;margin:18px 0;font-weight:600;font-size:1rem}
.cmd em{display:block;font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--signal);font-style:normal;font-weight:400;margin-bottom:5px}
.hint{font-size:.85rem;color:var(--dim);margin-top:14px;text-align:center}
.ctx{background:var(--deep);border:1px solid var(--edge);border-radius:var(--r);padding:16px 18px;color:var(--ink-2);font-size:.95rem;margin-top:18px}
.qprog{font-family:"JetBrains Mono",monospace;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}

.fb{margin-top:16px;border-radius:var(--r);padding:15px 18px;font-size:.94rem;border:1px solid;display:none;animation:pop .35s cubic-bezier(.22,1,.36,1)}
.fb.show{display:block}
.fb.ok{background:rgba(95,217,143,.09);border-color:rgba(95,217,143,.45);color:#CDF3DD}
.fb.err{background:rgba(255,122,107,.09);border-color:rgba(255,122,107,.4);color:#FFD8D2}
.fb.tip{background:rgba(255,181,71,.09);border-color:rgba(255,181,71,.4);color:#FFE7C2}
.fb b{display:block;font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px;opacity:.85}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}

.shake{animation:shk .38s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{border:1px solid var(--edge-hi);border-radius:99px;padding:9px 16px;font-size:.88rem;color:var(--ink-2);transition:all .16s}
.chip:hover:not(:disabled){border-color:var(--signal);color:var(--ink)}
.chip.right{background:var(--good);color:#06121A;border-color:var(--good);font-weight:600}
.chip.wrong{background:var(--bad);color:#2a0d0a;border-color:var(--bad);font-weight:600}
.chip:disabled{cursor:default;opacity:.55}
.chip:disabled.right,.chip:disabled.wrong{opacity:1}

.dlist{display:grid;gap:9px;margin-top:6px}
.dec{text-align:left;background:var(--panel);border:1px solid var(--edge-hi);border-radius:var(--r);padding:12px 15px;font-size:.92rem;transition:all .16s;width:100%}
.dec:hover:not(:disabled){border-color:var(--signal)}
.dec.on{border-color:var(--stage);background:rgba(255,181,71,.08)}
.dec.right{border-color:var(--good);background:rgba(95,217,143,.09);color:#CDF3DD}
.dec.wrong{border-color:var(--bad);background:rgba(255,122,107,.09)}
.dec:disabled{opacity:.6;cursor:default}

.seqrail{position:relative;display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding:8px 2px 14px}
.seqslot{flex:0 0 140px;min-height:72px;border:1.5px dashed var(--edge-hi);border-radius:var(--r);display:grid;place-items:center;padding:9px;font-size:.76rem;text-align:center;color:var(--dim);position:relative}
.seqslot.filled{border-style:solid;border-color:var(--signal);background:rgba(79,214,236,.08);color:var(--ink);font-weight:600}
.seqslot .k{position:absolute;top:5px;left:8px;font-family:"JetBrains Mono",monospace;font-size:.58rem;color:var(--dim)}
.steps{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.step{text-align:left;background:var(--panel);border:1px solid var(--edge-hi);border-radius:var(--r);padding:13px 16px;font-size:.94rem;color:var(--ink-2);transition:border-color .16s,transform .16s;width:100%}
.step:hover:not(:disabled){border-color:var(--signal);color:var(--ink);transform:translateX(3px)}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:12px;text-align:left;align-items:start;background:var(--panel);border:1px solid var(--edge-hi);border-radius:var(--r);padding:13px 16px;font-size:.95rem;transition:border-color .16s,background .16s;width:100%}
.opt:hover:not(:disabled){border-color:var(--signal)}
.opt .l{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--dim)}
.opt.right{border-color:var(--good);background:rgba(95,217,143,.1)}
.opt.right .l{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(255,122,107,.09)}
.opt.wrong .l{color:var(--bad)}
.opt:disabled{cursor:default}
.opt.faded{opacity:.4}

.excerto{background:var(--night);border-left:3px solid var(--stage);border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin:18px 0;font-style:italic;color:var(--ink-2)}

.counter{font-family:"JetBrains Mono",monospace;font-size:clamp(2.2rem,8vw,3.6rem);font-weight:600;color:var(--good);letter-spacing:-.03em;line-height:1}
.takeaways{display:grid;gap:9px;margin-top:16px}
.ta{display:grid;grid-template-columns:26px 1fr;gap:12px;background:var(--night);border:1px solid var(--edge);border-radius:8px;padding:12px 15px;font-size:.93rem;color:var(--ink-2)}
.ta i{font-family:"JetBrains Mono",monospace;font-style:normal;color:var(--signal);font-size:.8rem}
.seal{display:inline-flex;align-items:center;gap:11px;border:1px solid var(--good);background:rgba(95,217,143,.1);border-radius:99px;padding:11px 22px;margin-top:22px;font-weight:700;color:#CDF3DD}
.summary{margin-top:18px}
.summary .row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--edge);font-size:.92rem}
.summary .row span:first-child{color:var(--ink-2)}
.summary .row b{font-family:"JetBrains Mono",monospace;color:var(--signal)}
.stars{font-size:1.3rem;letter-spacing:2px;margin-top:8px}

.noteflag{margin-top:22px;border:1px dashed var(--edge-hi);border-radius:var(--r);padding:14px 17px;font-size:.85rem;color:var(--dim)}
.noteflag b{color:var(--stage);display:block;font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}}
</style>
</head>
<body>
<header id="top">
  <div class="brand">Atributos que caracterizam os requisitos — revisão<small>Engenharia de Requisitos · Revisão individual</small></div>
  <div id="meter">
    <span class="lbl">Progresso</span>
    <div class="track"><div class="fill" id="mfill"></div></div>
    <span class="pct mono" id="mpct">0%</span>
  </div>
  <div class="tools"><button class="tbtn" id="btnHub">Jogos</button></div>
</header>
<main id="app"></main>
<script>
const CONTEUDO = {"aula":2,"disciplina":"Engenharia de Requisitos","titulo":"Atributos que caracterizam os requisitos — revisão","introducao":"Níveis de requisito, as nove características da ISO/IEC/IEEE 29148, critério de aceite e a caça aos requisitos ruins.","desafios":[{"tipo":"pareamento","titulo":"Os níveis: usuário, sistema ou software?","instrucao":"Toque numa frase e depois no nível que ela representa.","colunaA":"Frase","colunaB":"Nível","pares":[{"a":"O paciente deve poder cancelar sua consulta pelo aplicativo.","b":"Requisito de usuário"},{"a":"Ao receber a solicitação de cancelamento, o sistema deve autenticar o paciente, verificar a antecedência mínima de 24 horas, alterar o estado da consulta e notificar o profissional responsável.","b":"Requisito de sistema"},{"a":"O método cancelarConsulta() deve retornar erro 409 se a antecedência for menor que 24 horas.","b":"Requisito de software"}]},{"tipo":"mcq","titulo":"As nove características da ISO/IEC/IEEE 29148","instrucao":"Qual característica está sendo testada em cada pergunta?","perguntas":[{"enunciado":"\"Se eu apagar esta linha, alguma necessidade fica sem atendimento?\" — qual característica essa pergunta testa?","opcoes":["Necessário","Não ambíguo","Singular","Verificável","Correto","Completo"],"correta":0,"explicacao":"Necessário: se nada quebra ao remover a linha, ela não deveria estar no documento."},{"enunciado":"\"Duas pessoas leem e entendem a mesma coisa?\" — qual característica essa pergunta testa?","opcoes":["Necessário","Não ambíguo","Singular","Verificável","Correto","Completo"],"correta":1,"explicacao":"Não ambíguo: a frase só pode ser lida de um jeito."},{"enunciado":"\"Tem um \\\"e também\\\" que esconde um segundo requisito?\" — qual característica essa pergunta testa?","opcoes":["Necessário","Não ambíguo","Singular","Verificável","Correto","Completo"],"correta":2,"explicacao":"Singular: cada requisito deveria descrever uma coisa só, com seu próprio teste e responsável."},{"enunciado":"\"Consigo escrever o teste que aprova ou reprova esta frase?\" — qual característica essa pergunta testa?","opcoes":["Necessário","Não ambíguo","Singular","Verificável","Correto","Completo"],"correta":3,"explicacao":"Verificável: sem número ou critério objetivo, ninguém consegue montar o teste."},{"enunciado":"\"É de fato o que o interessado precisa, e não o que eu supus?\" — qual característica essa pergunta testa?","opcoes":["Necessário","Não ambíguo","Singular","Verificável","Correto","Completo"],"correta":4,"explicacao":"Correto: o requisito precisa refletir a necessidade real, não uma suposição do analista."}]},{"tipo":"sequencia","titulo":"Critério de aceite: Dado, Quando, Então","instrucao":"Monte o cenário na ordem certa. Cenário: cancelamento com mais de 24 horas de antecedência.","itens":["Dado que existe uma consulta marcada para 29/08 às 14h","E que agora são 27/08 às 10h","Quando o paciente solicita o cancelamento pelo aplicativo","Então a consulta passa para o estado \"cancelada\"","E o horário volta a ficar disponível na agenda"],"feedbackOk":"Essa é a ordem: contexto (Dado), ação (Quando), resultado observável (Então). O cliente lê, o analista escreve, quem testa executa."},{"tipo":"defeito","titulo":"Caça aos requisitos ruins","instrucao":"Cada frase tem um defeito com nome.","casos":[{"trecho":"O sistema deve ser rápido ao carregar a agenda do dia.","pergunta":"Qual é o defeito?","opcoes":["Não verificável","Não é singular (mistura vários requisitos)","Descreve solução, não necessidade","Inconsistente com outro requisito","Incompleto (não trata exceções)","Ambíguo (duplo sentido)"],"correta":0,"explicacao":"\"Rápido\" não tem unidade — ninguém consegue reprovar a frase. Ficaria melhor como: a agenda deve carregar em até 2 segundos, para até 80 consultas, medido no percentil 95."},{"trecho":"O sistema deve permitir cadastrar, editar e excluir pacientes, e também enviar lembrete por SMS e gerar o relatório mensal de atendimentos.","pergunta":"Qual é o defeito?","opcoes":["Não verificável","Não é singular (mistura vários requisitos)","Descreve solução, não necessidade","Inconsistente com outro requisito","Incompleto (não trata exceções)","Ambíguo (duplo sentido)"],"correta":1,"explicacao":"São cinco requisitos diferentes numa frase só — cada um precisa do seu teste, estimativa e responsável, separados."},{"trecho":"O sistema deve usar MongoDB para armazenar o histórico de consultas.","pergunta":"Qual é o defeito?","opcoes":["Não verificável","Não é singular (mistura vários requisitos)","Descreve solução, não necessidade","Inconsistente com outro requisito","Incompleto (não trata exceções)","Ambíguo (duplo sentido)"],"correta":2,"explicacao":"Fecha a porta antes da análise começar. A necessidade real era o histórico suportar 5 anos de dados com consulta rápida — a escolha do banco é decisão de projeto, não requisito."},{"trecho":"RF-030 Somente o médico pode cancelar uma consulta. RF-045 O paciente pode cancelar a própria consulta pelo aplicativo.","pergunta":"Qual é o defeito desses dois requisitos juntos?","opcoes":["Não verificável","Não é singular (mistura vários requisitos)","Descreve solução, não necessidade","Inconsistente com outro requisito","Incompleto (não trata exceções)","Ambíguo (duplo sentido)"],"correta":3,"explicacao":"Os dois não podem valer ao mesmo tempo — foram escritos em entrevistas diferentes, com pessoas diferentes, e ninguém percebeu o conflito."},{"trecho":"RF-023 O sistema deve enviar lembrete por SMS 24 horas antes da consulta.","pergunta":"Qual é o defeito, pensando no que falta?","opcoes":["Não verificável","Não é singular (mistura vários requisitos)","Descreve solução, não necessidade","Inconsistente com outro requisito","Incompleto (não trata exceções)","Ambíguo (duplo sentido)"],"correta":4,"explicacao":"Só descreve o caminho feliz. Falta tratar: número inválido, falha no envio, consulta remarcada, paciente que recusou SMS."},{"trecho":"RF-051 O sistema deve notificar o médico ou a recepção quando uma consulta for cancelada.","pergunta":"Qual é o defeito?","opcoes":["Não verificável","Não é singular (mistura vários requisitos)","Descreve solução, não necessidade","Inconsistente com outro requisito","Incompleto (não trata exceções)","Ambíguo (duplo sentido)"],"correta":5,"explicacao":"O \"ou\" em português é inclusivo e exclusivo ao mesmo tempo — dá pra ler de três jeitos diferentes."}]}]};
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzyVDcweu9eO6c8CztBCIj8y6hj1MXWVpWr0aFmXn_jrE3AYJC-BG7gc3OnsYiz6gbY/exec";
const LETRAS = 'ABCDEFGH';

const S = {
  nome: localStorage.getItem('jogoReq_nome') || '',
  matricula: localStorage.getItem('jogoReq_matricula') || '',
  idx: 0,
  resultados: [],
};

function el(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.firstElementChild;
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function paintMeter() {
  const total = CONTEUDO.desafios.length;
  const atual = Math.min(S.idx, total);
  const pct = total ? Math.round((atual / total) * 100) : 0;
  document.getElementById('mfill').style.width = pct + '%';
  document.getElementById('mpct').textContent = pct + '%';
}

function montar(html) {
  document.getElementById('app').innerHTML = html;
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
  paintMeter();
}

document.getElementById('btnHub').addEventListener('click', () => {
  window.location.href = 'jogos-revisao.html';
});

// ---------------------------------------------------------------- tela 0: identificacao
function telaIdentificacao() {
  montar(`
    <div class="kicker">${CONTEUDO.disciplina || 'Engenharia de Requisitos'} · Aula ${CONTEUDO.aula}</div>
    <h2 class="big">Antes de começar</h2>
    <p class="narr">Digite seu nome e sua matrícula (ou turma) pra eu saber quem jogou. Não precisa de senha — é só identificação.</p>
    <div class="panel" style="max-width:440px">
      <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px">Nome completo</label>
      <input type="text" id="nome" value="${S.nome}" placeholder="Ana Beatriz Souza" style="margin-bottom:16px">
      <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px">Matrícula ou turma</label>
      <input type="text" id="mat" value="${S.matricula}" placeholder="ADS2026208 ou Turma A">
      <div class="fb err" id="erroId"><b>Falta algo</b>Preencha os dois campos antes de começar.</div>
    </div>
    <div class="actions"><button class="cta" id="btnComecar">Começar a revisão →</button></div>
  `);
  document.getElementById('btnComecar').addEventListener('click', () => {
    const nome = document.getElementById('nome').value.trim();
    const mat = document.getElementById('mat').value.trim();
    const err = document.getElementById('erroId');
    if (!nome || !mat) {
      err.classList.add('show');
      return;
    }
    err.classList.remove('show');
    S.nome = nome;
    S.matricula = mat;
    localStorage.setItem('jogoReq_nome', nome);
    localStorage.setItem('jogoReq_matricula', mat);
    telaIntro();
  });
}

// ---------------------------------------------------------------- tela 1: intro da aula
function telaIntro() {
  montar(`
    <div class="kicker">${CONTEUDO.disciplina || 'Engenharia de Requisitos'} · Aula ${CONTEUDO.aula}</div>
    <h2 class="big">${CONTEUDO.titulo}</h2>
    <p class="narr">${CONTEUDO.introducao || ''}</p>
    <div class="panel">
      <p class="qprog">Nesta revisão</p>
      <div class="takeaways">
        ${CONTEUDO.desafios.map((d, i) => '<div class="ta"><i>' + (i + 1) + '</i><span>' + d.titulo + '</span></div>').join('')}
      </div>
    </div>
    <div class="actions"><button class="cta" id="btnIniciar">Começar, ${S.nome.split(' ')[0]} →</button></div>
  `);
  document.getElementById('btnIniciar').addEventListener('click', () => {
    S.idx = 0;
    S.resultados = [];
    abrirDesafio(0);
  });
}

// ---------------------------------------------------------------- roteador de desafios
function abrirDesafio(i) {
  if (i >= CONTEUDO.desafios.length) { S.idx = CONTEUDO.desafios.length; telaFinal(); return; }
  S.idx = i;
  const d = CONTEUDO.desafios[i];
  if (d.tipo === 'mcq') renderMCQ(d);
  else if (d.tipo === 'defeito') renderDefeito(d);
  else if (d.tipo === 'sequencia') renderSequencia(d);
  else if (d.tipo === 'pareamento') renderPareamento(d);
  else if (d.tipo === 'categorizar') renderCategorizar(d);
}

function proximoDesafio(acertos, total) {
  S.resultados.push({ titulo: CONTEUDO.desafios[S.idx].titulo, acertos, total });
  abrirDesafio(S.idx + 1);
}

function cabecalho(d) {
  return `
    <div class="kicker">Desafio ${S.idx + 1} de ${CONTEUDO.desafios.length}</div>
    <h2 class="big" style="font-size:clamp(1.4rem,3.6vw,2rem)">${d.titulo}</h2>
    ${d.instrucao ? '<p class="narr">' + d.instrucao + '</p>' : ''}
  `;
}

// ---------------------------------------------------------------- mecanica: MCQ rapido
function renderMCQ(d) {
  let atual = 0;
  let acertos = 0;
  let ordemAtual = [];

  function pergunta() {
    const p = d.perguntas[atual];
    ordemAtual = shuffle(p.opcoes.map((texto, i) => ({ texto, i })));
    montar(`
      ${cabecalho(d)}
      <div class="ctx">
        <p class="qprog">Pergunta ${atual + 1} de ${d.perguntas.length}</p>
        <p style="font-weight:600;color:var(--ink)">${p.enunciado}</p>
      </div>
      <div class="opts" id="opcoes"></div>
      <div class="fb" id="fb"></div>
      <div class="actions" id="acoes" style="display:none"><button class="cta" id="btnProx">Continuar →</button></div>
    `);
    const cont = document.getElementById('opcoes');
    ordemAtual.forEach((op, pos) => {
      const b = el('<button class="opt"><span class="l">' + LETRAS[pos] + '</span><span class="txt">' + op.texto + '</span></button>');
      b.addEventListener('click', () => responder(pos));
      cont.appendChild(b);
    });
  }

  function responder(posEscolhida) {
    const p = d.perguntas[atual];
    const posCorreta = ordemAtual.findIndex((o) => o.i === p.correta);
    const botoes = document.querySelectorAll('#opcoes .opt');
    botoes.forEach((b, j) => {
      b.disabled = true;
      if (j === posCorreta) b.classList.add('right');
      else if (j === posEscolhida) b.classList.add('wrong', 'shake');
      else b.classList.add('faded');
    });
    const acertou = posEscolhida === posCorreta;
    if (acertou) acertos++;
    if (p.explicacao) {
      const fb = document.getElementById('fb');
      fb.className = 'fb show ' + (acertou ? 'ok' : 'err');
      fb.innerHTML = '<b>' + (acertou ? 'Certo' : 'Não foi essa') + '</b>' + p.explicacao;
    }
    document.getElementById('acoes').style.display = 'flex';
    document.getElementById('btnProx').onclick = () => {
      atual++;
      if (atual < d.perguntas.length) pergunta();
      else proximoDesafio(acertos, d.perguntas.length);
    };
  }

  pergunta();
}

// ---------------------------------------------------------------- mecanica: sequencia
function renderSequencia(d) {
  const itens = d.itens.map((texto, i) => ({ texto, i }));
  const embaralhado = shuffle(itens);
  let marcados = [];

  function render() {
    montar(`
      ${cabecalho(d)}
      <p class="ctx">Clique nos itens abaixo, na ordem certa. Cada clique ocupa a próxima posição da trilha.</p>
      <div class="seqrail" id="rail"></div>
      <div class="steps" id="steps"></div>
      <div class="fb" id="fb"></div>
      <div class="actions" id="acoes"><button class="cta" id="btnConferir" ${marcados.length === itens.length ? '' : 'disabled'}>Conferir ordem →</button></div>
    `);
    const rail = document.getElementById('rail');
    for (let i = 0; i < itens.length; i++) {
      const ocupado = i < marcados.length;
      const item = ocupado ? itens[marcados[i]] : null;
      rail.appendChild(el('<div class="seqslot' + (ocupado ? ' filled' : '') + '"><span class="k">' + (i + 1) + '</span>' + (item ? item.texto : '') + '</div>'));
    }
    const steps = document.getElementById('steps');
    embaralhado.forEach((item) => {
      if (marcados.includes(item.i)) return;
      const b = el('<button class="step">' + item.texto + '</button>');
      b.addEventListener('click', () => { marcados.push(item.i); render(); });
      steps.appendChild(b);
    });
    const btnConferir = document.getElementById('btnConferir');
    if (btnConferir && !btnConferir.disabled) btnConferir.addEventListener('click', conferir);
  }

  function conferir() {
    const acertou = marcados.every((v, i) => v === i);
    const fb = document.getElementById('fb');
    fb.className = 'fb show ' + (acertou ? 'ok' : 'err');
    fb.innerHTML = '<b>' + (acertou ? 'Ordem certa' : 'Não foi essa ordem') + '</b>' +
      (acertou ? (d.feedbackOk || 'Muito bem.') : (d.feedbackErro || 'A ordem certa era: ' + itens.map((x) => x.texto).join(' → ')));
    if (!acertou) {
      document.getElementById('rail').classList.add('shake');
    }
    document.getElementById('acoes').innerHTML = '<button class="cta" id="btnContinuarSeq">Continuar →</button>';
    document.getElementById('btnContinuarSeq').addEventListener('click', () => proximoDesafio(acertou ? 1 : 0, 1));
  }

  render();
}

// ---------------------------------------------------------------- mecanica: pareamento
function renderPareamento(d) {
  const esquerda = d.pares.map((p, i) => ({ texto: p.a, i }));
  const direita = shuffle(d.pares.map((p, i) => ({ texto: p.b, i })));
  let selecionadoEsq = null;
  let resolvidos = [];
  let acertos = 0;
  let erros = 0;

  function render() {
    montar(`
      ${cabecalho(d)}
      <div class="grid g2">
        <div class="panel" style="margin-top:0"><p class="qprog">${d.colunaA || 'Coluna A'}</p><div class="dlist" id="colEsq"></div></div>
        <div class="panel" style="margin-top:0"><p class="qprog">${d.colunaB || 'Coluna B'}</p><div class="dlist" id="colDir"></div></div>
      </div>
    `);
    const colEsq = document.getElementById('colEsq');
    esquerda.forEach((item) => {
      const jaResolvido = resolvidos.includes(item.i);
      const b = el('<button class="dec' + (jaResolvido ? ' right' : (selecionadoEsq === item.i ? ' on' : '')) + '" data-i="' + item.i + '"' + (jaResolvido ? ' disabled' : '') + '>' + item.texto + '</button>');
      if (!jaResolvido) b.addEventListener('click', () => { selecionadoEsq = item.i; render(); });
      colEsq.appendChild(b);
    });
    const colDir = document.getElementById('colDir');
    direita.forEach((item) => {
      const jaResolvido = resolvidos.includes(item.i);
      const b = el('<button class="dec' + (jaResolvido ? ' right' : '') + '" data-i="' + item.i + '"' + (jaResolvido ? ' disabled' : '') + '>' + item.texto + '</button>');
      if (!jaResolvido) {
        b.addEventListener('click', () => {
          if (selecionadoEsq === null) return;
          if (selecionadoEsq === item.i) {
            acertos++;
            resolvidos.push(item.i);
            selecionadoEsq = null;
            render();
            if (resolvidos.length === esquerda.length) {
              setTimeout(() => proximoDesafio(acertos, acertos + erros), 500);
            }
          } else {
            erros++;
            b.classList.add('wrong', 'shake');
            setTimeout(() => { b.classList.remove('wrong', 'shake'); }, 450);
          }
        });
      }
      colDir.appendChild(b);
    });
  }

  render();
}

// ---------------------------------------------------------------- mecanica: categorizar
function renderCategorizar(d) {
  let atual = 0;
  let acertos = 0;

  function render() {
    const item = d.itens[atual];
    montar(`
      ${cabecalho(d)}
      <p class="qprog">Item ${atual + 1} de ${d.itens.length}</p>
      <div class="ctx">"${item.texto}"</div>
      <div class="chips" id="cats"></div>
      <div class="fb" id="fb"></div>
      <div class="actions" id="acoes" style="display:none"><button class="cta" id="btnProx">Continuar →</button></div>
    `);
    const cats = document.getElementById('cats');
    d.categorias.forEach((cat) => {
      const b = el('<button class="chip">' + cat + '</button>');
      b.addEventListener('click', () => responder(cat, b));
      cats.appendChild(b);
    });
  }

  function responder(cat, botao) {
    const item = d.itens[atual];
    const acertou = cat === item.categoria;
    if (acertou) acertos++;
    document.querySelectorAll('#cats .chip').forEach((b) => { b.disabled = true; });
    botao.classList.add(acertou ? 'right' : 'wrong');
    if (!acertou) {
      const certo = Array.from(document.querySelectorAll('#cats .chip')).find((b) => b.textContent.trim() === item.categoria);
      if (certo) certo.classList.add('right');
    }
    const fb = document.getElementById('fb');
    fb.className = 'fb show ' + (acertou ? 'ok' : 'err');
    fb.innerHTML = '<b>' + (acertou ? 'Certo' : 'Era ' + item.categoria) + '</b>' + (item.explicacao || '');
    document.getElementById('acoes').style.display = 'flex';
    document.getElementById('btnProx').onclick = () => {
      atual++;
      if (atual < d.itens.length) render();
      else proximoDesafio(acertos, d.itens.length);
    };
  }

  render();
}

// ---------------------------------------------------------------- tela final
function telaFinal() {
  const totalAcertos = S.resultados.reduce((s, r) => s + r.acertos, 0);
  const totalPerguntas = S.resultados.reduce((s, r) => s + r.total, 0);
  const pct = totalPerguntas ? Math.round((totalAcertos / totalPerguntas) * 100) : 0;
  const estrelas = pct >= 90 ? 3 : pct >= 60 ? 2 : 1;

  montar(`
    <div class="kicker warm">${CONTEUDO.disciplina || 'Engenharia de Requisitos'} · Aula ${CONTEUDO.aula}</div>
    <h2 class="big">Resultado de ${S.nome.split(' ')[0]}</h2>
    <div class="panel">
      <div class="counter">${pct}%</div>
      <p class="stars">${'★'.repeat(estrelas)}${'☆'.repeat(3 - estrelas)}</p>
      <p class="narr" style="margin-top:6px">${totalAcertos} de ${totalPerguntas} respostas corretas.</p>
      <div class="summary">
        ${S.resultados.map((r) => '<div class="row"><span>' + r.titulo + '</span><b>' + r.acertos + '/' + r.total + '</b></div>').join('')}
      </div>
    </div>
    <div class="seal">✓ Revisão concluída</div>
    <p class="hint" id="statusEnvio">Enviando resultado…</p>
    <div class="actions">
      <button class="cta" id="btnJogarDeNovo">Jogar de novo →</button>
      <button class="ghost" id="btnVoltarHub">Voltar para os jogos</button>
    </div>
    <div class="noteflag"><b>Nota</b>Mostre esta tela pro professor se ele pedir confirmação.</div>
  `);

  document.getElementById('btnJogarDeNovo').addEventListener('click', () => {
    S.idx = 0;
    S.resultados = [];
    telaIntro();
  });
  document.getElementById('btnVoltarHub').addEventListener('click', () => {
    window.location.href = 'jogos-revisao.html';
  });

  enviarResultado({
    nome: S.nome,
    matricula: S.matricula,
    aula: CONTEUDO.aula,
    disciplina: CONTEUDO.disciplina || 'Engenharia de Requisitos',
    acertos: totalAcertos,
    total: totalPerguntas,
    pontuacao: pct,
    timestamp: new Date().toISOString(),
  });
}

function enviarResultado(dados) {
  const status = document.getElementById('statusEnvio');
  if (!WEBAPP_URL) {
    status.textContent = 'Resultado registrado só nesta tela (envio automático ainda não configurado).';
    return;
  }
  fetch(WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(dados),
  }).then(() => {
    status.textContent = 'Resultado enviado.';
  }).catch(() => {
    status.textContent = 'Não consegui enviar o resultado agora — mostre esta tela pro professor.';
  });
}

telaIdentificacao();
