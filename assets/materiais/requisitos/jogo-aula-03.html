<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Quem decide o que o sistema precisa fazer — revisão — revisão</title>
<style>
  :root {
    --night: #0e1a1f;
    --deep: #15242b;
    --panel: #1c2f37;
    --panel-l: #24383f;
    --ink: #e7e2d8;
    --muted: #8a938f;
    --muted-2: #6b7370;
    --signal: #5fb8a8;
    --stage: #c04a6e;
    --stage-l: #e087a4;
    --good: #6bbf6b;
    --good-bg: #1f3324;
    --bad: #e07a7a;
    --bad-bg: #35201f;
    --border: #33454b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--night);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 20px 60px;
  }
  h1, h2, h3 { font-weight: 600; margin: 0 0 8px; color: #fff; }
  h1 { font-size: 22px; }
  h2 { font-size: 19px; }
  h3 { font-size: 16px; }
  p { line-height: 1.55; color: var(--ink); }
  .kicker {
    font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--signal); font-weight: 700; margin-bottom: 6px;
  }
  .muted { color: var(--muted); font-size: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin: 16px 0;
  }
  input[type=text] {
    width: 100%; background: var(--deep); border: 1px solid var(--border);
    color: #fff; padding: 11px 12px; border-radius: 8px; font-size: 15px;
    margin-bottom: 14px;
  }
  input[type=text]:focus { outline: none; border-color: var(--signal); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; padding: 12px 18px;
  }
  .btn-primary { background: var(--stage); color: #fff; width: 100%; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-ghost {
    background: transparent; color: var(--ink); border: 1px solid var(--border);
    width: 100%;
  }
  .erro { color: var(--bad); font-size: 13px; margin: -6px 0 14px; display: none; }
  .erro.show { display: block; }
  .progresso {
    display: flex; gap: 4px; margin-bottom: 20px;
  }
  .progresso .seg {
    flex: 1; height: 4px; border-radius: 2px; background: var(--border);
  }
  .progresso .seg.done { background: var(--signal); }
  .progresso .seg.atual { background: var(--stage); }
  .opcao {
    display: block; width: 100%; text-align: left; background: var(--panel-l);
    color: var(--ink); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 16px; margin-bottom: 10px; font-size: 14.5px; font-weight: 500;
    transition: none;
  }
  .opcao:active { transform: scale(0.99); }
  .opcao.correta { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .opcao.errada { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .opcao.desabilitada { pointer-events: none; opacity: 0.55; }
  .opcao.selecionavel-ativa { border-color: var(--signal); background: #1e3236; }
  .excerto {
    background: var(--night); border-left: 3px solid var(--stage); border-radius: 4px;
    padding: 14px 16px; margin-bottom: 16px; font-style: italic; color: #d9d4c8;
  }
  .feedback {
    border-radius: 10px; padding: 14px 16px; margin: 14px 0; font-size: 14px; line-height: 1.5;
  }
  .feedback.ok { background: var(--good-bg); color: var(--good); }
  .feedback.no { background: var(--bad-bg); color: var(--bad); }
  .duas-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .duas-colunas { grid-template-columns: 1fr; } }
  .col-titulo { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .item-clicavel {
    background: var(--panel-l); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; font-size: 13.5px; cursor: pointer;
  }
  .item-clicavel.selecionado { border-color: var(--signal); background: #1e3236; }
  .item-clicavel.pareado-ok { border-color: var(--good); background: var(--good-bg); color: var(--good); pointer-events: none; }
  .item-clicavel.pareado-erro { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
  .seq-lista { list-style: none; margin: 0; padding: 0; }
  .seq-item {
    background: var(--panel-l); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px; font-size: 14px; display: flex; align-items: center; gap: 10px;
    cursor: pointer;
  }
  .seq-item .num {
    width: 24px; height: 24px; border-radius: 50%; background: var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    flex-shrink: 0;
  }
  .seq-item.marcado .num { background: var(--stage); color: #fff; }
  .cat-botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .cat-botao {
    flex: 1; min-width: 100px; background: var(--panel-l); border: 1px solid var(--border);
    color: var(--ink); border-radius: 8px; padding: 12px 10px; font-size: 13px; font-weight: 600;
  }
  .estrela { font-size: 22px; }
  .resultado-linha {
    display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .resultado-linha:last-child { border-bottom: none; }
  .rodape-nota { font-size: 12px; color: var(--muted-2); text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const CONTEUDO = {"aula":3,"disciplina":"Engenharia de Requisitos","titulo":"Quem decide o que o sistema precisa fazer — revisão","introducao":"O processo de Engenharia de Requisitos, o modelo cebola, a matriz poder e interesse, e o caso do National Programme for IT.","desafios":[{"tipo":"sequencia","titulo":"As cinco atividades do processo","instrucao":"Clique nas atividades na ordem em que elas acontecem.","itens":["Elicitação — descobrir, com as pessoas envolvidas, o que o sistema precisa fazer e por quê","Análise — organizar, classificar, achar conflito entre interessados, negociar e priorizar","Especificação — escrever de forma não ambígua e verificável, no nível certo","Validação — confirmar com quem pediu que o escrito descreve a necessidade real","Gerência — controlar mudança: linha de base, análise de impacto, rastreabilidade"],"feedbackOk":"É essa a ordem. As quatro primeiras produzem o requisito — a quinta cuida dele pelo resto da vida do sistema, e é a que mais gente esquece que existe."},{"tipo":"pareamento","titulo":"O modelo cebola: papel e anel","instrucao":"Toque num papel e depois no anel onde ele vive.","colunaA":"Papel","colunaB":"Anel do modelo cebola","pares":[{"a":"Operador normal — quem opera o sistema no dia a dia","b":"Nosso sistema"},{"a":"Suporte operacional — mesa de ajuda e treinamento","b":"Nosso sistema"},{"a":"Comprador e patrocinador — quem paga e defende o projeto","b":"Sistema contenedor"},{"a":"Regulador — lei, norma, auditoria","b":"Ambiente amplo"},{"a":"Parte interessada negativa — quem perde se o sistema funcionar","b":"Ambiente amplo"}]},{"tipo":"mcq","titulo":"A matriz poder e interesse","instrucao":"Dado o poder e o interesse de cada interessado, qual o quadrante certo?","perguntas":[{"enunciado":"Diretoria: alto poder, baixo interesse. Qual quadrante?","opcoes":["Gerir de perto","Manter satisfeito","Manter informado","Apenas monitorar"],"correta":1,"explicacao":"Tem poder de derrubar o projeto, mas não acompanha o dia a dia. Informe no ritmo dela — um diretor surpreendido é um projeto parado."},{"enunciado":"Secretaria acadêmica: poder médio, alto interesse. Qual quadrante?","opcoes":["Gerir de perto","Manter satisfeito","Manter informado","Apenas monitorar"],"correta":2,"explicacao":"No caso real, essa linha reunia poder, legitimidade e urgência — era definitiva na saliência, mesmo caindo em \"manter informado\" na matriz."},{"enunciado":"Estudante: baixo poder, alto interesse. Qual quadrante?","opcoes":["Gerir de perto","Manter satisfeito","Manter informado","Apenas monitorar"],"correta":2,"explicacao":"Interesse alto, pouco poder formal. Ignorá-lo não derruba o projeto no papel — derruba na adoção."},{"enunciado":"Patrocinador do projeto: alto poder, alto interesse. Qual quadrante?","opcoes":["Gerir de perto","Manter satisfeito","Manter informado","Apenas monitorar"],"correta":0,"explicacao":"Reunião frequente, participação nas decisões, validação direta — é onde o patrocinador precisa estar."},{"enunciado":"Fornecedor de papel do escritório: baixo poder, baixo interesse. Qual quadrante?","opcoes":["Gerir de perto","Manter satisfeito","Manter informado","Apenas monitorar"],"correta":3,"explicacao":"Pouco de ambos. Revisite de vez em quando: poder e interesse mudam com o tempo."}]},{"tipo":"defeito","titulo":"O caso National Programme for IT","instrucao":"Um programa de saúde do Reino Unido, £9,8 bilhões, desmontado em 2011. Qual conceito da aula explica cada falha?","casos":[{"trecho":"O programa foi desenhado centralmente e imposto aos hospitais.","pergunta":"Qual conceito explica essa falha?","opcoes":["Requisitos levantados só no anel de fora (sistema contenedor), sem o anel de \"nosso sistema\"","Falta de patrocinador para o projeto","Requisito não verificável","Falta de regra de negócio escrita"],"correta":0,"explicacao":"Os requisitos vieram de gestores e ministério — quase nada dos operadores normais: médicos e enfermeiros."},{"trecho":"Cada hospital trabalhava de um jeito diferente, mas o sistema tratava todos como iguais.","pergunta":"Qual conceito explica essa falha?","opcoes":["Uma única classe de usuário foi assumida para centenas de classes reais diferentes","O documento não tinha rastreabilidade","Faltou gerência de mudanças","O requisito era ambíguo"],"correta":0,"explicacao":"Os requisitos de parte interessada foram tratados como se houvesse uma única classe de usuário para todo o país."},{"trecho":"Os clínicos resistiram à adoção do sistema.","pergunta":"Qual conceito explica essa falha?","opcoes":["Legitimidade e urgência altas, poder formal baixo — foram informados, não envolvidos","Eles não tinham nenhum interesse no sistema","Faltou treinamento técnico apenas","O sistema tinha bugs de programação"],"correta":0,"explicacao":"Profissionais com legitimidade e urgência altas caem em \"manter informado\" na matriz. Informar não é envolver — e sem eles não havia validação possível."},{"trecho":"O sistema entregue não era o sistema necessário, mesmo funcionando exatamente como especificado.","pergunta":"Qual conceito explica essa falha?","opcoes":["Verificação passou, mas validação falhou — a especificação não descrevia a necessidade real","O sistema tinha requisitos não funcionais mal escritos","Faltou um requisito de segurança","O prazo do projeto era curto demais"],"correta":0,"explicacao":"Verificação pergunta se construímos do jeito certo. Validação pergunta se construímos a coisa certa. Só a segunda depende de ter falado com as pessoas certas."}]}]};
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzyVDcweu9eO6c8CztBCIj8y6hj1MXWVpWr0aFmXn_jrE3AYJC-BG7gc3OnsYiz6gbY/exec";

const S = {
  nome: localStorage.getItem('jogoReq_nome') || '',
  matricula: localStorage.getItem('jogoReq_matricula') || '',
  idx: 0,
  resultados: [],
};

function el(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.firstElementChild;
}

function montar(html) {
  document.getElementById('app').innerHTML = html;
}

function progresso(atual, total) {
  let segs = '';
  for (let i = 0; i < total; i++) {
    let cls = 'seg';
    if (i < atual) cls += ' done';
    else if (i === atual) cls += ' atual';
    segs += '<div class="' + cls + '"></div>';
  }
  return '<div class="progresso">' + segs + '</div>';
}

// ---------------------------------------------------------------- tela 0: identificacao
function telaIdentificacao() {
  montar(`
    <p class="kicker">${CONTEUDO.disciplina || 'Engenharia de Requisitos'} · Aula ${CONTEUDO.aula}</p>
    <h1>Antes de começar</h1>
    <p class="muted">Digite seu nome e sua matrícula (ou turma) pra eu saber quem jogou. Não precisa de senha.</p>
    <div class="card">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" value="${S.nome}" placeholder="Ana Beatriz Souza" />
      <label for="mat">Matrícula ou turma</label>
      <input type="text" id="mat" value="${S.matricula}" placeholder="ADS2026208 ou Turma A" />
      <p class="erro" id="erroId">Preencha os dois campos antes de começar.</p>
      <button class="btn-primary" id="btnComecar">Começar a revisão</button>
    </div>
  `);
  document.getElementById('btnComecar').addEventListener('click', () => {
    const nome = document.getElementById('nome').value.trim();
    const mat = document.getElementById('mat').value.trim();
    const err = document.getElementById('erroId');
    if (!nome || !mat) {
      err.classList.add('show');
      return;
    }
    err.classList.remove('show');
    S.nome = nome;
    S.matricula = mat;
    localStorage.setItem('jogoReq_nome', nome);
    localStorage.setItem('jogoReq_matricula', mat);
    telaIntro();
  });
}

// ---------------------------------------------------------------- tela 1: intro da aula
function telaIntro() {
  montar(`
    <p class="kicker">${CONTEUDO.disciplina || 'Engenharia de Requisitos'} · Aula ${CONTEUDO.aula}</p>
    <h1>${CONTEUDO.titulo}</h1>
    <p>${CONTEUDO.introducao || ''}</p>
    <div class="card">
      <p class="col-titulo">Nesta revisão</p>
      ${CONTEUDO.desafios.map((d, i) => '<p style="margin:4px 0;font-size:14px">' + (i + 1) + '. ' + d.titulo + '</p>').join('')}
    </div>

    S.idx = 0;
    S.resultados = [];

  });
}

// ---------------------------------------------------------------- roteador de desafios
function abrirDesafio(i) {
  if (i >= CONTEUDO.desafios.length) { telaFinal(); return; }
  S.idx = i;
  const d = CONTEUDO.desafios[i];
  if (d.tipo === 'mcq') renderMCQ(d);
  else if (d.tipo === 'defeito') renderDefeito(d);
  else if (d.tipo === 'sequencia') renderSequencia(d);
  else if (d.tipo === 'pareamento') renderPareamento(d);
  else if (d.tipo === 'categorizar') renderCategorizar(d);
}

function proximoDesafio(acertos, total) {
  S.resultados.push({ titulo: CONTEUDO.desafios[S.idx].titulo, acertos, total });
  abrirDesafio(S.idx + 1);
}

function cabecalho(d) {
  return `
    ${progresso(S.idx, CONTEUDO.desafios.length)}
    <p class="kicker">Desafio ${S.idx + 1} de ${CONTEUDO.desafios.length}</p>
    <h2>${d.titulo}</h2>
    ${d.instrucao ? '<p class="muted">' + d.instrucao + '</p>' : ''}
  `;
}

// ---------------------------------------------------------------- mecanica: MCQ rapido
function renderMCQ(d) {
  let atual = 0;
  let acertos = 0;

  function pergunta() {
    const p = d.perguntas[atual];
    montar(`
      ${cabecalho(d)}
      <div class="card">
        <p style="margin-top:0;font-weight:600">${p.enunciado}</p>
        <div id="opcoes"></div>
        <div id="fb"></div>
        <button class="btn-primary" id="btnProx" style="display:none;margin-top:10px">Continuar</button>
      </div>
    `);
    const cont = document.getElementById('opcoes');
    p.opcoes.forEach((op, i) => {
      const b = el('<button class="opcao">' + op + '</button>');
      b.addEventListener('click', () => responder(i));
      cont.appendChild(b);
    });
  }

  function responder(i) {
    const p = d.perguntas[atual];
    const botoes = document.querySelectorAll('#opcoes .opcao');
    botoes.forEach((b, j) => {
      b.classList.add('desabilitada');
      if (j === p.correta) b.classList.add('correta');
      else if (j === i) b.classList.add('errada');
    });
    const acertou = i === p.correta;
    if (acertou) acertos++;
    if (p.explicacao) {
      document.getElementById('fb').innerHTML =
        '<div class="feedback ' + (acertou ? 'ok' : 'no') + '">' + p.explicacao + '</div>';
    }
    document.getElementById('btnProx').style.display = 'block';
    document.getElementById('btnProx').onclick = () => {
      atual++;
      if (atual < d.perguntas.length) pergunta();
      else proximoDesafio(acertos, d.perguntas.length);
    };
  }

  pergunta();
}

// ---------------------------------------------------------------- mecanica: defeito em trecho
// (mesma logica do MCQ, layout com o trecho em destaque)
function renderDefeito(d) {
  let atual = 0;
  let acertos = 0;

  function pergunta() {
    const p = d.casos[atual];
    montar(`
      ${cabecalho(d)}

      </div>
    `);
    const cont = document.getElementById('opcoes');

      const b = el('<button class="opcao">' + op + '</button>');
      b.addEventListener('click', () => responder(i));
      cont.appendChild(b);
    });
  }

  function responder(i) {
    const p = d.casos[atual];
    const botoes = document.querySelectorAll('#opcoes .opcao');
    botoes.forEach((b, j) => {
      b.classList.add('desabilitada');
      if (j === p.correta) b.classList.add('correta');
      else if (j === i) b.classList.add('errada');
    });
    const acertou = i === p.correta;
    if (acertou) acertos++;
    if (p.explicacao) {
      document.getElementById('fb').innerHTML =
        '<div class="feedback ' + (acertou ? 'ok' : 'no') + '">' + p.explicacao + '</div>';

    document.getElementById('btnProx').style.display = 'block';
    document.getElementById('btnProx').onclick = () => {

      if (atual < d.casos.length) pergunta();
      else proximoDesafio(acertos, d.casos.length);

}

// ---------------------------------------------------------------- mecanica: sequencia
function renderSequencia(d) {
  const itens = d.itens.map((texto, i) => ({ texto, i }));
  const embaralhado = [...itens].sort(() => Math.random() - 0.5);
  let marcados = [];

  function render() {
    montar(`
      ${cabecalho(d)}
      <div class="card">
        <p class="muted">Clique nos itens na ordem certa.</p>
        <ul class="seq-lista" id="lista"></ul>
        <div id="fb"></div>
        <button class="btn-primary" id="btnConferir" ${marcados.length === itens.length ? '' : 'disabled'}>Conferir ordem</button>
      </div>
    `);
    const lista = document.getElementById('lista');
    embaralhado.forEach((item) => {
      const posMarcada = marcados.indexOf(item.i);
      const li = el('<li class="seq-item' + (posMarcada > -1 ? ' marcado' : '') + '"><span class="num">' + (posMarcada > -1 ? (posMarcada + 1) : '') + '</span><span>' + item.texto + '</span></li>');
      li.addEventListener('click', () => {
        if (marcados.includes(item.i)) return;
        marcados.push(item.i);
        render();
      });
      lista.appendChild(li);
    });
    document.getElementById('btnConferir').addEventListener('click', conferir);
  }

  function conferir() {
    const acertou = marcados.every((v, i) => v === i);
    document.getElementById('fb').innerHTML =
      '<div class="feedback ' + (acertou ? 'ok' : 'no') + '">' +
      (acertou ? (d.feedbackOk || 'Ordem correta.') : (d.feedbackErro || 'Não foi essa a ordem. A ordem certa era: ' + itens.map(x => x.texto).join(' → '))) +
      '</div>';
    document.getElementById('btnConferir').style.display = 'none';
    const btn = el('<button class="btn-primary" style="margin-top:10px">Continuar</button>');
    btn.addEventListener('click', () => proximoDesafio(acertou ? 1 : 0, 1));
    document.getElementById('fb').after(btn);
  }

  render();
}

// ---------------------------------------------------------------- mecanica: pareamento
function renderPareamento(d) {
  const esquerda = d.pares.map((p, i) => ({ texto: p.a, i }));
  const direita = [...d.pares.map((p, i) => ({ texto: p.b, i }))].sort(() => Math.random() - 0.5);
  let selecionadoEsq = null;
  let resolvidos = [];
  let acertos = 0;
  let erros = 0;

  function render() {
    montar(`
      ${cabecalho(d)}
      <div class="card">
        <div class="duas-colunas">
          <div>
            <p class="col-titulo">${d.colunaA || 'A'}</p>
            <div id="colEsq"></div>
          </div>
          <div>
            <p class="col-titulo">${d.colunaB || 'B'}</p>
            <div id="colDir"></div>
          </div>
        </div>
      </div>
    `);
    const colEsq = document.getElementById('colEsq');
    esquerda.forEach((item) => {
      const jaResolvido = resolvidos.includes(item.i);
      const div = el('<div class="item-clicavel' + (jaResolvido ? ' pareado-ok' : (selecionadoEsq === item.i ? ' selecionado' : '')) + '">' + item.texto + '</div>');
      if (!jaResolvido) {
        div.addEventListener('click', () => { selecionadoEsq = item.i; render(); });
      }
      colEsq.appendChild(div);
    });
    const colDir = document.getElementById('colDir');
    direita.forEach((item) => {
      const jaResolvido = resolvidos.includes(item.i);
      const div = el('<div class="item-clicavel' + (jaResolvido ? ' pareado-ok' : '') + '">' + item.texto + '</div>');
      if (!jaResolvido) {
        div.addEventListener('click', () => {
          if (selecionadoEsq === null) return;
          if (selecionadoEsq === item.i) {
            acertos++;
            resolvidos.push(item.i);
            selecionadoEsq = null;
            render();
          } else {
            erros++;
            div.classList.add('pareado-erro');
            setTimeout(() => { div.classList.remove('pareado-erro'); }, 500);
          }
          if (resolvidos.length === esquerda.length) {
            setTimeout(() => proximoDesafio(acertos, acertos + erros), 500);
          }
        });
      }
      colDir.appendChild(div);
    });
  }

  render();
}

// ---------------------------------------------------------------- mecanica: categorizar
function renderCategorizar(d) {
  let atual = 0;
  let acertos = 0;

  function render() {
    const item = d.itens[atual];
    montar(`
      ${cabecalho(d)}
      <div class="card">
        <p style="margin-top:0;font-weight:600">"${item.texto}"</p>
        <div class="cat-botoes" id="cats"></div>
        <div id="fb"></div>
        <button class="btn-primary" id="btnProx" style="display:none;margin-top:10px">Continuar</button>
      </div>
    `);
    const cats = document.getElementById('cats');
    d.categorias.forEach((cat) => {
      const b = el('<button class="cat-botao">' + cat + '</button>');
      b.addEventListener('click', () => responder(cat));
      cats.appendChild(b);
    });
  }

  function responder(cat) {
    const item = d.itens[atual];
    const acertou = cat === item.categoria;
    if (acertou) acertos++;
    document.querySelectorAll('#cats .cat-botao').forEach((b) => { b.disabled = true; });
    document.getElementById('fb').innerHTML =
      '<div class="feedback ' + (acertou ? 'ok' : 'no') + '">' +
      (acertou ? 'Certo — é ' + item.categoria + '.' : 'Era ' + item.categoria + '.') +
      (item.explicacao ? ' ' + item.explicacao : '') +
      '</div>';
    document.getElementById('btnProx').style.display = 'block';
    document.getElementById('btnProx').onclick = () => {
      atual++;
      if (atual < d.itens.length) render();
      else proximoDesafio(acertos, d.itens.length);
    };
  }

  render();
}

// ---------------------------------------------------------------- tela final
function telaFinal() {
  const totalAcertos = S.resultados.reduce((s, r) => s + r.acertos, 0);
  const totalPerguntas = S.resultados.reduce((s, r) => s + r.total, 0);
  const pct = totalPerguntas ? Math.round((totalAcertos / totalPerguntas) * 100) : 0;
  const estrelas = pct >= 90 ? 3 : pct >= 60 ? 2 : 1;

  montar(`
    <p class="kicker">${CONTEUDO.disciplina || 'Engenharia de Requisitos'} · Aula ${CONTEUDO.aula}</p>
    <h1>Resultado de ${S.nome.split(' ')[0]}</h1>
    <div class="card">
      <p class="estrela">${'★'.repeat(estrelas)}${'☆'.repeat(3 - estrelas)}</p>
      <p style="font-size:15px;color:var(--muted)">${totalAcertos} de ${totalPerguntas} corretas (${pct}%)</p>
      ${S.resultados.map(r => '<div class="resultado-linha"><span>' + r.titulo + '</span><span>' + r.acertos + '/' + r.total + '</span></div>').join('')}
    </div>
    <div id="statusEnvio" class="muted" style="text-align:center">Enviando resultado…</div>
    <p class="rodape-nota">Mostre esta tela pro professor se ele pedir confirmação.</p>
    <button class="btn-primary" id="btnJogarDeNovo" style="margin-top:18px">Jogar de novo</button>
    <button class="btn-ghost" id="btnVoltarHub" style="margin-top:10px">Voltar para os jogos</button>
  `);

  document.getElementById('btnJogarDeNovo').addEventListener('click', () => {
    S.idx = 0;
    S.resultados = [];
    telaIntro();
  });
  document.getElementById('btnVoltarHub').addEventListener('click', () => {
    window.location.href = 'jogos-revisao.html';
  });

  enviarResultado({
    nome: S.nome,
    matricula: S.matricula,
    aula: CONTEUDO.aula,
    disciplina: CONTEUDO.disciplina || 'Engenharia de Requisitos',
    acertos: totalAcertos,
    total: totalPerguntas,
    pontuacao: pct,
    timestamp: new Date().toISOString(),
  });
}

function enviarResultado(dados) {
  const status = document.getElementById('statusEnvio');
  if (!WEBAPP_URL) {
    status.textContent = 'Resultado registrado só nesta tela (envio automático ainda não configurado).';
    return;
  }
  fetch(WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(dados),
  }).then(() => {
    status.textContent = 'Resultado enviado.';
  }).catch(() => {
    status.textContent = 'Não consegui enviar o resultado agora — mostre esta tela pro professor.';
  });
}

telaIdentificacao();
