  const MENSAGENS = [
    [10.5, 'Bom dia!! Tudo bem? 🌽'],
    [11.4, 'Quero um aplicativo moderno pro São João'],
    [12.3, 'Tipo um iFood do forró, sabe?'],
    [13.2, 'Rápido, fácil e bonito'],
    [14.1, 'Pra daqui a 30 dias 🙏🙏'],
  ];
  const EQUIPE = ['zuleide', 'davi', 'katia', null, 'iara', 'romulo', 'icaro'];
  const CORES = ['#F1C40F', '#E74C3C', '#2F80ED'];

  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function cubo(cx, cy, u, sep) {
    sep = sep || 0;
    const f = (pts, cor, dx, dy) => { ctx.fillStyle = cor; ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(cx + x * u + dx, cy + y * u + dy) : ctx.moveTo(cx + x * u + dx, cy + y * u + dy))); ctx.closePath(); ctx.fill(); };
    f([[0, -1], [1, -.5], [0, 0], [-1, -.5]], CORES[0], 0, -sep * 60);
    f([[-1, -.5], [0, 0], [0, 1], [-1, .5]], CORES[1], -sep * 60, sep * 30);
    f([[1, -.5], [0, 0], [0, 1], [1, .5]], CORES[2], sep * 60, sep * 30);
  }

  /* ---------- cena 1 e 2: a cidade amanhecendo e o zoom no prédio ---------- */
  function cidade(t) {
    const k = ease(lim(t / 9));
    const g = ctx.createLinearGradient(0, BARRA, 0, VH - BARRA);
    g.addColorStop(0, mix('#050C1A', '#2A4A73', k)); g.addColorStop(.62, mix('#0F213B', '#C77B4A', k)); g.addColorStop(1, mix('#1A2C48', '#F2A65A', k));
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    estrelas.forEach((s) => { ctx.globalAlpha = (1 - k) * (.5 + .5 * Math.sin(t * 2 + s.f)); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    const sy = 700 - k * 260; const sol = ctx.createRadialGradient(1180, sy, 10, 1180, sy, 170);
    sol.addColorStop(0, 'rgba(255,226,150,.95)'); sol.addColorStop(.35, 'rgba(255,200,120,.45)'); sol.addColorStop(1, 'rgba(255,180,100,0)');
    ctx.fillStyle = sol; ctx.fillRect(900, sy - 200, 560, 400);
    for (let i = 0; i < 3; i++) { const nx = ((i * 520 + t * (14 + i * 6)) % (VW + 400)) - 200, ny = 170 + i * 70; ctx.fillStyle = `rgba(255,255,255,${.08 + k * .25})`; [[0, 0, 60], [50, -16, 46], [96, 0, 52]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.ellipse(nx + dx, ny + dy, r, r * .42, 0, 0, 7); ctx.fill(); }); }
    const base = VH - BARRA;
    longe.forEach((b) => { ctx.fillStyle = mix('#0D1B2E', '#5C4B63', k * .8); ctx.fillRect(b.x, base - b.h, b.w, b.h); });
    const acesas = .12 + k * .45;
    perto.forEach((b, bi) => {
      ctx.fillStyle = mix('#08111F', '#3B2F45', k * .7); ctx.fillRect(b.x, base - b.h, b.w, b.h);
      for (let yy = base - b.h + 14; yy < base - 16; yy += 26) for (let xx = b.x + 10; xx < b.x + b.w - 14; xx += 20)
        if (hash(xx, yy, bi) < acesas) { ctx.fillStyle = 'rgba(255,214,140,.85)'; ctx.fillRect(xx, yy, 9, 12); }
    });
    // bandeirolas entre os prédios e fogos de São João
    const coresB = ['#E74C3C', '#F1C40F', '#2F80ED', '#27AE60', '#E67E22'];
    [[0, 520, 600], [1000, 1600, 560]].forEach(([x0, x1, yb], fi) => {
      ctx.strokeStyle = 'rgba(30,20,10,.6)'; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let k = 0; k <= 30; k++) { const x = x0 + (x1 - x0) * k / 30, y = yb + Math.sin(k / 30 * Math.PI) * 40; if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y); } ctx.stroke();
      for (let k = 0; k < 22; k++) { const x = x0 + (x1 - x0) * (k + .5) / 22, y = yb + Math.sin((k + .5) / 22 * Math.PI) * 40, b = Math.sin(t * 2 + k) * 2;
        ctx.fillStyle = coresB[(k + fi) % 5]; ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y); ctx.lineTo(x + b, y + 18); ctx.closePath(); ctx.fill(); }
    });
    for (let f = 0; f < 4; f++) {
      const ini = 1.5 + f * 1.1, ph = ((t - ini) % 4.4) / 1.3; if (t < ini || ph > 1) continue;
      const fx = 220 + f * 360 + (f % 2) * 60, fy = 200 + (f % 3) * 50, r = 20 + ph * 90;
      for (let r2 = 0; r2 < 14; r2++) { const a = r2 / 14 * Math.PI * 2; ctx.fillStyle = `rgba(${['255,210,90', '255,120,90', '120,200,255', '140,255,160'][f]},${(1 - ph).toFixed(2)})`; ctx.beginPath(); ctx.arc(fx + Math.cos(a) * r, fy + Math.sin(a) * r + ph * 20, 3, 0, 7); ctx.fill(); }
    }
    // o prédio da Xaxado
    const P = PREDIO, topo = base - P.h;
    ctx.fillStyle = mix('#0E2238', '#24405E', k); ctx.fillRect(P.x, topo, P.w, P.h);
    ctx.fillStyle = mix('#0A1A2C', '#1A3048', k); ctx.fillRect(P.x + P.w - 26, topo, 26, P.h);
    for (let yy = topo + 70; yy < base - 20; yy += 34) for (let xx = P.x + 16; xx < P.x + P.w - 40; xx += 30) {
      const liga = 1.2 + hash(xx, yy, 99) * 7;
      ctx.fillStyle = t > liga ? 'rgba(130,220,255,.85)' : 'rgba(40,60,90,.9)'; ctx.fillRect(xx, yy, 16, 20);
    }
    const acesa = t > 2.6 ? (t < 3.1 ? (Math.sin(t * 60) > 0 ? 1 : .2) : 1) : 0;
    ctx.fillStyle = '#0B1A2C'; rr(P.x + 14, topo - 58, P.w - 28, 48, 8); ctx.fill();
    ctx.globalAlpha = .25 + acesa * .75;
    cubo(P.x + 40, topo - 34, 13);
    ctx.fillStyle = acesa ? '#FFFFFF' : '#5B6B80'; ctx.font = '800 26px Nunito, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    if (acesa) { ctx.shadowColor = '#F1C40F'; ctx.shadowBlur = 18; }
    ctx.fillText('XAXADO', P.x + 62, topo - 33); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  /* ---------- cena 3: a mensagem do cliente ---------- */
  function chamados(t) {
    const g = ctx.createRadialGradient(VW / 2, VH / 2, 60, VW / 2, VH / 2, 900);
    g.addColorStop(0, '#3A2318'); g.addColorStop(1, '#0B0705'); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    const px = 560, py = 110, pw = 480, ph = 680;
    ctx.fillStyle = '#111'; rr(px - 14, py - 14, pw + 28, ph + 28, 46); ctx.fill();
    ctx.fillStyle = '#ECE5DD'; rr(px, py, pw, ph, 34); ctx.fill();
    ctx.fillStyle = '#075E54'; rr(px, py, pw, 92, 34); ctx.fill(); ctx.fillRect(px, py + 60, pw, 32);
    ctx.fillStyle = '#FFDBAC'; ctx.beginPath(); ctx.arc(px + 56, py + 50, 24, 0, 7); ctx.fill();
    ctx.fillStyle = '#BDBDBD'; ctx.beginPath(); ctx.arc(px + 56, py + 38, 18, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 22px Nunito, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('Seu Damião', px + 94, py + 40);
    const digitando = MENSAGENS.some(([ts]) => t > ts - .7 && t < ts);
    ctx.fillStyle = '#B9E3DC'; ctx.font = '700 15px Nunito, sans-serif'; ctx.fillText(digitando ? 'digitando...' : 'Associação do Pátio · online', px + 94, py + 66);
    let y = py + 120;
    MENSAGENS.forEach(([ts, txt], i) => {
      if (t < ts) return;
      if (!tocados['m' + i]) { tocados['m' + i] = 1; Musica.sfx('blip'); }
      const e = ease(lim((t - ts) / .3));
      ctx.font = '700 20px Nunito, sans-serif';
      const w = Math.min(pw - 60, ctx.measureText(txt).width + 36);
      ctx.globalAlpha = e;
      ctx.fillStyle = '#FFFFFF'; rr(px + 20, y + (1 - e) * 20, w, 52, 14); ctx.fill();
      ctx.fillStyle = '#1B1B1B'; ctx.textAlign = 'left'; ctx.fillText(txt, px + 38, y + 24 + (1 - e) * 20, w - 36);
      ctx.fillStyle = '#8A8A8A'; ctx.font = '700 12px Nunito, sans-serif'; ctx.textAlign = 'right'; ctx.fillText('08:0' + i, px + 12 + w, y + 42);
      ctx.globalAlpha = 1; y += 66;
    });
    if (digitando) { for (let k = 0; k < 3; k++) { ctx.fillStyle = '#9E9E9E'; ctx.beginPath(); ctx.arc(px + 44 + k * 16, y + 26 + Math.sin(t * 9 + k) * 3, 5, 0, 7); ctx.fill(); } }
    if (t > 14.6) {
      const a = ease(lim((t - 14.6) / .4));
      ctx.globalAlpha = a; ctx.fillStyle = '#F1C40F'; ctx.font = `900 ${150 + Math.sin(t * 4) * 6}px Nunito, sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('?', 400, 470); ctx.fillText('?', 1210, 380); ctx.font = '900 90px Nunito, sans-serif'; ctx.fillText('?', 1300, 600); ctx.globalAlpha = 1;
    }
  }

  /* ---------- cena 4: a equipe chegando ---------- */
  function equipe(t) {
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, '#0E2238'); g.addColorStop(.62, '#173A5C'); g.addColorStop(.63, '#E9DFCB'); g.addColorStop(1, '#CDBF9F');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = 'rgba(255,255,255,.05)'; for (let x = 0; x < VW; x += 120) ctx.fillRect(x, 0, 2, VH * .62);
    const chao = 640, passo = 200, x0 = 200;
    EQUIPE.forEach((id, k) => {
      const xf = x0 + k * passo;
      if (!id) {
        if (t < 18.8) return;
        const a = ease(lim((t - 18.8) / .6));
        const luz = ctx.createRadialGradient(xf, chao - 90, 10, xf, chao - 40, 200);
        luz.addColorStop(0, `rgba(255,226,150,${(.55 * a).toFixed(2)})`); luz.addColorStop(1, 'rgba(255,226,150,0)');
        ctx.fillStyle = luz; ctx.fillRect(xf - 220, chao - 320, 440, 380);
        ctx.globalAlpha = a; ctx.setLineDash([8, 8]); ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(xf, chao - 112, 26, 30, 0, 0, 7); ctx.stroke(); rr(xf - 38, chao - 78, 76, 82, 18); ctx.stroke();
        ctx.setLineDash([]); ctx.lineWidth = 1;
        ctx.fillStyle = '#FFE066'; ctx.font = `800 ${46 + Math.sin(t * 5) * 4}px Nunito, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', xf, chao - 112);
        ctx.font = '800 20px Nunito, sans-serif'; ctx.fillText('Você', xf, chao + 40); ctx.globalAlpha = 1;
        return;
      }
      const i = k < 3 ? k : k - 1, ini = 15.8 + i * .28, e = lim((t - ini) / 1.7), andando = e > 0 && e < 1;
      const de = k < 3 ? -160 : VW + 160, x = de + (xf - de) * ease(e);
      if (e <= 0) return;
      const n = NPCS[id];
      ctx.save(); ctx.translate(x, chao); ctx.scale(2.3, 2.3);
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 2, 16, 5, 0, 0, 7); ctx.fill();
      drawAvatar(ctx, n.look, andando ? (k < 3 ? 0 : 1) : (k < 3 ? 0 : 1), t * 1.4 + k, andando);
      ctx.restore();
      if (e >= 1) {
        const a = lim((t - ini - 1.7) / .4); ctx.globalAlpha = a;
        ctx.fillStyle = '#0B1A2C'; ctx.font = '800 21px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(n.nome, x, chao + 40);
        ctx.fillStyle = '#5A4A33'; ctx.font = '700 15px Nunito, sans-serif'; ctx.fillText(n.cargo.split(' · ')[0], x, chao + 64);
        ctx.globalAlpha = 1;
      }
    });
  }

  /* ---------- cena 5: título ---------- */
  function titulo(t) {
    const g = ctx.createRadialGradient(VW / 2, VH * .44, 40, VW / 2, VH / 2, 950);
    g.addColorStop(0, '#9B2C1F'); g.addColorStop(.55, '#3E1410'); g.addColorStop(1, '#0B0503'); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    for (let i = 0; i < 26; i++) {
      const px = hash(i, 1, 2) * VW, vel = 18 + hash(i, 3, 4) * 30, py = VH - ((t * vel + hash(i, 5, 6) * VH) % VH);
      ctx.globalAlpha = .15 + hash(i, 7, 8) * .25; cubo(px, py, 5 + hash(i, 9, 1) * 7); ctx.globalAlpha = 1;
    }
    const k = 1 - ease(lim((t - 21.7) / 1.1));
    cubo(VW / 2, 300, 78, k * 4);
    if (!tocados.titulo && t > 22.6) { tocados.titulo = 1; Musica.sfx('sala'); }
    const a = ease(lim((t - 22.6) / .5)), s = .8 + .2 * a;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(VW / 2, 480); ctx.scale(s, s);
    ctx.fillStyle = '#FFFFFF'; ctx.font = '900 96px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(241,196,15,.6)'; ctx.shadowBlur = 30; ctx.fillText('XAXADO SOFTWARE', 0, 0); ctx.shadowBlur = 0; ctx.restore();
    const b = ease(lim((t - 23.1) / .5));
    ctx.globalAlpha = b; ctx.fillStyle = '#F1C40F'; ctx.font = '800 36px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Do pedido vago à matriz de rastreabilidade', VW / 2, 572);
    ctx.fillStyle = '#F5D9C8'; ctx.font = '700 22px Nunito, sans-serif'; ctx.fillText('Engenharia de Requisitos · revisão das Aulas 1 a 12 · sozinho ou em equipe de 2 a 6', VW / 2, 622);
    ctx.globalAlpha = 1;
    if (t > 23.7 && !botaoFim) {
      botaoFim = true;
      el.insertAdjacentHTML('beforeend', '<button class="btn" id="cineFim">Começar o projeto →</button>');
      document.getElementById('cineFim').addEventListener('click', () => fechar());
    }
  }

  function legenda(t) {
    const l = LEGENDAS.find(([a, b]) => t >= a && t <= b);
    if (!l) return;
    const [a, b, txt] = l, n = Math.floor((t - a) * 40), parte = txt.slice(0, n);
    ctx.globalAlpha = t > b - .3 ? lim((b - t) / .3) : 1;
    ctx.font = '800 32px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lw = ctx.measureText(txt).width + 56;
    ctx.fillStyle = 'rgba(5,11,20,.62)'; rr(VW / 2 - lw / 2, VH - BARRA - 70, lw, 60, 14); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.fillText(parte, VW / 2, VH - BARRA - 40);
    ctx.globalAlpha = 1;
  }

  function quadro(agora) {
    const t = (agora - t0) / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr * esc, 0, 0, dpr * esc, dpr * ox, dpr * oy);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
    if (t < 10) {
      const z = 1 + ease(lim((t - 5.2) / 4.6)) * 2.4, fx = PREDIO.x + PREDIO.w / 2, fy = VH - BARRA - PREDIO.h - 20;
      ctx.save(); ctx.translate(fx, fy); ctx.scale(z, z); ctx.translate(-fx, -fy + (z - 1) * 30); cidade(t); ctx.restore();
    } else if (t < 15.6) chamados(t);
    else if (t < 21.5) equipe(t);
    else titulo(t);
    const cortes = [10, 15.6, 21.5];
    let preto = t < .9 ? 1 - t / .9 : 0;
    cortes.forEach((c) => { preto = Math.max(preto, 1 - Math.abs(t - c) / .45); });
    if (preto > 0) { ctx.fillStyle = `rgba(0,0,0,${preto.toFixed(3)})`; ctx.fillRect(0, 0, VW, VH); }
    const barra = t < 21.5 ? BARRA : BARRA * (1 - ease(lim((t - 21.5) / .8)));
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, barra); ctx.fillRect(0, VH - barra, VW, barra);
    legenda(t);
    ctx.restore();
    raf = requestAnimationFrame(quadro);
  }

  function medir() {
    if (!cv) return;
    dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + 'px'; cv.style.height = h + 'px';
    esc = Math.min(w / VW, h / VH); ox = (w - VW * esc) / 2; oy = (h - VH * esc) / 2;
  }
  function tecla(e) { if (e.key === 'Escape' || (e.key === 'Enter' && botaoFim)) fechar(); }
  function comecar() {
    Musica.iniciar(); Musica.tocar('menu');
    el.innerHTML = '<canvas id="cineCv" aria-label="Abertura do jogo"></canvas><button id="cineSkip" aria-label="Pular abertura">Pular ›</button>';
    cv = el.querySelector('#cineCv'); ctx = cv.getContext('2d');
    el.querySelector('#cineSkip').addEventListener('click', () => fechar());
    medir(); window.addEventListener('resize', medir);
    tocados = {}; botaoFim = false; t0 = performance.now();
    raf = requestAnimationFrame(quadro);
  }
  function abrir() {
    if (el) return;
    el = document.createElement('div'); el.id = 'cine';
    el.innerHTML = `<div class="cine-gate">
      <svg width="96" height="96" viewBox="0 0 34 34" aria-hidden="true"><polygon points="17,3 31,10 17,17 3,10" fill="#F1C40F"/><polygon points="3,10 17,17 17,31 3,24" fill="#E74C3C"/><polygon points="31,10 17,17 17,31 31,24" fill="#2F80ED"/></svg>
      <h1>Xaxado Software</h1><p>Do pedido vago à matriz de rastreabilidade</p>
      <button class="btn" id="cineGo">▶ Começar</button>
      <button class="cine-link" id="cinePular">Pular a abertura</button>
      <small>Melhor com som 🔊</small></div>`;
    document.body.appendChild(el);
    el.querySelector('#cineGo').addEventListener('click', comecar);
    el.querySelector('#cinePular').addEventListener('click', () => { Musica.iniciar(); fechar(); });
    document.addEventListener('keydown', tecla);
  }
  function fechar(rapido) {
    if (!el) return;
    if (raf) cancelAnimationFrame(raf); raf = null;
    window.removeEventListener('resize', medir); document.removeEventListener('keydown', tecla);
    const alvo = el; el = null; cv = null;
    const fim = () => { alvo.remove(); const n = document.getElementById('inNome'); if (n) n.focus(); };
    if (rapido) fim(); else { alvo.classList.add('saindo'); setTimeout(fim, 450); }
  }
  return { abrir, fechar, aberta: () => !!el };
})();

function colegasTxt() { return Object.values(estado.colegas || {}).filter((n) => n && n !== estado.nome).join(', '); }

retomar().then((r) => { render(); if (!r) Cinematica.abrir(); });

</script>
